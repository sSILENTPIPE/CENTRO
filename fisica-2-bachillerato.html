      if(!animando)pintar();
    });
    d.appendChild(sel);zona.appendChild(d);
  });

  (opts.mandos||[]).forEach(function(m){
    v[m.id]=m.val;
    var d=document.createElement("label");d.className="mando";
    var fila=document.createElement("div");fila.className="mando__fila";
    var sp2=document.createElement("span");sp2.textContent=m.label;
    var b=document.createElement("b");
    fila.appendChild(sp2);fila.appendChild(b);d.appendChild(fila);
    var inp=document.createElement("input");inp.type="range";
    inp.min=m.min;inp.max=m.max;inp.step=m.step;inp.value=m.val;
    function pinta(){b.textContent=m.texto?m.texto(v[m.id]):(nfmt(v[m.id],m.dec)+(m.unidad?" "+m.unidad:""));}
    inp.addEventListener("input",function(){
      v[m.id]=parseFloat(inp.value);pinta();
      if(opts.alCambiar)opts.alCambiar(v,estado);
      if(!animando)pintar();
    });
    pinta();d.appendChild(inp);zona.appendChild(d);
  });

  if(opts.botones&&opts.botones.length){
    var cajaB=document.createElement("div");cajaB.className="mando sim__botones";
    opts.botones.forEach(function(bt){
      var b=document.createElement("button");b.className="btn btn--fantasma";b.textContent=bt.txt;
      b.addEventListener("click",function(){bt.accion(v,estado,b);if(!animando)pintar();});
      cajaB.appendChild(b);
    });
    zona.appendChild(cajaB);
  }

  function ajustar(){
    var w=canvas.clientWidth||600;
    var alto=Math.round(w*(opts.ratio||0.52));
    alto=Math.max(opts.minAlto||200,Math.min(opts.maxAlto||420,alto));
    var dpr=window.devicePixelRatio||1;
    canvas.width=w*dpr;canvas.height=alto*dpr;
    canvas.style.height=alto+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    W=w;H=alto;
  }

  var contador=0;
  function lecturas(){
    if(!opts.lecturas)return;
    var arr=opts.lecturas(v,estado,(performance.now()-t0)/1000);
    var html="";
    for(var i=0;i<arr.length;i++)html+="<span>"+arr[i][0]+" <b>"+arr[i][1]+"</b></span>";
    lect.innerHTML=html;
  }
  function pintar(){
    ctx.clearRect(0,0,W,H);
    opts.dibujar(ctx,W,H,v,(performance.now()-t0)/1000,estado);
    if(contador++%5===0)lecturas();
  }
  function bucle(){pintar();raf=requestAnimationFrame(bucle);}

  if(opts.iniciar)opts.iniciar(v,estado);
  ajustar();
  var onResize=function(){ajustar();if(!animando)pintar();};
  window.addEventListener("resize",onResize);

  if(opts.raton){
    var pos=function(ev){
      var r=canvas.getBoundingClientRect();
      var cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
      var cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top;
      return {x:cx,y:cy};
    };
    canvas.addEventListener("mousemove",function(ev){var p=pos(ev);opts.raton(p.x,p.y,v,estado,W,H);if(!animando)pintar();});
    canvas.addEventListener("mouseleave",function(){opts.raton(null,null,v,estado,W,H);if(!animando)pintar();});
  }

  if(animando)bucle();else pintar();
  SIM_STOP.push(function(){if(raf)cancelAnimationFrame(raf);window.removeEventListener("resize",onResize);});
  return {canvas:canvas,v:v,pintar:pintar,estado:estado};
}

/* utilidades de dibujo */
function ejeH(ctx,x0,x1,y,color){ctx.strokeStyle=color||COL.gris;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();}
function txt(ctx,s,x,y,color,size,align){
  ctx.fillStyle=color||COL.tx2;
  ctx.font=(size||12)+"px 'Bricolage Grotesque', system-ui, sans-serif";
  ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(s,x,y);
}
function flecha(ctx,x1,y1,x2,y2,color,ancho){
  var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<0.5)return;
  var ux=dx/L,uy=dy/L,c=Math.min(6,L*0.4);
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=ancho||1.6;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-c*ux+c*0.5*uy,y2-c*uy-c*0.5*ux);
  ctx.lineTo(x2-c*ux-c*0.5*uy,y2-c*uy+c*0.5*ux);
  ctx.closePath();ctx.fill();
}

const SIMS={};

/* --- Tema 1: MAS --- */
SIMS.mas=function(host){
  return crearSim(host,{
    titulo:"Oscilador armónico: muelle y gráfica",
    nota:"Mueve los controles y observa cómo cambian x, v y a",
    ratio:0.5,
    mandos:[
      {id:"A",label:"Amplitud A",min:0.02,max:0.20,step:0.01,val:0.10,dec:2,unidad:"m"},
      {id:"T",label:"Periodo T",min:0.4,max:3,step:0.1,val:1.2,dec:1,unidad:"s"},
      {id:"f0",label:"Fase inicial φ₀",min:0,max:6.28,step:0.1,val:0,dec:2,unidad:"rad"}
    ],
    lecturas:function(v,e,t){
      var w=2*Math.PI/v.T,x=v.A*Math.sin(w*t+v.f0);
      return [["x =",nfmt(x,3)+" m"],["v =",nfmt(v.A*w*Math.cos(w*t+v.f0),2)+" m/s"],
              ["a =",nfmt(-v.A*w*w*Math.sin(w*t+v.f0),2)+" m/s²"],
              ["ω =",nfmt(w,2)+" rad/s"],["Eₘ ∝",nfmt(v.A*v.A*1000,1)+" (A²)"]];
    },
    dibujar:function(ctx,W,H,v,t){
      var w=2*Math.PI/v.T,yc=H*0.27,esc=(W*0.34)/0.20;
      var x=v.A*Math.sin(w*t+v.f0);
      var x0=W*0.14,xm=x0+W*0.36+x*esc;
      // guía y equilibrio
      ctx.setLineDash([4,4]);ctx.strokeStyle=COL.gris;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x0+W*0.36,yc-38);ctx.lineTo(x0+W*0.36,yc+30);ctx.stroke();ctx.setLineDash([]);
      txt(ctx,"equilibrio",x0+W*0.36,yc+40,COL.tx2,11,"center");
      // pared
      ctx.fillStyle=COL.tinta;ctx.fillRect(x0-10,yc-30,6,60);
      // muelle
      ctx.strokeStyle=COL.tx2;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0-4,yc);
      var n=14,L=xm-18-(x0-4);
      for(var i=0;i<=n;i++){var xx=x0-4+L*i/n,yy=yc+(i>0&&i<n?(i%2?-11:11):0);ctx.lineTo(xx,yy);}
      ctx.lineTo(xm-18,yc);ctx.stroke();
      // masa
      ctx.fillStyle=COL.campo;ctx.fillRect(xm-18,yc-20,36,40);
      txt(ctx,"m",xm,yc,"#fff",13,"center");
      // vectores v y a
      flecha(ctx,xm,yc-32,xm+v.A*w*Math.cos(w*t+v.f0)*26,yc-32,COL.verde,2);
      txt(ctx,"v",xm+6,yc-44,COL.verde,12);
      flecha(ctx,xm,yc+34,xm-v.A*w*w*Math.sin(w*t+v.f0)*8,yc+34,COL.rojo,2);
      txt(ctx,"a",xm+6,yc+48,COL.rojo,12);
      // gráfica
      var gy=H*0.74,gx0=W*0.08,gx1=W*0.94,dur=2.4*v.T;
      ejeH(ctx,gx0,gx1,gy);
      ctx.strokeStyle=COL.gris;ctx.beginPath();ctx.moveTo(gx0,gy-52);ctx.lineTo(gx0,gy+52);ctx.stroke();
      txt(ctx,"x(t)",gx0-4,gy-58,COL.tx2,12,"left");
      ctx.strokeStyle=COL.campo;ctx.lineWidth=2;ctx.beginPath();
      for(var p=0;p<=240;p++){
        var tt=t-dur+dur*p/240;
        var xx2=gx0+(gx1-gx0)*p/240,yy2=gy-v.A*Math.sin(w*tt+v.f0)*(46/0.20);
        p?ctx.lineTo(xx2,yy2):ctx.moveTo(xx2,yy2);
      }
      ctx.stroke();
      ctx.fillStyle=COL.energia;ctx.beginPath();ctx.arc(gx1,gy-x*(46/0.20),5,0,6.29);ctx.fill();
      txt(ctx,"ahora",gx1-6,gy+62,COL.tx2,11,"right");
      txt(ctx,"−2,4 T",gx0,gy+62,COL.tx2,11,"left");
    }
  });
};

/* --- Tema 2: onda viajera --- */
SIMS.onda=function(host){
  return crearSim(host,{
    titulo:"Onda armónica que se propaga",
    nota:"El punto naranja solo sube y baja: la materia no viaja con la onda",
    ratio:0.46,
    mandos:[
      {id:"A",label:"Amplitud A",min:0.1,max:1,step:0.05,val:0.6,dec:2,unidad:"m"},
      {id:"lam",label:"Longitud de onda λ",min:0.5,max:4,step:0.1,val:2,dec:1,unidad:"m"},
      {id:"T",label:"Periodo T",min:0.5,max:4,step:0.1,val:2,dec:1,unidad:"s"}
    ],
    selects:[{id:"sent",label:"Sentido de propagación",val:"1",opciones:[{v:"1",t:"Hacia +X"},{v:"-1",t:"Hacia −X"}]}],
    lecturas:function(v){
      var s=parseFloat(v.sent);
      return [["f =",nfmt(1/v.T,2)+" Hz"],["ω =",nfmt(2*Math.PI/v.T,2)+" rad/s"],
              ["k =",nfmt(2*Math.PI/v.lam,2)+" rad/m"],
              ["v = λ/T =",nfmt(s*v.lam/v.T,2)+" m/s"],
              ["v vibración máx =",nfmt(v.A*2*Math.PI/v.T,2)+" m/s"]];
    },
    dibujar:function(ctx,W,H,v,t){
      var s=parseFloat(v.sent),yc=H*0.5,mx=W*0.06,Lx=W-mx*2,mts=8,esc=Lx/mts,ampl=Math.min(H*0.33,v.A*H*0.33);
      ejeH(ctx,mx,W-mx,yc);
      for(var m=0;m<=mts;m++){
        var xx=mx+m*esc;ctx.strokeStyle=COL.grisC;ctx.beginPath();ctx.moveTo(xx,yc-ampl-14);ctx.lineTo(xx,yc+ampl+14);ctx.stroke();
        if(m%2===0)txt(ctx,m+" m",xx,yc+ampl+26,COL.tx2,11,"center");
      }
      var w=2*Math.PI/v.T,k=2*Math.PI/v.lam;
      ctx.strokeStyle=COL.campo;ctx.lineWidth=2.4;ctx.beginPath();
      for(var p=0;p<=400;p++){
        var xm=mts*p/400,y=v.A*Math.sin(w*t-s*k*xm);
        var px=mx+xm*esc,py=yc-y*(ampl/Math.max(v.A,0.001));
        p?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
      ctx.stroke();
      // partícula marcada
      var xp=3,yp=v.A*Math.sin(w*t-s*k*xp);
      var pxp=mx+xp*esc,pyp=yc-yp*(ampl/Math.max(v.A,0.001));
      ctx.setLineDash([3,3]);ctx.strokeStyle=COL.energia;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(pxp,yc-ampl-6);ctx.lineTo(pxp,yc+ampl+6);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=COL.energia;ctx.beginPath();ctx.arc(pxp,pyp,7,0,6.29);ctx.fill();
      // longitud de onda
      var x1=mx+1*esc,x2=x1+v.lam*esc;
      if(x2<W-mx){
        ctx.strokeStyle=COL.morado;ctx.lineWidth=1.4;
        ctx.beginPath();ctx.moveTo(x1,yc-ampl-24);ctx.lineTo(x2,yc-ampl-24);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x1,yc-ampl-29);ctx.lineTo(x1,yc-ampl-19);ctx.moveTo(x2,yc-ampl-29);ctx.lineTo(x2,yc-ampl-19);ctx.stroke();
        txt(ctx,"λ",(x1+x2)/2,yc-ampl-36,COL.morado,13,"center");
      }
      flecha(ctx,W/2-s*26,yc+ampl+44,W/2+s*26,yc+ampl+44,COL.campo,2);
      txt(ctx,"propagación",W/2,yc+ampl+58,COL.campo,11,"center");
    }
  });
};

/* --- Tema 3: espectro electromagnético --- */
SIMS.espectro=function(host){
  var BANDAS=[
    {f:[1e4,3e8],n:"Ondas de radio",c:"#6E7DAE"},
    {f:[3e8,3e11],n:"Microondas",c:"#4B5FBF"},
    {f:[3e11,3.85e14],n:"Infrarrojo",c:"#B23A2E"},
    {f:[3.85e14,7.9e14],n:"Visible",c:"#2E9E5B"},
    {f:[7.9e14,3e16],n:"Ultravioleta",c:"#6B3FA0"},
    {f:[3e16,3e19],n:"Rayos X",c:"#2B4CE0"},
    {f:[3e19,1e23],n:"Rayos gamma",c:"#14203F"}
  ];
  function colorVisible(lnm){
    if(lnm>=645)return "#E2372B";if(lnm>=585)return "#F0A202";if(lnm>=565)return "#E8D51E";
    if(lnm>=490)return "#31A354";if(lnm>=440)return "#2B4CE0";return "#6B3FA0";
  }
  return crearSim(host,{
    titulo:"Espectro electromagnético",
    nota:"Todas son la misma onda: solo cambia la frecuencia",
    anim:false,ratio:0.34,minAlto:190,
    mandos:[{id:"lf",label:"Frecuencia (escala logarítmica)",min:4,max:23,step:0.01,val:14.7,
      texto:function(x){return nfmt(Math.pow(10,x),2)+" Hz";}}],
    lecturas:function(v){
      var f=Math.pow(10,v.lf),lam=3e8/f,E=6.63e-34*f,b="";
      BANDAS.forEach(function(B){if(f>=B.f[0]&&f<B.f[1])b=B.n;});
      return [["Banda:",b],["λ =",nfmt(lam,2)+" m"],["E = hf =",nfmt(E,2)+" J"],["E =",nfmt(E/1.6e-19,3)+" eV"]];
    },
    dibujar:function(ctx,W,H,v){
      var mx=W*0.05,bw=W-2*mx,by=H*0.34,bh=42,lmin=4,lmax=23;
      BANDAS.forEach(function(B){
        var a=mx+bw*(Math.log10(B.f[0])-lmin)/(lmax-lmin);
        var b=mx+bw*(Math.log10(B.f[1])-lmin)/(lmax-lmin);
        ctx.fillStyle=B.c;ctx.globalAlpha=.85;ctx.fillRect(a,by,b-a,bh);ctx.globalAlpha=1;
        if(b-a>54)txt(ctx,B.n,(a+b)/2,by+bh/2,"#fff",11,"center");
      });
      ctx.strokeStyle=COL.gris;ctx.strokeRect(mx,by,bw,bh);
      for(var e=lmin;e<=lmax;e+=2){
        var x=mx+bw*(e-lmin)/(lmax-lmin);
        ctx.strokeStyle=COL.gris;ctx.beginPath();ctx.moveTo(x,by+bh);ctx.lineTo(x,by+bh+5);ctx.stroke();
        txt(ctx,"10"+sup(e),x,by+bh+15,COL.tx2,10,"center");
      }
      txt(ctx,"frecuencia (Hz)",W/2,by+bh+34,COL.tx2,11,"center");
      var f=Math.pow(10,v.lf),xm=mx+bw*(v.lf-lmin)/(lmax-lmin);
      ctx.strokeStyle=COL.tinta;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xm,by-16);ctx.lineTo(xm,by+bh+2);ctx.stroke();
      ctx.fillStyle=COL.tinta;ctx.beginPath();ctx.arc(xm,by-18,5,0,6.29);ctx.fill();
      // ventana visible ampliada
      var vy=H*0.86,vx0=W*0.28,vx1=W*0.72;
      for(var i=0;i<=100;i++){
        var lnm=380+(780-380)*i/100;
        ctx.fillStyle=colorVisible(lnm);
        ctx.fillRect(vx1-(vx1-vx0)*i/100-2,vy-13,4,26);
      }
      ctx.strokeStyle=COL.gris;ctx.strokeRect(vx0,vy-13,vx1-vx0,26);
      txt(ctx,"380 nm",vx0-6,vy,COL.tx2,10,"right");
      txt(ctx,"780 nm",vx1+6,vy,COL.tx2,10,"left");
      txt(ctx,"luz visible",W/2,vy-24,COL.tx2,11,"center");
      var lam=3e8/f*1e9;
      if(lam>=380&&lam<=780){
        var xv=vx1-(vx1-vx0)*(lam-380)/400;
        ctx.strokeStyle=COL.tinta;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xv,vy-18);ctx.lineTo(xv,vy+18);ctx.stroke();
      }
    }
  });
};

/* --- Tema 4: óptica geométrica --- */
SIMS.optica=function(host){
  return crearSim(host,{
    titulo:"Formación de imágenes con el convenio DIN",
    nota:"Trazado de rayos en lentes delgadas y espejos esféricos",
    anim:false,ratio:0.5,
    selects:[{id:"tipo",label:"Sistema óptico",val:"lc",numerico:false,opciones:[
      {v:"lc",t:"Lente convergente"},{v:"ld",t:"Lente divergente"},
      {v:"ec",t:"Espejo cóncavo"},{v:"ex",t:"Espejo convexo"}]}],
    mandos:[
      {id:"fo",label:"Distancia focal |f|",min:4,max:20,step:1,val:10,dec:0,unidad:"cm"},
      {id:"so",label:"Objeto: distancia al sistema",min:3,max:45,step:1,val:30,dec:0,unidad:"cm"},
      {id:"yo",label:"Objeto: altura",min:1,max:6,step:0.5,val:4,dec:1,unidad:"cm"}
    ],
    lecturas:function(v){
      var r=SIMS._optica(v);
      if(!isFinite(r.sp)||Math.abs(r.sp)>1e6)return [["s′ =","infinito"],["Imagen:","no se forma (objeto en el foco)"]];
      return [["s =",nfmt(r.s,0)+" cm"],["s′ =",nfmt(r.sp,1)+" cm"],["β =",nfmt(r.b,2)],
              ["y′ =",nfmt(r.yp,2)+" cm"],
              ["Imagen:",(r.real?"real":"virtual")+", "+(r.b<0?"invertida":"derecha")+" y "+(Math.abs(r.b)>1.01?"mayor":(Math.abs(r.b)<0.99?"menor":"igual"))]];
    },
    dibujar:function(ctx,W,H,v){
      var r=SIMS._optica(v),cx=W*0.5,cy=H*0.52,esc=Math.min(W*0.46/48,7.5);
      var espejo=r.espejo,izq=12,der=W-12,hh=Math.min(H*0.36,62);
      ejeH(ctx,izq,der,cy);
      // elemento óptico
      ctx.strokeStyle=COL.tinta;ctx.lineWidth=2.6;
      if(espejo){
        var curv=(v.tipo==="ec"?1:-1)*15;
        ctx.beginPath();ctx.moveTo(cx+curv,cy-hh);ctx.quadraticCurveTo(cx-curv,cy,cx+curv,cy+hh);ctx.stroke();
      }else{
        ctx.beginPath();ctx.moveTo(cx,cy-hh);ctx.lineTo(cx,cy+hh);ctx.stroke();
        var d=(v.tipo==="lc")?1:-1;
        ctx.beginPath();ctx.moveTo(cx-7*d,cy-hh+8);ctx.lineTo(cx,cy-hh);ctx.lineTo(cx+7*d,cy-hh+8);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx-7*d,cy+hh-8);ctx.lineTo(cx,cy+hh);ctx.lineTo(cx+7*d,cy+hh-8);ctx.stroke();
      }
      // puntos característicos
      function punto(xc,et){
        var px=cx+xc*esc;if(px<izq||px>der)return;
        ctx.fillStyle=COL.tx2;ctx.beginPath();ctx.arc(px,cy,3.5,0,6.29);ctx.fill();
        txt(ctx,et,px,cy+17,COL.tx2,12,"center");
      }
      if(espejo){punto(r.f1,"F");punto(2*r.f1,"C");}
      else{punto(r.f1,"F′");punto(-r.f1,"F");}
      // objeto
      var ox=cx+r.s*esc,y=v.yo*esc;
      flecha(ctx,ox,cy,ox,cy-y,COL.tinta,2.6);
      txt(ctx,"objeto",ox,cy+17,COL.tinta,12,"center");

      ctx.lineWidth=1.6;
      function rayo(pts,color,dash){
        ctx.setLineDash(dash||[]);ctx.strokeStyle=color;ctx.beginPath();
        for(var i=0;i<pts.length;i++)i?ctx.lineTo(pts[i][0],pts[i][1]):ctx.moveTo(pts[i][0],pts[i][1]);
        ctx.stroke();ctx.setLineDash([]);
      }
      var fpx=r.f1*esc;
      if(espejo){
        // 1) paralelo al eje y reflejado pasando por F
        var m1=y/fpx;
        rayo([[ox,cy-y],[cx,cy-y]],COL.campo);
        rayo([[cx,cy-y],[izq,cy-y+m1*(izq-cx)]],COL.campo);
        if(!r.real)rayo([[cx,cy-y],[der,cy-y+m1*(der-cx)]],COL.campo,[5,4]);
        // 2) al vértice, reflejado simétrico respecto del eje
        var m2=y/(ox-cx);
        rayo([[ox,cy-y],[cx,cy]],COL.energia);
        rayo([[cx,cy],[izq,cy+m2*(izq-cx)]],COL.energia);
        if(!r.real)rayo([[cx,cy],[der,cy+m2*(der-cx)]],COL.energia,[5,4]);
      }else{
        // 1) paralelo al eje y refractado por F'
        var p1=y/fpx;
        rayo([[ox,cy-y],[cx,cy-y]],COL.campo);
        rayo([[cx,cy-y],[der,cy-y+p1*(der-cx)]],COL.campo);
        if(!r.real)rayo([[cx,cy-y],[izq,cy-y+p1*(izq-cx)]],COL.campo,[5,4]);
        // 2) por el centro óptico, sin desviarse
        var p2=y/(cx-ox);
        rayo([[ox,cy-y],[der,cy+p2*(der-cx)]],COL.energia);
        if(!r.real)rayo([[ox,cy-y],[izq,cy+p2*(izq-cx)]],COL.energia,[5,4]);
      }
      // imagen
      if(isFinite(r.sp)&&Math.abs(r.sp*esc)<W*0.48){
        var ix=cx+r.sp*esc,iy=cy-r.yp*esc;
        flecha(ctx,ix,cy,ix,iy,r.real?COL.verde:COL.rojo,2.8);
        txt(ctx,r.real?"imagen real":"imagen virtual",ix,r.yp>0?cy+17:cy-6,r.real?COL.verde:COL.rojo,12,"center");
      }
      txt(ctx,"la luz llega desde la izquierda",der,16,COL.tx2,11,"right");
    }
  });
};
SIMS._optica=function(v){
  var espejo=(v.tipo==="ec"||v.tipo==="ex"),s=-v.so,sp,b,f1;
  if(espejo){
    f1=(v.tipo==="ec"?-1:1)*v.fo;          // cóncavo: R<0 y f<0 en el convenio DIN
    sp=1/(1/f1-1/s);b=-sp/s;
    return {s:s,sp:sp,b:b,yp:b*v.yo,real:sp<0,espejo:true,f1:f1};
  }
  f1=(v.tipo==="lc"?1:-1)*v.fo;            // f' positiva en convergentes
  sp=1/(1/f1+1/s);b=sp/s;
  return {s:s,sp:sp,b:b,yp:b*v.yo,real:sp>0,espejo:false,f1:f1};
};

/* --- Tema 5: órbitas y ley de áreas --- */
SIMS.kepler=function(host){
  return crearSim(host,{
    titulo:"Órbita y segunda ley de Kepler",
    nota:"El sector sombreado tiene siempre la misma área: la velocidad areolar es constante",
    ratio:0.62,maxAlto:400,
    mandos:[{id:"vi",label:"Velocidad inicial (respecto de la circular)",min:0.55,max:1.38,step:0.01,val:0.82,dec:2,unidad:"× v_circ"}],
    botones:[{txt:"Reiniciar órbita",accion:function(v,e){SIMS._kepIni(v,e);}}],
    iniciar:function(v,e){SIMS._kepIni(v,e);},
    alCambiar:function(v,e){SIMS._kepIni(v,e);},
    lecturas:function(v,e){
      if(!e.p)return [];
      var r=Math.hypot(e.p.x,e.p.y),vel=Math.hypot(e.p.vx,e.p.vy);
      var E=0.5*vel*vel-1/r;
      return [["r =",nfmt(r,2)+" ua"],["v =",nfmt(vel,2)+" u.a."],
              ["Energía mecánica:",E<0?"negativa (órbita cerrada)":"positiva (escapa)"],
              ["Tipo de órbita:",E<-0.001?(Math.abs(v.vi-1)<0.02?"circular":"elíptica"):(E>0.001?"hiperbólica":"parabólica")]];
    },
    dibujar:function(ctx,W,H,v,t,e){
      var cx=W*0.5,cy=H*0.5,esc=Math.min(W,H)*0.17;
      // integración
      for(var k=0;k<8;k++)SIMS._kepPaso(e,0.0025);
      // estela
      ctx.strokeStyle=COL.gris;ctx.lineWidth=1.2;ctx.beginPath();
      e.estela.forEach(function(p,i){var X=cx+p.x*esc,Y=cy+p.y*esc;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
      ctx.stroke();
      // sector barrido reciente
      if(e.sector.length>2){
        ctx.fillStyle="rgba(233,147,11,.30)";ctx.beginPath();ctx.moveTo(cx,cy);
        e.sector.forEach(function(p){ctx.lineTo(cx+p.x*esc,cy+p.y*esc);});
        ctx.closePath();ctx.fill();
      }
      // estrella
      var g=ctx.createRadialGradient(cx,cy,2,cx,cy,16);
      g.addColorStop(0,"#F7C948");g.addColorStop(1,"rgba(247,201,72,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,16,0,6.29);ctx.fill();
      ctx.fillStyle=COL.energia;ctx.beginPath();ctx.arc(cx,cy,7,0,6.29);ctx.fill();
      // planeta
      var X=cx+e.p.x*esc,Y=cy+e.p.y*esc;
      ctx.strokeStyle=COL.campo;ctx.lineWidth=1;
      ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(X,Y);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=COL.campo;ctx.beginPath();ctx.arc(X,Y,7,0,6.29);ctx.fill();
      flecha(ctx,X,Y,X+e.p.vx*esc*0.30,Y+e.p.vy*esc*0.30,COL.verde,2);
      txt(ctx,"v",X+e.p.vx*esc*0.3+7,Y+e.p.vy*esc*0.3,COL.verde,12);
    }
  });
};
SIMS._kepIni=function(v,e){
  e.p={x:1.4,y:0,vx:0,vy:v.vi*Math.sqrt(1/1.4)};
  e.estela=[];e.sector=[];
};
SIMS._kepPaso=function(e,dt){
  var p=e.p,r=Math.hypot(p.x,p.y);
  if(r<0.08){SIMS._kepIni({vi:0.82},e);return;}
  var a=-1/(r*r*r);
  p.vx+=a*p.x*dt;p.vy+=a*p.y*dt;
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  e.estela.push({x:p.x,y:p.y});if(e.estela.length>1400)e.estela.shift();
  e.sector.push({x:p.x,y:p.y});if(e.sector.length>70)e.sector.shift();
  if(Math.hypot(p.x,p.y)>9)SIMS._kepIni({vi:0.82},e);
};

/* --- Tema 7: campo eléctrico de dos cargas --- */
SIMS.campoE=function(host){
  var K=9e9;
  function campo(v,X,Y,cx,cy,ppm){
    var d=v.d/100/2,q1=v.q1*1e-6,q2=v.q2*1e-6;
    var x=(X-cx)/ppm,y=(Y-cy)/ppm;
    var r1=Math.hypot(x+d,y),r2=Math.hypot(x-d,y);
    if(r1<0.012||r2<0.012)return null;
    var e1=K*q1/(r1*r1),e2=K*q2/(r2*r2);
    var Ex=e1*(x+d)/r1+e2*(x-d)/r2, Ey=e1*y/r1+e2*y/r2;
    return {Ex:Ex,Ey:Ey,E:Math.hypot(Ex,Ey),V:K*q1/r1+K*q2/r2};
  }
  return crearSim(host,{
    titulo:"Campo y potencial de dos cargas puntuales",
    nota:"Pasa el cursor por el mapa para leer E y V en ese punto",
    anim:false,ratio:0.56,maxAlto:380,
    mandos:[
      {id:"q1",label:"Carga izquierda q₁",min:-5,max:5,step:0.5,val:3,dec:1,unidad:"µC"},
      {id:"q2",label:"Carga derecha q₂",min:-5,max:5,step:0.5,val:-3,dec:1,unidad:"µC"},
      {id:"d",label:"Separación",min:6,max:30,step:1,val:16,dec:0,unidad:"cm"}
    ],
    raton:function(x,y,v,e){e.mx=x;e.my=y;},
    lecturas:function(v,e){
      var base=[["q₁ =",nfmt(v.q1,1)+" µC"],["q₂ =",nfmt(v.q2,1)+" µC"],["d =",nfmt(v.d,0)+" cm"]];
      if(e.lect)base=base.concat(e.lect);
      else base.push(["","pasa el cursor por el mapa"]);
      return base;
    },
    dibujar:function(ctx,W,H,v,t,e){
      var cx=W/2,cy=H/2,ppm=Math.min(W,H)/0.62;
      var paso=Math.max(26,Math.round(W/22));
      for(var X=paso/2;X<W;X+=paso)for(var Y=paso/2;Y<H;Y+=paso){
        var c=campo(v,X,Y,cx,cy,ppm);if(!c||c.E<1)continue;
        var L=Math.min(paso*0.46,4+10*Math.log10(c.E));
        if(!isFinite(L)||L<2)continue;
        var ux=c.Ex/c.E,uy=c.Ey/c.E;
        var alpha=Math.min(.9,Math.max(.18,Math.log10(c.E)/7));
        ctx.globalAlpha=alpha;
        flecha(ctx,X-ux*L,Y-uy*L,X+ux*L,Y+uy*L,COL.campo,1.4);
        ctx.globalAlpha=1;
      }
      // cargas
      [[-v.d/200,v.q1],[v.d/200,v.q2]].forEach(function(p){
        var X=cx+p[0]*ppm,q=p[1];
        var rad=9+Math.abs(q)*1.6;
        ctx.fillStyle=q>=0?COL.rojo:COL.campo;
        ctx.beginPath();ctx.arc(X,cy,rad,0,6.29);ctx.fill();
        txt(ctx,q>=0?"+":"−",X,cy,"#fff",16,"center");
      });
      // lectura en el cursor
      e.lect=null;
      if(e.mx!=null){
        var c2=campo(v,e.mx,e.my,cx,cy,ppm);
        if(c2){
          ctx.strokeStyle=COL.energia;ctx.lineWidth=1.5;
          ctx.beginPath();ctx.arc(e.mx,e.my,7,0,6.29);ctx.stroke();
          var Lm=34;
          flecha(ctx,e.mx,e.my,e.mx+c2.Ex/c2.E*Lm,e.my+c2.Ey/c2.E*Lm,COL.energia,2.2);
          e.lect=[["E =",nfmt(c2.E,2)+" N/C"],["V =",nfmt(c2.V,2)+" V"]];
        }
      }
    }
  });
};

SIMS.lorentz=function(host){
  var PART={
    proton:{n:"Protón",m:1.67e-27,q:1.6e-19,c:COL.rojo},
    electron:{n:"Electrón",m:9.11e-31,q:-1.6e-19,c:COL.campo},

      {v:"proton",t:"Protón"},{v:"electron",t:"Electrón"},{v:"alfa",t:"Partícula alfa"}]}],

      {id:"v",label:"Velocidad",min:0.5,max:8,step:0.1,val:2,dec:1,unidad:"·10⁶ m/s"},
      {id:"B",label:"Campo magnético B",min:0.1,max:2,step:0.05,val:0.5,dec:2,unidad:"T"}
    ],
    lecturas:function(v){
      var P=PART[v.p],vel=v.v*1e6,q=Math.abs(P.q);
      var F=q*vel*v.B,r=P.m*vel/(q*v.B),T=2*Math.PI*P.m/(q*v.B);
      return [["F = qvB =",nfmt(F,2)+" N"],["r = mv/qB =",nfmt(r,3)+" m"],
              ["T =",nfmt(T,2)+" s"],["f =",nfmt(1/T,2)+" Hz"],

    },
    dibujar:function(ctx,W,H,v,t){
      var P=PART[v.p],vel=v.v*1e6,q=Math.abs(P.q);
      var r=P.m*vel/(q*v.B),w=q*v.B/P.m;
      var rref=1.67e-27*2e6/(1.6e-19*0.5);
      var rpx=Math.max(16,Math.min(H*0.40,90*Math.sqrt(r/rref)));
      // campo entrante
      ctx.strokeStyle=COL.gris;ctx.lineWidth=1.2;
      for(var X=22;X<W-10;X+=34)for(var Y=22;Y<H-10;Y+=34){
        ctx.beginPath();ctx.moveTo(X-4,Y-4);ctx.lineTo(X+4,Y+4);ctx.moveTo(X+4,Y-4);ctx.lineTo(X-4,Y+4);ctx.stroke();
      }
      txt(ctx,"B entrante",W-14,16,COL.tx2,11,"right");
      var cx=W/2,cy=H/2,signo=P.q>0?1:-1;
      ctx.strokeStyle=COL.grisC;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cx,cy,rpx,0,6.29);ctx.stroke();
      var ang=signo*w*t*1e-8+Math.PI;
      var px=cx+rpx*Math.cos(ang),py=cy+rpx*Math.sin(ang);
      // vectores
      var vx=-signo*Math.sin(ang),vy=signo*Math.cos(ang);
      flecha(ctx,px,py,px+vx*42,py+vy*42,COL.verde,2.2);
      txt(ctx,"v",px+vx*52,py+vy*52,COL.verde,12,"center");
      flecha(ctx,px,py,px+(cx-px)*0.42,py+(cy-py)*0.42,COL.rojo,2.2);
      txt(ctx,"F",px+(cx-px)*0.52,py+(cy-py)*0.52,COL.rojo,12,"center");
      ctx.fillStyle=P.c;ctx.beginPath();ctx.arc(px,py,8,0,6.29);ctx.fill();
      txt(ctx,P.q>0?"+":"−",px,py,"#fff",13,"center");
      // radio
      ctx.setLineDash([4,4]);ctx.strokeStyle=COL.gris;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();ctx.setLineDash([]);
      txt(ctx,"r = "+nfmt(r,3)+" m",cx+(px-cx)/2,cy+(py-cy)/2-10,COL.tx2,11,"center");
      txt(ctx,PART[v.p].n,14,16,P.c,12,"left");
    }
  });
};

SIMS.induccion=function(host){
  return crearSim(host,{
    titulo:"Espira giratoria: cómo nace la corriente alterna",
    nota:"La fem es máxima justo cuando el flujo vale cero",
    ratio:0.46,
    mandos:[
      {id:"rpm",label:"Velocidad de giro",min:120,max:3000,step:60,val:600,dec:0,unidad:"rpm"},
      {id:"B",label:"Campo magnético B",min:0.05,max:1,step:0.05,val:0.4,dec:2,unidad:"T"},
      {id:"N",label:"Número de espiras N",min:1,max:200,step:1,val:50,dec:0}
    ],
    lecturas:function(v,e,t){
      var w=v.rpm*2*Math.PI/60,S=0.01,e0=v.N*v.B*S*w,ang=w*t*0.25;
      return [["ω =",nfmt(w,1)+" rad/s"],["f =",nfmt(w/(2*Math.PI),1)+" Hz"],
              ["Φ =",nfmt(v.N*v.B*S*Math.cos(ang),3)+" Wb"],
              ["ε =",nfmt(e0*Math.sin(ang),2)+" V"],
              ["ε₀ =",nfmt(e0,2)+" V"],["ε eficaz =",nfmt(e0/Math.SQRT2,2)+" V"]];
    },
    dibujar:function(ctx,W,H,v,t){
      var w=v.rpm*2*Math.PI/60,ang=w*t*0.25,S=0.01,e0=v.N*v.B*S*w;
      var pw=W*0.40,cx=pw/2,cy=H/2;

      txt(ctx,"B",pw-18,14,COL.tx2,12,"right");
      // espira en perspectiva
      var an=Math.abs(Math.cos(ang)),hh=Math.min(H*0.3,58);
      ctx.strokeStyle=COL.campo;ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(cx,cy,Math.max(3,hh*0.62*Math.abs(Math.sin(ang))),hh,0,0,6.29);ctx.stroke();
      // eje
      ctx.strokeStyle=COL.tinta;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cx,cy-hh-14);ctx.lineTo(cx,cy+hh+14);ctx.stroke();
      // normal de la espira
      flecha(ctx,cx,cy,cx+Math.cos(ang)*42,cy-Math.sin(ang)*0,COL.energia,2);
      txt(ctx,"normal",cx+Math.cos(ang)*50,cy-12,COL.energia,11,"center");
      txt(ctx,"flujo ∝ cos α",cx,H-12,COL.tx2,11,"center");
      // gráfica
      var gx0=W*0.46,gx1=W-14,gy=H/2,amp=Math.min(H*0.36,62);
      ejeH(ctx,gx0,gx1,gy);
      ctx.strokeStyle=COL.gris;ctx.beginPath();ctx.moveTo(gx0,gy-amp-6);ctx.lineTo(gx0,gy+amp+6);ctx.stroke();
      var per=2*Math.PI/(w*0.25),dur=2.2*per;
      function curva(f,color,ancho,dash){
        ctx.setLineDash(dash||[]);ctx.strokeStyle=color;ctx.lineWidth=ancho;ctx.beginPath();
        for(var p=0;p<=200;p++){
          var tt=t-dur+dur*p/200,X=gx0+(gx1-gx0)*p/200,Y=gy-f(tt)*amp;
          p?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
        }
        ctx.stroke();ctx.setLineDash([]);
      }
      curva(function(tt){return Math.cos(w*tt*0.25);},COL.gris,1.6,[5,4]);
      curva(function(tt){return Math.sin(w*tt*0.25);},COL.campo,2.4);
      ctx.fillStyle=COL.energia;ctx.beginPath();ctx.arc(gx1,gy-Math.sin(ang)*amp,5,0,6.29);ctx.fill();
      txt(ctx,"ε(t)",gx0+4,gy-amp-16,COL.campo,12,"left");
      txt(ctx,"Φ(t)",gx0+40,gy-amp-16,COL.tx2,12,"left");
      txt(ctx,"ε₀ = "+nfmt(e0,1)+" V",gx1,gy+amp+18,COL.tx2,11,"right");
    }
  });
};

SIMS.relatividad=function(host){

    titulo:"Dilatación del tiempo y contracción de la longitud",

              ["L₀ = 100 m →",nfmt(100/g,1)+" m vistos desde la Tierra"],
              ["Eₒ = mc² →",nfmt(g,2)+" mc² de energía total"]];
    },
    dibujar:function(ctx,W,H,v,t){

      function reloj(cx,cy,r,vueltas,etiqueta,color){

SIMS.fotoelectrico=function(host){
  var METALES={cesio:{n:"Cesio",W:2.14},sodio:{n:"Sodio",W:2.28},zinc:{n:"Zinc",W:4.30},cobre:{n:"Cobre",W:4.70},platino:{n:"Platino",W:5.65}};
  function colorLam(l){
    if(l<380)return "#8E44AD";if(l>=645)return "#E2372B";if(l>=585)return "#F0A202";
    if(l>=565)return "#E8D51E";if(l>=490)return "#31A354";if(l>=440)return "#2B4CE0";return "#6B3FA0";
  }
  return crearSim(host,{
    titulo:"Efecto fotoeléctrico",
    nota:"Baja la longitud de onda hasta superar la frecuencia umbral",
    ratio:0.46,
    selects:[{id:"metal",label:"Metal",val:"sodio",numerico:false,opciones:Object.keys(METALES).map(function(k){return {v:k,t:METALES[k].n};})}],
    mandos:[
      {id:"lam",label:"Longitud de onda de la luz",min:150,max:700,step:5,val:400,dec:0,unidad:"nm"},
      {id:"I",label:"Intensidad (número de fotones)",min:1,max:6,step:1,val:3,dec:0}
    ],
    lecturas:function(v){
      var M=METALES[v.metal],E=1240/v.lam,Ec=E-M.W,l0=1240/M.W;
      return [["E fotón =",nfmt(E,2)+" eV"],["W₀ =",nfmt(M.W,2)+" eV"],
              ["λ umbral =",nfmt(l0,0)+" nm"],["f umbral =",nfmt(M.W*1.6e-19/6.63e-34,2)+" Hz"],
              ["Ec máx =",Ec>0?nfmt(Ec,2)+" eV":"no hay emisión"],
              ["V frenado =",Ec>0?nfmt(Ec,2)+" V":"—"]];
    },
    dibujar:function(ctx,W,H,v,t,e){
      var M=METALES[v.metal],E=1240/v.lam,Ec=E-M.W,col=colorLam(v.lam);
      var placaX=W*0.58,cy=H*0.5;
      // placa metálica
      ctx.fillStyle="#6E7B96";ctx.fillRect(placaX,H*0.12,20,H*0.76);
      txt(ctx,M.n,placaX+10,H*0.06,COL.tx2,12,"center");
      // fotones
      if(!e.fot)e.fot=[];
      if(e.fot.length<v.I*4&&Math.random()<0.4)
        e.fot.push({x:0,y:H*0.18+Math.random()*H*0.64,vel:2.6+Math.random()});
      e.fot=e.fot.filter(function(f){
        f.x+=f.vel*1.8;
        if(f.x>=placaX){
          if(Ec>0&&Math.random()<0.9)e.el.push({x:placaX,y:f.y,v:Math.sqrt(Math.max(Ec,0))*2.4,ang:(Math.random()-0.5)*0.5});
          return false;
        }
        ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();
        for(var i=0;i<14;i++){
          var X=f.x-14+i,Y=f.y+Math.sin(i*0.9+f.x*0.1)*4;
          i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
        }
        ctx.stroke();return true;
      });
      // electrones
      if(!e.el)e.el=[];
      e.el=e.el.filter(function(el){
        el.x+=el.v*1.6;el.y+=el.ang*el.v;
        if(el.x>W)return false;
        ctx.fillStyle=COL.campo;ctx.beginPath();ctx.arc(el.x+20,el.y,5,0,6.29);ctx.fill();
        txt(ctx,"−",el.x+20,el.y,"#fff",11,"center");
        return true;
      });
      // diagrama de energías
      var bx=W*0.06,by=H*0.86,alto=H*0.66,escE=alto/7;
      ctx.strokeStyle=COL.gris;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by-alto);ctx.stroke();
      ctx.fillStyle=COL.gris;ctx.fillRect(bx,by-M.W*escE,26,M.W*escE);
      txt(ctx,"W₀",bx+34,by-M.W*escE/2,COL.tx2,11,"left");
      ctx.fillStyle=col;ctx.fillRect(bx+60,by-E*escE,26,E*escE);
      txt(ctx,"hf",bx+94,by-E*escE/2,COL.tx2,11,"left");
      if(Ec>0){
        ctx.fillStyle=COL.verde;ctx.fillRect(bx+120,by-Ec*escE,26,Ec*escE);
        txt(ctx,"Ec",bx+154,by-Ec*escE/2,COL.verde,11,"left");
      }else{
        txt(ctx,"hf < W₀: ningún electrón escapa",bx,by-alto-6,COL.rojo,12,"left");
      }
      txt(ctx,"energía (eV)",bx-2,by+16,COL.tx2,11,"left");
    }
  });
};

/* --- Tema 12: desintegración radiactiva --- */
SIMS.desintegracion=function(host){
  return crearSim(host,{
    titulo:"Ley de desintegración radiactiva",
    nota:"400 núcleos que se desintegran al azar; la curva sale sola",
    ratio:0.5,
    mandos:[{id:"T",label:"Periodo de semidesintegración",min:2,max:20,step:1,val:6,dec:0,unidad:"s"}],
    botones:[{txt:"Reiniciar muestra",accion:function(v,e){SIMS._desIni(e);}}],
    iniciar:function(v,e){SIMS._desIni(e);},
    lecturas:function(v,e){
      var lam=Math.LN2/v.T;
      return [["t =",nfmt(e.t,1)+" s"],["N =",e.N+" de 400"],
              ["N/N₀ =",nfmt(e.N/400,3)],["λ =",nfmt(lam,3)+" s⁻¹"],
              ["Actividad ≈",nfmt(lam*e.N,1)+" Bq"],["Periodos:",nfmt(e.t/v.T,2)]];
    },
    dibujar:function(ctx,W,H,v,t,e){
      var ahora=performance.now(),dt=Math.min(0.05,(ahora-e.ult)/1000);e.ult=ahora;
      var lam=Math.LN2/v.T,p=1-Math.exp(-lam*dt);
      e.t+=dt;
      for(var i=0;i<e.nuc.length;i++)if(!e.nuc[i].d&&Math.random()<p){e.nuc[i].d=true;e.N--;}
      e.hist.push({t:e.t,N:e.N});if(e.hist.length>900)e.hist.shift();
      // muestra
      var pw=W*0.46,cols=20,paso=Math.min(pw/cols,(H-20)/cols);
      var ox=(pw-cols*paso)/2+paso/2,oy=(H-cols*paso)/2+paso/2;
      for(var k=0;k<400;k++){
        var cxx=ox+(k%cols)*paso,cyy=oy+Math.floor(k/cols)*paso;
        ctx.fillStyle=e.nuc[k].d?"#DFE5F1":COL.campo;
        ctx.beginPath();ctx.arc(cxx,cyy,Math.max(2.2,paso*0.28),0,6.29);ctx.fill();
      }
      txt(ctx,"núcleos sin desintegrar",pw/2,H-4,COL.tx2,11,"center");
      // gráfica
      var gx0=W*0.54,gx1=W-14,gy1=H-26,gy0=18,dur=Math.max(6*v.T,e.t);
      ejeH(ctx,gx0,gx1,gy1);
      ctx.strokeStyle=COL.gris;ctx.beginPath();ctx.moveTo(gx0,gy0);ctx.lineTo(gx0,gy1);ctx.stroke();
      // curva teórica
      ctx.strokeStyle=COL.energia;ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.beginPath();
      for(var q=0;q<=120;q++){
        var tt=dur*q/120,NN=400*Math.exp(-lam*tt);
        var X=gx0+(gx1-gx0)*tt/dur,Y=gy1-(gy1-gy0)*NN/400;
        q?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
      }
      ctx.stroke();ctx.setLineDash([]);
      // curva experimental
      ctx.strokeStyle=COL.campo;ctx.lineWidth=2;ctx.beginPath();
      e.hist.forEach(function(h,i){
        var X=gx0+(gx1-gx0)*Math.min(h.t,dur)/dur,Y=gy1-(gy1-gy0)*h.N/400;
        i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
      });
      ctx.stroke();
      // marcas de semidesintegración
      for(var n=1;n<=5;n++){
        var X2=gx0+(gx1-gx0)*(n*v.T)/dur;if(X2>gx1)break;
        ctx.strokeStyle=COL.grisC;ctx.setLineDash([3,3]);
        ctx.beginPath();ctx.moveTo(X2,gy0);ctx.lineTo(X2,gy1);ctx.stroke();ctx.setLineDash([]);
        txt(ctx,n+"·T",X2,gy1+12,COL.tx2,10,"center");
        var Y2=gy1-(gy1-gy0)*(1/Math.pow(2,n));
        ctx.fillStyle=COL.energia;ctx.beginPath();ctx.arc(X2,Y2,3,0,6.29);ctx.fill();
      }
      txt(ctx,"N₀",gx0-4,gy0+4,COL.tx2,10,"right");
      txt(ctx,"N/2",gx0-4,gy1-(gy1-gy0)/2,COL.tx2,10,"right");
      txt(ctx,"N(t) = N₀e^(−λt)",gx1,gy0+6,COL.energia,11,"right");
    }
  });
};
SIMS._desIni=function(e){
  e.nuc=[];for(var i=0;i<400;i++)e.nuc.push({d:false});
  e.N=400;e.t=0;e.hist=[];e.ult=performance.now();
};

/* --- texto y fórmulas --- */
function texPlano(s){
  var g={alpha:"α",beta:"β",gamma:"γ",delta:"δ",Delta:"Δ",epsilon:"ε",varepsilon:"ε",eta:"η",
    theta:"θ",lambda:"λ",mu:"μ",nu:"ν",pi:"π",rho:"ρ",sigma:"σ",tau:"τ",phi:"φ",varphi:"φ",
    Phi:"Φ",omega:"ω",Omega:"Ω",imath:"i"};
  for(var i=0;i<6;i++){
    s=s.replace(/\\[tdc]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,"($1)/($2)");
    s=s.replace(/\\sqrt\s*\{([^{}]*)\}/g,"√($1)");
    s=s.replace(/\\(mathrm|text|vec|hat|mathbf|operatorname)\s*\{([^{}]*)\}/g,"$2");
  }
  s=s.replace(/\\hat\\imath/g,"î").replace(/\\hat\\jmath/g,"ĵ");
  s=s.replace(/\\(vec|hat|mathrm|mathbf)\s*([A-Za-z])/g,"$2");
  s=s.replace(/\\left|\\right/g,"");
  s=s.replace(/\\cdot/g,"·").replace(/\\times/g,"×").replace(/\\pm/g,"±")
   .replace(/\\ge/g,"≥").replace(/\\le/g,"≤").replace(/\\approx/g,"≈")
   .replace(/\\Rightarrow/g,"⇒").replace(/\\rightarrow/g,"→").replace(/\\infty/g,"∞")
   .replace(/\\partial/g,"∂").replace(/\\oint/g,"∮").replace(/\\hbar/g,"ℏ")
   .replace(/\\ln/g,"ln").replace(/\\log/g,"log").replace(/\\sin/g,"sen")
   .replace(/\\cos/g,"cos").replace(/\\tan/g,"tg").replace(/\\circ/g,"°");
  for(var k in g)s=s.replace(new RegExp("\\\\"+k+"(?![a-zA-Z])","g"),g[k]);
  s=s.replace(/\^\{([^{}]*)\}/g,"<sup>$1</sup>").replace(/\^(-?\w)/g,"<sup>$1</sup>");
  s=s.replace(/_\{([^{}]*)\}/g,"<sub>$1</sub>").replace(/_(\w)/g,"<sub>$1</sub>");
  s=s.replace(/[{}]/g,"").replace(/\\[,;:!\s]/g," ").replace(/\\\\/g," ");
  return s;
}
function md(s){
  s=String(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  if(!window.katex)s=s.replace(/\$([^$]+)\$/g,function(m,t){return '<span class="mf">'+texPlano(t)+"</span>";});
  return s;
}
function pintaMate(el){
  if(window.katex&&window.renderMathInElement){
    try{
      renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false});
    }catch(e){}
  }
  el.querySelectorAll("[data-tex]").forEach(function(n){
    var t=n.getAttribute("data-tex");
    if(window.katex){try{katex.render(t,n,{throwOnError:false,displayMode:false});return;}catch(e){}}
    n.innerHTML=texPlano(t);
  });
}

function heroOnda(){
  var c=document.getElementById("heroOnda");if(!c)return;
  var ctx=c.getContext("2d"),reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ajustar(){
    var dpr=window.devicePixelRatio||1;
    c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  ajustar();
  var t0=performance.now(),raf;
  function dib(){
    var W=c.clientWidth,H=c.clientHeight,t=reduce?0:(performance.now()-t0)/1000;
    ctx.clearRect(0,0,W,H);
    /* Los colores de la asignatura en el portal: verdes y cianes. */
    var ondas=[{a:26,k:0.011,w:0.7,y:0.62,col:"rgba(16,163,127,.17)"},
               {a:18,k:0.017,w:-1.0,y:0.72,col:"rgba(20,168,184,.18)"},
               {a:34,k:0.007,w:0.45,y:0.82,col:"rgba(34,175,110,.12)"}];
    ondas.forEach(function(o){
      ctx.beginPath();ctx.moveTo(0,H);
      for(var x=0;x<=W;x+=4)ctx.lineTo(x,H*o.y+Math.sin(x*o.k+t*o.w)*o.a);
      ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=o.col;ctx.fill();
    });
    if(!reduce)raf=requestAnimationFrame(dib);
  }
  dib();
  window.addEventListener("resize",function(){ajustar();if(reduce)dib();});
  SIM_STOP.push(function(){if(raf)cancelAnimationFrame(raf);});
}

var IDX=null;
function buscar(q){
  var cont=document.getElementById("resultados");if(!cont)return;
  cont.innerHTML="";
  q=(q||"").trim().toLowerCase();
  if(q.length<3)return;
  if(!IDX)IDX=indice();
  var norm=function(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();};
  var qq=norm(q),vistos={},n=0;
  IDX.forEach(function(it){
    if(n>=7)return;
    if(norm(it.t).indexOf(qq)<0)return;
    var clave=it.id+it.tit;if(vistos[clave])return;vistos[clave]=1;n++;
    var li=document.createElement("li");
    var b=document.createElement("button");
    b.innerHTML=md(it.tit)+"<small>"+it.sub+"</small>";
    b.addEventListener("click",function(){ir(it.id);});
    li.appendChild(b);cont.appendChild(li);
  });
  if(!n)cont.innerHTML='<li><button disabled>No hay resultados para esa búsqueda. Prueba con otra palabra.</button></li>';
  pintaMate(cont);
}

  if(T.sim&&SIMS[T.sim]){

    var host=h("div");v.appendChild(host);
    setTimeout(function(){try{SIMS[T.sim](host);}catch(e){host.innerHTML='<div class="aviso">La simulación no ha podido cargarse en este navegador.</div>';}},0);
  }

  v.appendChild(h("h2","seccion","Formulario del tema"));
  v.appendChild(cajaFormulas(T.formulas));

  if(T.claves&&T.claves.length){
    var av=h("div","aviso aviso--clave");
    av.appendChild(h("h4",null,"Errores frecuentes y avisos para el examen"));
    var ul2=h("ul");
    T.claves.forEach(function(c){ul2.appendChild(h("li",null,md(c)));});
    av.appendChild(ul2);v.appendChild(av);
  }

  if(T.problemas&&T.problemas.length){
    var varios=T.problemas.length>1;
    v.appendChild(h("h2","seccion",varios?"Problemas para practicar":"Problema resuelto"));
    if(varios)v.appendChild(h("p",null,"Intenta resolver cada uno antes de mirar la solución."));
    T.problemas.forEach(function(pr,i){
      var box=h("div","problema"),cab=h("div","problema__cab");
      cab.appendChild(h("h4",null,varios?("Problema "+(i+1)):"Enunciado"));
      cab.appendChild(h("p",null,md(pr.e)));
      var bt=h("button","btn btn--fantasma","Ver la solución paso a paso");
      cab.appendChild(bt);box.appendChild(cab);
      var sol=h("div","problema__sol");sol.hidden=true;
      var ol=h("ol");
      pr.pasos.forEach(function(p){ol.appendChild(h("li",null,md(p)));});
      sol.appendChild(ol);box.appendChild(sol);
      bt.addEventListener("click",function(){
        sol.hidden=!sol.hidden;
        bt.textContent=sol.hidden?"Ver la solución paso a paso":"Ocultar la solución";
      });
      v.appendChild(box);
    });
  }

  v.appendChild(h("h2","seccion","Comprueba si lo llevas"));
  var zonaTest=h("div");
  T.test.forEach(function(p,i){zonaTest.appendChild(tarjetaPregunta(p,i+1));});
  v.appendChild(zonaTest);

  var pie=h("div","pie-tema");
  var marcar=h("button","btn"+(ESTADO.hechos[T.id]?" btn--verde":""),ESTADO.hechos[T.id]?"Tema estudiado":"Marcar como estudiado");
  marcar.addEventListener("click",function(){
    ESTADO.hechos[T.id]=!ESTADO.hechos[T.id];
    marcar.textContent=ESTADO.hechos[T.id]?"Tema estudiado":"Marcar como estudiado";
    marcar.className="btn"+(ESTADO.hechos[T.id]?" btn--verde":"");
    guardarProgreso();pintarRail();
  });
  pie.appendChild(marcar);
  var nav=h("div","sim__botones");
  var i=TEMAS.indexOf(T);
  if(i>0){var a=h("button","btn btn--fantasma","Tema "+TEMAS[i-1].n);a.addEventListener("click",function(){ir(TEMAS[i-1].id);});nav.appendChild(a);}
  if(i<TEMAS.length-1){var b2=h("button","btn btn--fantasma","Tema "+TEMAS[i+1].n+": "+TEMAS[i+1].titulo);b2.addEventListener("click",function(){ir(TEMAS[i+1].id);});nav.appendChild(b2);}
  pie.appendChild(nav);
  v.appendChild(pie);
  m.appendChild(v);
  pintaMate(v);
}

function cajaFormulas(lista){
  var cont=h("div","formulario");
  (lista||[]).forEach(function(f){
    var d=h("div","formula"+(f.clave?" formula--clave":""));
    var tex=h("span","formula__tex");tex.setAttribute("data-tex",f.tex);
    d.appendChild(tex);
    d.appendChild(h("span","formula__d",f.d));
    cont.appendChild(d);
  });
  return cont;
}

function tarjetaPregunta(p,num,alResponder){
  var box=h("div","test");
  box.appendChild(h("p","test__p",'<i>'+num+'</i><span>'+md(p.q)+"</span>"));
  var ul=h("ul","opciones"),letras="abcd";
  var expl=h("p","explica");expl.hidden=true;
  p.op.forEach(function(o,j){
    var li=document.createElement("li");
    var b=h("button","opcion",'<span class="opcion__l">'+letras[j]+"</span><span>"+md(o)+"</span>");
    b.addEventListener("click",function(){
      ul.querySelectorAll("button").forEach(function(x,k){
        x.disabled=true;
        if(k===p.sol)x.classList.add("bien");
      });
      if(j!==p.sol)b.classList.add("mal");
      expl.innerHTML=(j===p.sol?"<strong>Correcto. </strong>":"<strong>No es esa. </strong>")+md(p.why);
      expl.hidden=false;pintaMate(expl);
      if(alResponder)alResponder(j===p.sol);
    });
    li.appendChild(b);ul.appendChild(li);
  });
  box.appendChild(ul);box.appendChild(expl);
  return box;
}

/* --- formulario general --- */
function vistaFormulario(){
  var m=document.getElementById("main");m.innerHTML="";
  var v=h("div","vista");
  v.appendChild(h("p","crumb","Herramientas"));
  v.appendChild(h("h1","titulo","Formulario completo"));
  v.appendChild(h("p","entradilla","Todas las fórmulas del curso, tema a tema. Las destacadas en ámbar son las que conviene tener automatizadas. Debajo, la tabla de constantes que se entrega en las PAU."));
  var bus=h("div","buscador");
  bus.innerHTML='<input type="search" id="filtroF" placeholder="Filtrar fórmulas: potencial, Lorentz, escape…" aria-label="Filtrar fórmulas">';
  v.appendChild(bus);
  var zona=h("div");zona.id="zonaF";v.appendChild(zona);

  function pintar(q){
    zona.innerHTML="";
    var norm=function(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();};
    var qq=norm(q||"");
    TEMAS.forEach(function(T){
      var fs=(T.formulas||[]).filter(function(f){return !qq||norm(f.d+" "+f.tex+" "+T.titulo).indexOf(qq)>=0;});
      if(!fs.length)return;
      var t=h("h2","seccion","Tema "+T.n+". "+T.titulo);
      t.style.cursor="pointer";
      t.addEventListener("click",function(){ir(T.id);});
      zona.appendChild(t);
      zona.appendChild(cajaFormulas(fs));
    });
    if(!zona.children.length)zona.appendChild(h("p",null,"Ninguna fórmula coincide con esa búsqueda."));
    pintaMate(zona);
  }
  pintar("");

  var tc=h("div");
  tc.innerHTML='<h2 class="seccion">Constantes y datos</h2>';
  var w=h("div","tabla-envoltura"),tb=h("table","tabla");
  tb.innerHTML="<thead><tr><th>Magnitud</th><th>Símbolo</th><th>Valor</th></tr></thead>";
  var tbody=h("tbody");
  CONSTANTES.forEach(function(c){
    var tr=h("tr");
    tr.appendChild(h("td",null,c[0]));tr.appendChild(h("td",null,"<code>"+c[1]+"</code>"));tr.appendChild(h("td",null,c[2]));
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody);w.appendChild(tb);tc.appendChild(w);
  v.appendChild(tc);
  m.appendChild(v);
  document.getElementById("filtroF").addEventListener("input",function(e){pintar(e.target.value);});
}

/* --- examen rápido --- */
function vistaExamen(){
  var m=document.getElementById("main");m.innerHTML="";
  var v=h("div","vista");
  v.appendChild(h("p","crumb","Herramientas"));
  v.appendChild(h("h1","titulo","Examen rápido"));
  v.appendChild(h("p","entradilla","Doce preguntas al azar, una de cada tema. No puntúa para nada: sirve para detectar qué toca repasar."));

  var marcador=h("div","marcador");
  marcador.innerHTML="<div><b id='mNota'>0</b> de <span id='mTotal'>0</span> respondidas correctamente</div>";
  var rehacer=h("button","btn","Otras doce preguntas");
  rehacer.addEventListener("click",vistaExamen);
  marcador.appendChild(rehacer);
  v.appendChild(marcador);

  var aciertos=0,hechas=0;
  var preguntas=TEMAS.map(function(T){
    var p=T.test[Math.floor(Math.random()*T.test.length)];
    return {p:p,T:T};
  }).sort(function(){return Math.random()-0.5;});

  preguntas.forEach(function(o,i){
    var c=tarjetaPregunta(o.p,i+1,function(ok){
      hechas++;if(ok)aciertos++;
      document.getElementById("mNota").textContent=aciertos;
      document.getElementById("mTotal").textContent=hechas;
      if(hechas===12){
        var msg=aciertos>=10?"Muy bien, lo llevas.":(aciertos>=7?"Vas bien, pero repasa los temas fallados.":"Toca volver a la teoría de los temas que has fallado.");
        marcador.insertAdjacentHTML("beforeend","<div style='flex-basis:100%'>"+msg+"</div>");
      }
    });
    c.insertBefore(h("p","crumb","Tema "+o.T.n+". "+o.T.titulo),c.firstChild);
    v.appendChild(c);
  });
  m.appendChild(v);
  pintaMate(v);
}

  v.appendChild(h("h2","seccion","Competencias específicas y criterios de evaluación"));
  CURSO.competencias.forEach(function(C){
    v.appendChild(h("h3",null,C.id));
    v.appendChild(h("p",null,C.txt));
    var ul=h("ul");C.ca.forEach(function(x){ul.appendChild(h("li",null,x));});v.appendChild(ul);
  });

/* --- enrutado --- */
function ir(id){
  pararSims();
  ESTADO.vista=id;
  try{if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);}catch(e){}
  document.body.classList.remove("menu-abierto");
  if(id==="inicio")vistaInicio();
  else if(id==="formulario")vistaFormulario();
  else if(id==="curso")vistaCurso();
  else if(id==="examen")vistaExamen();
  else{
    var T=tema(id);
    if(T)vistaTema(T);else{ESTADO.vista="inicio";vistaInicio();}
  }
  pintarRail();
  var t=document.getElementById("tbTitulo");
  if(t)t.textContent=ESTADO.vista==="inicio"?"Física 2º bach":(tema(ESTADO.vista)?"Tema "+tema(ESTADO.vista).n:"Física 2º bach");
  window.scrollTo(0,0);
  document.getElementById("main").focus({preventScroll:true});
}

/* --- arranque --- */
(async function(){
  await cargarProgreso();
  document.getElementById("btnMenu").addEventListener("click",function(){
    document.body.classList.toggle("menu-abierto");
  });
  document.getElementById("velo").addEventListener("click",function(){
    document.body.classList.remove("menu-abierto");
  });
  document.getElementById("marca").addEventListener("click",function(){ir("inicio");});
  var inicial="inicio";
  try{inicial=(location.hash||"").replace("#","")||"inicio";}catch(e){}
  ir(inicial);
  window.addEventListener("hashchange",function(){
    try{
      var id=(location.hash||"").replace("#","")||"inicio";
      if(id!==ESTADO.vista)ir(id);
    }catch(e){}
  });
})();
