<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Física de 2.º de bachillerato · Illes Balears</title>
<meta name="description" content="Temario completo de Física de 2.º de bachillerato de las Illes Balears: teoría, formulario, simulaciones interactivas y preguntas de autoevaluación.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{
  --tinta:#0E1834;
  --tinta-2:#17234A;
  --tinta-3:#26355F;
  --papel:#F4F6FB;
  --blanco:#FFFFFF;
  --texto:#14203F;
  --texto-2:#4E5B7C;
  --texto-3:#7B87A4;
  --borde:#DBE2F0;
  --borde-2:#C6D0E6;
  --campo:#2B4CE0;
  --campo-claro:#EAEEFD;
  --energia:#E9930B;
  --energia-claro:#FDF2DC;
  --verde:#12805C;
  --verde-claro:#E4F4EE;
  --rojo:#C0322B;
  --rojo-claro:#FBEBEA;
  --rail:284px;
  --sans:"Bricolage Grotesque","Segoe UI",Roboto,-apple-system,system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --radio:10px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--papel);
  color:var(--texto);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.68;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.sans{font-family:var(--sans);letter-spacing:-0.015em}
a{color:var(--campo)}
:focus-visible{outline:3px solid var(--energia);outline-offset:2px;border-radius:4px}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

.rail{
  background:var(--tinta);
  color:#C9D3EC;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  border-right:1px solid #000;
}
.rail__marca{padding:22px 22px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.rail__marca button{
  all:unset;cursor:pointer;display:block;width:100%;
}
.rail__titulo{font-family:var(--sans);font-weight:800;font-size:19px;color:#fff;line-height:1.15;letter-spacing:-0.02em}
.rail__sub{font-family:var(--sans);font-size:12.5px;color:#8FA0C8;margin-top:5px;line-height:1.35}

.rail__scroll{overflow-y:auto;flex:1;padding:12px 12px 28px;scrollbar-width:thin;scrollbar-color:#3A4874 transparent}
.rail__scroll::-webkit-scrollbar{width:8px}
.rail__scroll::-webkit-scrollbar-thumb{background:#33406A;border-radius:8px}

.rail__grupo{font-family:var(--sans);font-size:11.5px;font-weight:600;color:#7285B4;padding:16px 10px 7px;letter-spacing:.03em}

.nav-item{
  display:flex;gap:11px;align-items:flex-start;width:100%;
  background:none;border:0;cursor:pointer;text-align:left;
  color:#BDC8E4;font-family:var(--sans);font-size:14.2px;line-height:1.32;
  padding:8px 10px;border-radius:8px;position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item[aria-current="true"]{background:#22315C;color:#fff}
.nav-item[aria-current="true"]::before{
  content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;
  background:var(--energia);border-radius:0 3px 3px 0;
}
.nav-item__n{
  flex:none;width:22px;height:22px;border-radius:6px;
  background:rgba(255,255,255,.09);color:#9FAFD6;
  font-size:11.5px;font-weight:600;display:grid;place-items:center;margin-top:1px;
}
.nav-item[aria-current="true"] .nav-item__n{background:var(--campo);color:#fff}
.nav-item.hecho .nav-item__n{background:var(--verde);color:#fff}
.nav-item.hecho .nav-item__n::after{content:"✓"}
.nav-item.hecho .nav-item__n span{display:none}
.nav-item__txt{flex:1;min-width:0}

.rail__pie{padding:12px 20px 16px;border-top:1px solid rgba(255,255,255,.09);font-family:var(--sans);font-size:12px;color:#7285B4}
.barra{height:5px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin:7px 0}
.barra i{display:block;height:100%;background:var(--energia);width:0;transition:width .35s ease}

/* ---------- cabecera móvil ---------- */
.topbar{display:none}

/* ---------- contenido ---------- */
.main{min-width:0}
.vista{max-width:860px;margin:0 auto;padding:44px 40px 110px}
.vista--ancha{max-width:1040px}

.crumb{font-family:var(--sans);font-size:13px;color:var(--texto-3);margin:0 0 10px}
h1.titulo{font-size:clamp(28px,4vw,42px);font-weight:800;line-height:1.08;margin:0 0 14px}
.entradilla{font-size:19px;color:var(--texto-2);margin:0 0 28px;max-width:62ch}

h2.seccion{
  font-size:22px;font-weight:700;margin:44px 0 12px;padding-top:16px;
  border-top:1px solid var(--borde);
}
h3{font-size:17.5px;font-weight:600;margin:26px 0 8px;font-family:var(--sans)}
p{margin:0 0 14px;max-width:70ch}
ul,ol{margin:0 0 16px;padding-left:22px;max-width:70ch}
li{margin-bottom:7px}
li::marker{color:var(--campo)}
strong{font-weight:600}
code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.9em;background:var(--campo-claro);padding:1px 5px;border-radius:4px}

/* ---------- portada ---------- */
.hero{position:relative;border-bottom:1px solid var(--borde);overflow:hidden;background:var(--blanco)}
.hero__grid{
  position:absolute;inset:0;
  background-image:linear-gradient(var(--borde) 1px,transparent 1px),linear-gradient(90deg,var(--borde) 1px,transparent 1px);
  background-size:26px 26px;opacity:.5;
}
.hero__onda{position:absolute;left:0;right:0;bottom:0;height:210px;width:100%;display:block}
.hero__txt{position:relative;max-width:860px;margin:0 auto;padding:64px 40px 150px}
.hero h1{font-size:clamp(34px,5.4vw,56px);font-weight:800;line-height:1.02;margin:0 0 16px;letter-spacing:-0.03em}
.hero p{font-size:19.5px;color:var(--texto-2);max-width:56ch;margin:0}
.hero__meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.pastilla{
  font-family:var(--sans);font-size:13px;background:var(--campo-claro);color:var(--campo);
  padding:5px 12px;border-radius:100px;border:1px solid #D3DCFB;
}
.pastilla--ambar{background:var(--energia-claro);color:#9A6003;border-color:#F3DFB6}

.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px;margin:22px 0 0}
.tarjeta{
  background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);
  padding:16px 17px;text-align:left;cursor:pointer;font:inherit;color:inherit;
  display:flex;flex-direction:column;gap:7px;transition:border-color .15s,transform .15s;
}
.tarjeta:hover{border-color:var(--campo);transform:translateY(-2px)}
.tarjeta__n{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--campo)}
.tarjeta.hecho .tarjeta__n{color:var(--verde)}
.tarjeta__t{font-family:var(--sans);font-weight:600;font-size:16px;line-height:1.25}
.tarjeta__d{font-size:14.5px;color:var(--texto-2);line-height:1.45}

/* ---------- buscador ---------- */
.buscador{position:relative;margin:0 0 6px}
.buscador input{
  width:100%;font:inherit;font-family:var(--sans);font-size:15px;
  padding:11px 14px;border:1px solid var(--borde-2);border-radius:9px;background:var(--blanco);color:var(--texto);
}
.buscador input::placeholder{color:var(--texto-3)}
.resultados{list-style:none;padding:0;margin:8px 0 0;max-width:none}
.resultados li{margin:0 0 6px}
.resultados button{
  width:100%;text-align:left;background:var(--blanco);border:1px solid var(--borde);border-radius:8px;
  padding:9px 12px;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--texto);
}
.resultados button:hover{border-color:var(--campo)}
.resultados small{display:block;color:var(--texto-3);font-size:12.5px}

/* ---------- fórmulas ---------- */
.formulario{display:grid;gap:10px;margin:16px 0 8px}
.formula{
  background:var(--blanco);border:1px solid var(--borde);border-left:3px solid var(--campo);
  border-radius:0 var(--radio) var(--radio) 0;padding:13px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;justify-content:space-between;
}
.formula__tex{font-size:18px;overflow-x:auto;max-width:100%}
.formula__d{font-family:var(--sans);font-size:13.5px;color:var(--texto-2);text-align:right;flex:1;min-width:180px}
.formula--clave{border-left-color:var(--energia);background:#FFFDF8}

/* ---------- avisos ---------- */
.aviso{
  background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);
  padding:16px 18px;margin:20px 0;
}
.aviso h4{margin:0 0 8px;font-size:15px;font-family:var(--sans);font-weight:600}
.aviso ul{margin-bottom:0}
.aviso--clave{background:var(--energia-claro);border-color:#F1DEBA}
.aviso--clave h4{color:#8A5604}
.aviso--dato{background:var(--campo-claro);border-color:#D3DCFB}
.aviso--dato h4{color:var(--campo)}

/* ---------- simulación ---------- */
.sim{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);margin:22px 0;overflow:hidden}
.sim__cab{padding:13px 17px;border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
.sim__cab h4{margin:0;font-size:15.5px;font-family:var(--sans);font-weight:600}
.sim__cab span{font-family:var(--sans);font-size:13px;color:var(--texto-3)}
.sim__lienzo{display:block;width:100%;background:var(--blanco)}
.sim__mandos{padding:14px 17px;border-top:1px solid var(--borde);background:#FAFBFE;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.mando{font-family:var(--sans);font-size:13px;color:var(--texto-2)}
.mando__fila{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.mando b{color:var(--texto);font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--campo);height:20px}
.sim__lectura{padding:12px 17px;border-top:1px solid var(--borde);display:flex;flex-wrap:wrap;gap:8px 26px;font-family:var(--sans);font-size:13.5px;background:#FAFBFE}
.sim__lectura b{font-variant-numeric:tabular-nums}
.btn{
  font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;
  background:var(--campo);color:#fff;border:0;border-radius:8px;padding:8px 15px;
}
.btn:hover{background:#2340C7}
.btn--fantasma{background:transparent;color:var(--campo);border:1px solid var(--borde-2)}
.btn--fantasma:hover{background:var(--campo-claro)}
.btn--verde{background:var(--verde)}
.btn--verde:hover{background:#0C6B4C}
.sim__botones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font-family:var(--sans);font-size:13.5px;padding:7px 10px;border:1px solid var(--borde-2);border-radius:8px;background:var(--blanco);color:var(--texto)}

/* ---------- test ---------- */
.test{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:18px 20px;margin:14px 0}
.test__p{font-family:var(--sans);font-weight:600;font-size:16px;margin:0 0 12px;display:flex;gap:10px}
.test__p i{color:var(--texto-3);font-style:normal;font-variant-numeric:tabular-nums}
.opciones{display:grid;gap:7px;margin:0;padding:0;list-style:none;max-width:none}
.opcion{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  border:1px solid var(--borde);background:var(--papel);border-radius:8px;
  padding:10px 13px;cursor:pointer;font:inherit;font-size:16px;line-height:1.45;color:var(--texto);
}
.opcion:hover:not(:disabled){border-color:var(--campo);background:var(--campo-claro)}
.opcion:disabled{cursor:default}
.opcion__l{font-family:var(--sans);font-weight:600;color:var(--texto-3);flex:none}
.opcion.bien{background:var(--verde-claro);border-color:#A8DCC9}
.opcion.bien .opcion__l{color:var(--verde)}
.opcion.mal{background:var(--rojo-claro);border-color:#EEC3C0}
.opcion.mal .opcion__l{color:var(--rojo)}
.explica{margin:11px 0 0;padding:11px 14px;background:var(--papel);border-left:3px solid var(--campo);border-radius:0 8px 8px 0;font-size:15.5px}
.explica[hidden]{display:none}

.marcador{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--tinta);color:#fff;border-radius:var(--radio);padding:16px 20px;margin:20px 0;
  font-family:var(--sans);
}
.marcador b{font-size:26px;font-weight:800}

/* ---------- problema resuelto ---------- */
.problema{border:1px solid var(--borde);border-radius:var(--radio);background:var(--blanco);margin:16px 0;overflow:hidden}
.problema__cab{padding:15px 18px}
.problema__cab h4{margin:0 0 8px;font-size:14.5px;font-family:var(--sans);color:var(--campo)}
.problema__cab p{margin:0}
.problema__sol{padding:0 18px 16px;border-top:1px dashed var(--borde-2);margin-top:12px;padding-top:14px}
.problema__sol[hidden]{display:none}
.problema__sol ol{margin-bottom:0}
.problema__sol li{margin-bottom:11px}

/* ---------- pie de tema ---------- */
.pie-tema{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:52px;padding-top:20px;border-top:1px solid var(--borde);flex-wrap:wrap}

/* ---------- tablas ---------- */
.tabla{width:100%;border-collapse:collapse;margin:14px 0 20px;font-size:15.5px;background:var(--blanco)}
.tabla th,.tabla td{border:1px solid var(--borde);padding:9px 12px;text-align:left;vertical-align:top}
.tabla th{background:var(--papel);font-family:var(--sans);font-size:13.5px;font-weight:600}
.tabla-envoltura{overflow-x:auto}

.katex{font-size:1.03em}
.katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{
    position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;
    transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.3);
  }
  body.menu-abierto .rail{transform:none}
  .topbar{
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;
    background:var(--tinta);color:#fff;padding:10px 14px;
  }
  .topbar button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-size:16px;line-height:1}
  .topbar span{font-family:var(--sans);font-weight:600;font-size:15px}
  .velo{position:fixed;inset:0;background:rgba(10,16,34,.55);z-index:35;display:none}
  body.menu-abierto .velo{display:block}
  .vista{padding:26px 20px 90px}
  .hero__txt{padding:40px 20px 120px}
  body{font-size:16.5px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

.mf{font-family:var(--serif);font-style:italic;white-space:nowrap}
.mf sub,.mf sup{font-style:normal}
.hero__grid,.hero__onda{pointer-events:none}
.test__p span{flex:1}
.opcion span:last-child{flex:1}

</style>
<!-- ===== estilo del portal: inicio ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- fichas de color, iguales en las seis páginas ---------- */
:root, :root[data-theme="light"]{
  --pz-paper:#F7F8FB; --pz-surface:#FFFFFF; --pz-surface-2:#F1F4F9; --pz-surface-3:#E7ECF3;
  --pz-ink:#0F1A2A; --pz-ink-2:#35435A; --pz-muted:#5C6A7E;
  --pz-line:#E4E9F0; --pz-line-2:#D3DAE5;
  --pz-acc:16 163 127;
  --pz-sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --pz-disp:"Space Grotesk","IBM Plex Sans",ui-sans-serif,sans-serif;
  --pz-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --pz-paper:#070B14; --pz-surface:#101828; --pz-surface-2:#172033; --pz-surface-3:#1F2A3D;
  --pz-ink:#EEF2F8; --pz-ink-2:#C6D0DE; --pz-muted:#94A3B8;
  --pz-line:#1E293B; --pz-line-2:#2C3A50;
  color-scheme:dark;
}

/* ---------- los tokens propios de la página pasan a los de arriba ---------- */
:root, :root[data-theme="light"], :root[data-theme="dark"]{
    --papel:var(--pz-paper);
    --blanco:var(--pz-surface);
    --texto:var(--pz-ink);
    --texto-2:var(--pz-ink-2);
    --texto-3:var(--pz-muted);
    --borde:var(--pz-line);
    --borde-2:var(--pz-line-2);
    --sans:var(--pz-sans);
    --serif:var(--pz-sans);
}

/* ---------- el fondo lo pinta <html> ----------
   Si el fondo lo pinta <body>, tapa a los hijos con z-index negativo (las capas
   del fondo), porque el fondo del body se dibuja después de esos hijos. */
html{background:var(--pz-paper) !important}
body{background:transparent !important}

/* ---------- tipografía ---------- */
body{font-family:var(--pz-sans) !important}
h1,h2,h3,h4,.titulo,.hero__txt h1{font-family:var(--pz-disp) !important; letter-spacing:-.015em}
button, input, select, textarea{font-family:inherit}

/* ---------- fondo: halos fijos, trama de puntos y ondas ---------- */
.pz-aurora{position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:
    radial-gradient(46rem 34rem at 6% -8%,  rgb(var(--pz-acc)/.22), rgb(var(--pz-acc)/0) 70%),
    radial-gradient(40rem 30rem at 97% -6%, rgb(var(--pz-acc)/.16), rgb(var(--pz-acc)/0) 70%)}
:root[data-theme="dark"] .pz-aurora{
  background:
    radial-gradient(46rem 34rem at 6% -8%,  rgb(var(--pz-acc)/.20), rgb(var(--pz-acc)/0) 70%),
    radial-gradient(40rem 30rem at 97% -6%, rgb(var(--pz-acc)/.14), rgb(var(--pz-acc)/0) 70%)}
.pz-trama{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:radial-gradient(rgba(15,26,42,.06) 1px, transparent 1px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse 85% 60% at 50% 0%, #000 35%, transparent 100%);
          mask-image:radial-gradient(ellipse 85% 60% at 50% 0%, #000 35%, transparent 100%)}
:root[data-theme="dark"] .pz-trama{background-image:radial-gradient(rgba(190,210,255,.07) 1px, transparent 1px)}
.pz-ondas{position:fixed;left:0;right:0;bottom:0;width:100%;height:46vh;min-height:260px;
  z-index:-1;pointer-events:none;display:block;opacity:.6}
:root[data-theme="dark"] .pz-ondas{opacity:.75}

/* ---------- pastilla de controles ---------- */
.pz-mando{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;align-items:center;gap:6px;
  padding:6px;border-radius:14px;border:1px solid var(--pz-line);background:rgb(var(--pz-fondo-mando,255 255 255)/.86);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 10px 30px -14px rgba(15,26,42,.45)}
:root[data-theme="dark"] .pz-mando{--pz-fondo-mando:16 24 40}
.pz-mando a, .pz-mando button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;
  padding:0 11px;border:0;border-radius:10px;background:transparent;color:var(--pz-ink-2);cursor:pointer;
  font-family:var(--pz-sans);font-size:.83rem;font-weight:600;text-decoration:none;
  transition:background-color .25s ease,color .25s ease}
.pz-mando a:hover, .pz-mando button:hover{background:rgb(var(--pz-acc)/.12);color:rgb(var(--pz-acc))}
.pz-mando a:focus-visible, .pz-mando button:focus-visible{outline:2px solid rgb(var(--pz-acc));outline-offset:2px}

<script>
(function () {
  var raiz = document.documentElement;

  function aplicar(oscuro) {
    raiz.setAttribute('data-theme', oscuro ? 'dark' : 'light');
    raiz.classList.toggle('dark', oscuro);
  }
  function guardado() { try { return localStorage.getItem('tema'); } catch (e) { return null; } }
  function guardar(v) { try { localStorage.setItem('tema', v ? 'oscuro' : 'claro'); } catch (e) {} }

  var g = guardado();
  var quiero = g ? g === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  var asentado = false;                 // hasta que la página termina de arrancar
  aplicar(quiero);

  /* Tres de estas páginas traen su propio interruptor de tema y fijan el suyo al
     arrancar. Mientras la página se monta devolvemos el tema del portal; una vez
     asentada, cualquier cambio ya es cosa de quien lee, así que lo anotamos. */
  new MutationObserver(function () {
    var valor = raiz.getAttribute('data-theme');
    /* El interruptor de Català cicla claro -> oscuro -> tema del sistema. Ese
       tercer paso aquí no pinta nada, así que lo tratamos como un cambio más:
       el sitio entero funciona con dos temas y uno solo guardado. */
    if (valor === '' || valor === null) {
      if (asentado) { quiero = !quiero; guardar(quiero); }
      aplicar(quiero);
      return;
    }
    var ahora = valor === 'dark';
    if (ahora === quiero) { raiz.classList.toggle('dark', ahora); return; }
    if (!asentado) { aplicar(quiero); return; }
    quiero = ahora;
    raiz.classList.toggle('dark', ahora);
    guardar(ahora);
  }).observe(raiz, { attributes: true, attributeFilter: ['data-theme'] });

  document.addEventListener('DOMContentLoaded', function () { aplicar(quiero); });
  window.addEventListener('load', function () {
    aplicar(quiero);
    setTimeout(function () { asentado = true; }, 150);
  });

  // Sin preferencia guardada seguimos al sistema
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      if (!guardado()) { quiero = e.matches; aplicar(quiero); }
    });
  } catch (e) {}

  document.addEventListener('DOMContentLoaded', function () {
    var quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // --- fondo ---
    var capas = document.createElement('div');
    capas.innerHTML = '<div class="pz-aurora" aria-hidden="true"></div>' +
                      '<div class="pz-trama" aria-hidden="true"></div>' +
                      '<canvas class="pz-ondas" aria-hidden="true"></canvas>';
    while (capas.firstChild) document.body.appendChild(capas.firstChild);

    // --- pastilla de controles ---
    var mando = document.createElement('div');
    mando.className = 'pz-mando';
    mando.innerHTML =
      '<a href="index.html" title="Volver al portal">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>' +
        '<span>Portal</span></a>' +
      '<button type="button" id="pzTema" aria-label="Cambiar entre claro y oscuro">' +
        '<svg class="pz-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>' +
        '<svg class="pz-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>' +
      '</button>';
    document.body.appendChild(mando);
    mando.querySelector('#pzTema').addEventListener('click', function () {
      quiero = raiz.getAttribute('data-theme') !== 'dark';
      aplicar(quiero);
      guardar(quiero);
      if (quieto) pintar();
    });

    // --- ondas ---
    var lienzo = document.querySelector('.pz-ondas'), ctx = lienzo.getContext('2d');
    var ONDAS = [
        { c:[ 10,140,150], y:0.22, a:24, k:0.0055, w:-0.62, f:0.0, par:.08 },
        { c:[ 16,163,127], y:0.38, a:21, k:0.0074, w: 0.85, f:1.1, par:.06 },
        { c:[ 34,175,110], y:0.54, a:19, k:0.0096, w:-1.10, f:2.3, par:.05 },
        { c:[ 20,168,184], y:0.70, a:22, k:0.0065, w: 1.35, f:0.6, par:.04 },
        { c:[ 60,190,140], y:0.86, a:17, k:0.0120, w:-0.80, f:3.0, par:.03 }
    ];
    ONDAS.forEach(function (o, i) {
      o.sig = ONDAS[(i + 1) % ONDAS.length].c;
      o.burbujas = [];
      for (var j = 0; j < 4; j++) o.burbujas.push({
        x0: (j * 227 + i * 91) % 1000 / 1000, v: 9 + ((i * 3 + j * 7) % 11),
        r: 1.3 + ((i + j) % 4) * 0.6, d: j * 1.7 + i * 0.9 });
    });
    var rgba = function (c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; };
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    function ajustar() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      lienzo.width = lienzo.clientWidth * dpr; lienzo.height = lienzo.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    var t0 = performance.now(), raf = 0;

    function altura(o, x, t, H, desp) {
      var amp = o.a * (1 + 0.22 * Math.sin(t * 0.37 + o.f));
      return H * o.y - desp * o.par
           + Math.sin(x * o.k + t * o.w + o.f) * amp
           + Math.sin(x * o.k * 2.3 - t * o.w * 0.7 + o.f) * amp * 0.28
           + Math.sin(x * o.k * 3.7 + t * o.w * 1.3) * amp * 0.12;
    }
    function pintar() {
      var W = lienzo.clientWidth, H = lienzo.clientHeight;
      var t = quieto ? 0 : (performance.now() - t0) / 1000;
      var os = raiz.getAttribute('data-theme') === 'dark';
      var alfa = os ? .24 : .20, linea = os ? .62 : .46, halo = os ? .14 : .09;
      var desp = Math.min(window.scrollY || 0, 400);
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < ONDAS.length; i++) {
        var o = ONDAS[i], base = H * o.y - desp * o.par;
        ctx.beginPath();
        for (var x = 0; x <= W + 6; x += 6) {
          var y = altura(o, x, t, H, desp);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = rgba(o.c, halo); ctx.lineWidth = 7; ctx.stroke();
        var gl = ctx.createLinearGradient(0, 0, W, 0);
        gl.addColorStop(0, rgba(o.c, linea)); gl.addColorStop(1, rgba(o.sig, linea * .85));
        ctx.strokeStyle = gl; ctx.lineWidth = 1.5; ctx.stroke();
        var hondo = base + H * 0.12, clave = (os ? 'o' : 'c') + Math.round(base) + '|' + Math.round(H);
        if (o._gk !== clave) {
          var g2 = ctx.createLinearGradient(0, base - o.a, 0, hondo);
          g2.addColorStop(0, rgba(o.c, alfa)); g2.addColorStop(1, rgba(o.c, 0));
          o._g = g2; o._gk = clave;
        }
        ctx.lineTo(W, hondo); ctx.lineTo(0, hondo); ctx.closePath();
        ctx.fillStyle = o._g; ctx.fill();
        for (var j = 0; j < o.burbujas.length; j++) {
          var b = o.burbujas[j];
          var bx = (b.x0 * W + t * b.v) % (W + 60) - 30;
          var by = altura(o, bx, t, H, desp) - 6 - Math.sin(t * 1.3 + b.d) * 5;
          ctx.beginPath(); ctx.arc(bx, by, b.r, 0, 6.283);
          ctx.fillStyle = rgba(o.c, (os ? .55 : .40) * (0.55 + 0.45 * Math.sin(t * 0.9 + b.d * 2.1)));
          ctx.fill();
        }
      }
      if (!quieto) raf = requestAnimationFrame(pintar);
    }
    ajustar(); pintar();
    window.addEventListener('resize', function () { ajustar(); if (quieto) pintar(); });
    window.addEventListener('scroll', function () { if (quieto) pintar(); }, { passive: true });
    document.addEventListener('visibilitychange', function () {
      if (quieto) return;
      cancelAnimationFrame(raf);
      if (!document.hidden) raf = requestAnimationFrame(pintar);
    });
  });
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<script>
/* === Contenidos: temas 1 a 6 === */
const R = String.raw;

const TEMAS_1_6 = [
{
  n:1, id:"t1", titulo:"Movimientos vibratorios", lema:"El movimiento armónico simple",
  bloque:"C. Vibraciones y ondas",
  resumen:"Todo lo que oscila —un muelle, un péndulo, un átomo en un cristal, una molécula de aire al pasar el sonido— se describe con el mismo modelo: el movimiento armónico simple. Es el punto de partida de los dos temas siguientes.",
  secciones:[
    {h:"Qué es un movimiento armónico simple",
     p:[R`Un cuerpo describe un **movimiento armónico simple (MAS)** cuando oscila alrededor de una posición de equilibrio bajo la acción de una fuerza recuperadora proporcional a la separación de dicha posición y dirigida siempre hacia ella: $F = -k\,x$.`,
        R`Aplicando la segunda ley de Newton, $ma = -kx$, se llega a la condición cinemática que define el MAS: la aceleración es proporcional a la elongación y de signo contrario, $a = -\omega^2 x$, con $\omega^2 = k/m$.`],
     ul:[R`Es un movimiento **periódico** (se repite cada periodo $T$) y **oscilatorio** (va y viene entre $+A$ y $-A$).`,
         R`No es uniformemente acelerado: $a$ cambia en cada punto. En los extremos $a$ es máxima y $v=0$; en el equilibrio $a=0$ y $v$ es máxima.`,
         R`La proyección sobre un diámetro de un movimiento circular uniforme es un MAS. De ahí vienen los nombres de $\omega$ (pulsación o frecuencia angular) y de la fase.`]},
    {h:"Ecuaciones del movimiento",
     p:[R`La solución de $a=-\omega^2x$ es una función senoidal. Si se toma el seno, $x(t)=A\sin(\omega t+\varphi_0)$, y derivando se obtienen velocidad y aceleración.`,
        R`$A$ es la **amplitud** (elongación máxima), $\omega t+\varphi_0$ la **fase** y $\varphi_0$ la **fase inicial**, que se determina siempre con las condiciones iniciales del problema (dónde está y hacia dónde va el cuerpo en $t=0$).`],
     ul:[R`Si en $t=0$ el cuerpo parte del equilibrio hacia el sentido positivo: $\varphi_0 = 0$.`,
         R`Si parte de la elongación máxima positiva: $\varphi_0 = \pi/2$ (con la forma en seno) o bien se escribe directamente con coseno.`,
         R`La velocidad va adelantada $\pi/2$ respecto de la elongación, y la aceleración $\pi$ (están en oposición de fase).`]},
    {h:"Dinámica: muelle y péndulo",
     p:[R`En un **muelle** de constante elástica $k$ con una masa $m$ colgada o apoyada, $\omega=\sqrt{k/m}$: el periodo depende solo de la masa y del muelle, **no de la amplitud**.`,
        R`En un **péndulo simple** de longitud $l$, para oscilaciones pequeñas (menos de unos 10°) la componente tangencial del peso hace de fuerza recuperadora y $\omega=\sqrt{g/l}$. Aquí el periodo tampoco depende de la masa.`]},
    {h:"Energía del oscilador",
     p:[R`La fuerza elástica es conservativa, así que la energía mecánica se conserva y va intercambiándose entre cinética y potencial elástica a lo largo de cada oscilación.`,
        R`En los extremos toda la energía es potencial; en el punto de equilibrio, toda cinética. El valor total, $E_m=\tfrac12 k A^2$, depende del cuadrado de la amplitud: duplicar la amplitud multiplica por cuatro la energía.`]}
  ],
  formulas:[
    {tex:R`x(t)=A\sin(\omega t+\varphi_0)`, d:"Elongación", clave:true},
    {tex:R`v(t)=A\omega\cos(\omega t+\varphi_0)`, d:"Velocidad"},
    {tex:R`a(t)=-A\omega^2\sin(\omega t+\varphi_0)=-\omega^2x`, d:"Aceleración", clave:true},
    {tex:R`v=\pm\,\omega\sqrt{A^2-x^2}`, d:"Velocidad en función de la elongación"},
    {tex:R`\omega=\frac{2\pi}{T}=2\pi f`, d:"Pulsación, periodo y frecuencia"},
    {tex:R`F=-kx \qquad \omega=\sqrt{\frac{k}{m}} \qquad T=2\pi\sqrt{\frac{m}{k}}`, d:"Oscilador con muelle", clave:true},
    {tex:R`T=2\pi\sqrt{\frac{l}{g}}`, d:"Péndulo simple (amplitudes pequeñas)", clave:true},
    {tex:R`E_c=\tfrac12 m\omega^2(A^2-x^2)`, d:"Energía cinética"},
    {tex:R`E_p=\tfrac12 k x^2`, d:"Energía potencial elástica"},
    {tex:R`E_m=\tfrac12 kA^2=\tfrac12 m\omega^2A^2`, d:"Energía mecánica total", clave:true}
  ],
  sim:"mas",
  claves:[
    R`La fase inicial no se inventa: se obtiene sustituyendo $t=0$ en $x(t)$ y en $v(t)$ con los datos del enunciado.`,
    R`Trabaja siempre en radianes. Si la calculadora está en grados, todos los resultados saldrán mal.`,
    R`El periodo de un muelle **no** depende de la amplitud ni de $g$; el de un péndulo **no** depende de la masa.`,
    R`Cuidado con $k$ (constante elástica, en N/m) y $k$ (número de onda, tema 2): son magnitudes distintas.`
  ],
  problemas:[
  {
    e:R`Una masa de 0,5 kg unida a un muelle de $k=200$ N/m oscila con amplitud 10 cm. En $t=0$ pasa por el punto de equilibrio moviéndose en sentido positivo. Halla el periodo, la ecuación del movimiento, la velocidad máxima y la energía mecánica.`,
    pasos:[
      R`Pulsación: $\omega=\sqrt{k/m}=\sqrt{200/0{,}5}=20$ rad/s.`,
      R`Periodo: $T=2\pi/\omega=2\pi/20=0{,}314$ s.`,
      R`Condiciones iniciales: en $t=0$, $x=0$ y $v>0$, luego con la forma seno $\varphi_0=0$. Ecuación: $x(t)=0{,}1\sin(20t)$ m.`,
      R`Velocidad máxima: $v_{max}=A\omega=0{,}1\cdot20=2$ m/s (se alcanza en el equilibrio).`,
      R`Energía mecánica: $E_m=\tfrac12kA^2=\tfrac12\cdot200\cdot0{,}1^2=1$ J.`
    ]
  },
  {
    e:R`Un objeto de 200 g oscila unido a un muelle de constante $k=50$ N/m con amplitud 5 cm. En $t=0$ se encuentra en la elongación máxima positiva. Determina $\omega$, $T$, la ecuación $x(t)$ y las expresiones de $v(t)$ y $a(t)$.`,
    pasos:[
      R`Pulsación: $\omega=\sqrt{k/m}=\sqrt{50/0{,}2}=\sqrt{250}=15{,}8$ rad/s.`,
      R`Periodo: $T=2\pi/\omega=2\pi/15{,}8=0{,}397$ s.`,
      R`En $t=0$ el cuerpo está en $x=+A$, así que con la forma $x=A\sin(\omega t+\varphi_0)$ hace falta $\varphi_0=\pi/2$: $x(t)=0{,}05\sin(15{,}8t+\pi/2)$ m (equivale a $0{,}05\cos(15{,}8t)$).`,
      R`Velocidad: $v(t)=A\omega\cos(\omega t+\varphi_0)=0{,}79\cos(15{,}8t+\pi/2)$ m/s.`,
      R`Aceleración: $a(t)=-A\omega^2\sin(\omega t+\varphi_0)=-12{,}5\sin(15{,}8t+\pi/2)$ m/s².`
    ]
  },
  {
    e:R`Una partícula realiza un MAS de amplitud 0,12 m y periodo 0,8 s. En $t=0$ se encuentra en $x=0{,}06$ m, la mitad de la amplitud, moviéndose hacia valores crecientes de $x$. Calcula la fase inicial y escribe la ecuación $x(t)$.`,
    pasos:[
      R`Pulsación: $\omega=2\pi/T=2\pi/0{,}8=7{,}85$ rad/s.`,
      R`De $x(0)=A\sin\varphi_0$: $0{,}06=0{,}12\sin\varphi_0\Rightarrow\sin\varphi_0=0{,}5$, lo que da $\varphi_0=\pi/6$ o $\varphi_0=5\pi/6$.`,
      R`Como en $t=0$ la velocidad es positiva, hace falta $\cos\varphi_0>0$, así que se descarta $5\pi/6$ y queda $\varphi_0=\pi/6$ (30°).`,
      R`Ecuación: $x(t)=0{,}12\sin(7{,}85t+\pi/6)$ m.`
    ]
  },
  {
    e:R`Se quiere construir un péndulo simple que oscile con un periodo de 2 s en un lugar donde $g=9{,}8$ m/s². Calcula la longitud necesaria y la frecuencia. Si se traslada ese mismo péndulo a la Luna ($g=1{,}62$ m/s²), ¿cuál será su nuevo periodo?`,
    pasos:[
      R`De $T=2\pi\sqrt{l/g}$ se despeja: $l=\dfrac{gT^2}{4\pi^2}=\dfrac{9{,}8\cdot2^2}{4\pi^2}=0{,}993$ m ≈ 1 m.`,
      R`Frecuencia: $f=1/T=1/2=0{,}5$ Hz.`,
      R`En la Luna la longitud no cambia, solo $g$: $T'=2\pi\sqrt{l/g_{Luna}}=2\pi\sqrt{0{,}993/1{,}62}=4{,}92$ s.`,
      R`El péndulo oscila más despacio en la Luna porque la gravedad es menor: el periodo casi se multiplica por 2,5.`
    ]
  },
  {
    e:R`Un oscilador de masa 0,4 kg y constante elástica $k=90$ N/m tiene una amplitud de 8 cm. Calcula la energía mecánica total y la energía cinética y potencial cuando la elongación es $x=5$ cm. Comprueba que $E_c+E_p=E_m$.`,
    pasos:[
      R`Energía mecánica: $E_m=\tfrac12kA^2=\tfrac12\cdot90\cdot0{,}08^2=0{,}288$ J.`,
      R`Energía potencial en $x=0{,}05$ m: $E_p=\tfrac12kx^2=\tfrac12\cdot90\cdot0{,}05^2=0{,}1125$ J.`,
      R`Energía cinética: $E_c=E_m-E_p=0{,}288-0{,}1125=0{,}1755$ J.`,
      R`Comprobación: $E_c+E_p=0{,}1755+0{,}1125=0{,}288$ J $=E_m$. ✓`
    ]
  },
  {
    e:R`Un cuerpo en MAS con $\omega=6$ rad/s tiene, en el instante en que su elongación es 3 cm, una velocidad de 40 cm/s. Calcula la amplitud del movimiento y la velocidad máxima.`,
    pasos:[
      R`Se usa $v^2=\omega^2(A^2-x^2)$ con $v=0{,}4$ m/s y $x=0{,}03$ m: $0{,}16=36\,(A^2-0{,}0009)$.`,
      R`Despejando: $A^2-0{,}0009=0{,}00444\Rightarrow A^2=0{,}00534\Rightarrow A=0{,}0731$ m $\approx7{,}3$ cm.`,
      R`Velocidad máxima: $v_{max}=A\omega=0{,}0731\cdot6=0{,}439$ m/s.`
    ]
  },
  {
    e:R`Se cuelga una masa de 0,5 kg de un muelle vertical y este se alarga 4,9 cm hasta el equilibrio. A continuación se separa 3 cm de esa posición y se suelta, iniciando un MAS. Calcula la constante elástica del muelle, el periodo de la oscilación y la velocidad máxima de la masa.`,
    pasos:[
      R`En el equilibrio, la fuerza del muelle iguala al peso: $kx_0=mg\Rightarrow k=\dfrac{mg}{x_0}=\dfrac{0{,}5\cdot9{,}8}{0{,}049}=100$ N/m.`,
      R`Pulsación: $\omega=\sqrt{k/m}=\sqrt{100/0{,}5}=\sqrt{200}=14{,}1$ rad/s.`,
      R`Periodo: $T=2\pi/\omega=0{,}444$ s.`,
      R`Velocidad máxima, con $A=0{,}03$ m: $v_{max}=A\omega=0{,}03\cdot14{,}1=0{,}424$ m/s.`
    ]
  },
  {
    e:R`Dos osciladores armónicos tienen la misma constante elástica $k$. El primero tiene amplitud $A$ y masa $m$; el segundo, amplitud $2A$ y masa $2m$. ¿Qué relación hay entre sus energías mecánicas? ¿Y entre sus periodos?`,
    pasos:[
      R`Energía del primero: $E_{m1}=\tfrac12kA^2$. Energía del segundo: $E_{m2}=\tfrac12k(2A)^2=4\left(\tfrac12kA^2\right)=4E_{m1}$.`,
      R`La energía mecánica solo depende de $k$ y $A$, no de la masa, así que $E_{m2}=4E_{m1}$.`,
      R`Periodo del primero: $T_1=2\pi\sqrt{m/k}$. Periodo del segundo: $T_2=2\pi\sqrt{2m/k}=\sqrt2\,T_1$.`,
      R`La amplitud no interviene en el periodo: $T_2\approx1{,}41\,T_1$, solo por haber duplicado la masa.`
    ]
  },
  {
    e:R`Un cuerpo que realiza un MAS tiene una aceleración máxima de 8 m/s² y una velocidad máxima de 1,6 m/s. Calcula la pulsación, el periodo, la amplitud y el valor absoluto de la elongación en el instante en que la velocidad vale 0,8 m/s.`,
    pasos:[
      R`Dividiendo las dos magnitudes máximas se elimina $A$: $\dfrac{a_{max}}{v_{max}}=\dfrac{A\omega^2}{A\omega}=\omega\Rightarrow\omega=\dfrac{8}{1{,}6}=5$ rad/s.`,
      R`Amplitud: $A=v_{max}/\omega=1{,}6/5=0{,}32$ m.`,
      R`Periodo: $T=2\pi/\omega=1{,}257$ s.`,
      R`Con $v=0{,}8$ m/s: $v^2=\omega^2(A^2-x^2)\Rightarrow0{,}64=25(0{,}1024-x^2)\Rightarrow x^2=0{,}0768\Rightarrow|x|=0{,}277$ m.`
    ]
  },
  {
    e:R`En un experimento se observa que una masa unida a un muelle tarda 0,25 s en pasar de la posición de máxima elongación al punto de equilibrio por primera vez. Determina el periodo y la frecuencia del movimiento. Si la amplitud es de 6 cm, calcula la velocidad con la que pasa por el punto de equilibrio.`,
    pasos:[
      R`De la elongación máxima al equilibrio la fase avanza $\pi/2$, es decir, un cuarto de periodo: $T/4=0{,}25\Rightarrow T=1$ s.`,
      R`Frecuencia: $f=1/T=1$ Hz. Pulsación: $\omega=2\pi/T=6{,}28$ rad/s.`,
      R`En el punto de equilibrio toda la velocidad es la máxima: $v=A\omega=0{,}06\cdot6{,}28=0{,}377$ m/s.`
    ]
  }
  ],
  test:[
    {q:R`En un MAS, ¿en qué punto coinciden velocidad máxima y aceleración nula?`,
     op:["En los extremos de la trayectoria","En el punto de equilibrio","En x = A/2","En ningún punto"], sol:1,
     why:R`En $x=0$ la fuerza recuperadora se anula, así que $a=0$, y toda la energía es cinética, de modo que $v=\pm A\omega$.`},
    {q:R`Si se duplica la amplitud de un oscilador con muelle, la energía mecánica...`,
     op:["se duplica","se multiplica por cuatro","no cambia","se reduce a la mitad"], sol:1,
     why:R`$E_m=\tfrac12kA^2$ depende del cuadrado de la amplitud.`},
    {q:R`El periodo de un péndulo simple depende de...`,
     op:["la masa y la longitud","la longitud y la gravedad","la masa y la amplitud","solo de la amplitud"], sol:1,
     why:R`$T=2\pi\sqrt{l/g}$: ni la masa ni (para ángulos pequeños) la amplitud intervienen.`},
    {q:R`Un cuerpo con $a=-16x$ (SI) tiene un periodo de:`,
     op:["0,39 s","1,57 s","3,14 s","16 s"], sol:1,
     why:R`$\omega^2=16 \Rightarrow \omega=4$ rad/s y $T=2\pi/4\approx1{,}57$ s.`},
    {q:R`La velocidad en un MAS está desfasada respecto de la elongación en:`,
     op:["0","π/4","π/2","π"], sol:2,
     why:R`Derivando el seno se obtiene un coseno, que va adelantado $\pi/2$ rad.`}
  ]
},

{
  n:2, id:"t2", titulo:"Movimiento ondulatorio", lema:"Ondas, energía y fenómenos ondulatorios",
  bloque:"C. Vibraciones y ondas",
  resumen:"Una onda es un MAS que viaja: transporta energía y cantidad de movimiento de un punto a otro sin que haya transporte neto de materia. Con la ecuación de onda y los fenómenos ondulatorios se explican el sonido, la luz y buena parte de la tecnología actual.",
  secciones:[
    {h:"Concepto y tipos de onda",
     p:[R`Una **onda** es la propagación de una perturbación por un medio (o por el vacío) transportando energía sin transporte neto de materia: las partículas del medio oscilan alrededor de su posición de equilibrio.`],
     ul:[R`Según necesiten medio: **mecánicas** (sonido, cuerda, agua) y **electromagnéticas** (luz, radio), que se propagan también en el vacío.`,
         R`Según la dirección de vibración: **transversales** (vibración perpendicular a la propagación: cuerda, luz) y **longitudinales** (vibración paralela: sonido).`,
         R`Según el frente de onda: planas, cilíndricas o esféricas.`]},
    {h:"Ecuación de la onda armónica",
     p:[R`Si el foco realiza un MAS, cada punto del medio repite ese MAS con un retraso $x/v$. Sustituyendo se obtiene la **doble periodicidad** de la onda: es periódica en el tiempo (periodo $T$) y en el espacio (longitud de onda $\lambda$).`,
        R`El signo menos delante de $kx$ indica que la onda avanza en el sentido positivo del eje $X$; el signo más, en sentido negativo.`],
     ul:[R`**Número de onda** $k=2\pi/\lambda$ (rad/m). No confundir con la constante elástica.`,
         R`**Velocidad de propagación** $v=\lambda f=\lambda/T=\omega/k$: depende solo del medio.`,
         R`La **velocidad de vibración** de un punto, $v_y=\partial y/\partial t$, es otra cosa distinta y sí depende del tiempo.`]},
    {h:"Energía e intensidad",
     p:[R`La energía que transporta una onda es la del MAS de sus partículas: proporcional al cuadrado de la amplitud y al cuadrado de la frecuencia.`,
        R`La **intensidad** es la potencia que atraviesa la unidad de superficie perpendicular. En una onda esférica la energía se reparte sobre esferas cada vez mayores, de modo que la intensidad disminuye con el cuadrado de la distancia y la amplitud con la distancia.`],
     ul:[R`Nivel de intensidad sonora: $\beta=10\log(I/I_0)$ en decibelios, con $I_0=10^{-12}$ W/m².`,
         R`En medios reales hay además **absorción**: $I=I_0e^{-\beta_a x}$.`]},
    {h:"Fenómenos ondulatorios",
     ul:[R`**Reflexión**: la onda vuelve al mismo medio. Si el extremo es fijo, la onda reflejada se invierte (cambio de fase $\pi$).`,
         R`**Refracción**: cambia de medio, cambia $v$ y $\lambda$, pero **la frecuencia no cambia nunca**.`,
         R`**Difracción**: la onda bordea obstáculos o se abre al pasar por una rendija de tamaño comparable a $\lambda$.`,
         R`**Interferencias**: al superponerse dos ondas coherentes, es constructiva si la diferencia de caminos es $\Delta r=n\lambda$ y destructiva si $\Delta r=(2n+1)\lambda/2$.`,
         R`**Ondas estacionarias**: interferencia de dos ondas iguales en sentidos opuestos. Hay nodos fijos y vientres; no transportan energía neta. En una cuerda fija por ambos extremos, $\lambda_n=2L/n$ y $f_n=n\,v/2L$.`,
         R`**Efecto Doppler**: si emisor y receptor se acercan la frecuencia percibida aumenta, y disminuye si se alejan.`]}
  ],
  formulas:[
    {tex:R`y(x,t)=A\sin\!\left(\omega t- kx+\varphi_0\right)`, d:"Onda armónica que avanza en +X", clave:true},
    {tex:R`k=\frac{2\pi}{\lambda}\qquad \omega=\frac{2\pi}{T}`, d:"Número de onda y pulsación"},
    {tex:R`v=\lambda f=\frac{\lambda}{T}=\frac{\omega}{k}`, d:"Velocidad de propagación", clave:true},
    {tex:R`v=\sqrt{\frac{T_{cuerda}}{\mu}}`, d:"Velocidad en una cuerda tensa"},
    {tex:R`I=\frac{P}{S}=\frac{P}{4\pi r^2}\quad\Rightarrow\quad \frac{I_1}{I_2}=\frac{r_2^{\,2}}{r_1^{\,2}}=\frac{A_1^2}{A_2^2}`, d:"Intensidad de una onda esférica", clave:true},
    {tex:R`\beta=10\log\frac{I}{I_0}`, d:"Nivel de intensidad sonora (dB)", clave:true},
    {tex:R`\Delta r=n\lambda\ \text{(constructiva)};\quad \Delta r=(2n+1)\tfrac{\lambda}{2}\ \text{(destructiva)}`, d:"Interferencias"},
    {tex:R`\lambda_n=\frac{2L}{n}\qquad f_n=n\frac{v}{2L}`, d:"Armónicos en cuerda fija en ambos extremos"},
    {tex:R`f'=f\,\frac{v\pm v_{o}}{v\mp v_{f}}`, d:"Efecto Doppler (acercarse: numerador +, denominador −)"}
  ],
  sim:"onda",
  claves:[
    R`Al cambiar de medio **la frecuencia se mantiene**: lo que cambian son $v$ y $\lambda$.`,
    R`Distingue la velocidad de propagación $v=\omega/k$ (constante) de la velocidad de vibración $v_y=A\omega\cos(\ldots)$.`,
    R`En los decibelios, sumar 10 dB significa multiplicar la intensidad por 10, no sumarla.`,
    R`Para el signo en Doppler, razona físicamente: si se acercan, $f'$ debe salir mayor.`
  ],
  problemas:[{
    e:R`Una onda armónica se propaga por una cuerda según $y(x,t)=0{,}02\sin(50t-4x)$ (SI). Calcula amplitud, frecuencia, longitud de onda, velocidad de propagación y la velocidad máxima de vibración de un punto.`,
    pasos:[
      R`Comparando con $y=A\sin(\omega t-kx)$: $A=0{,}02$ m, $\omega=50$ rad/s, $k=4$ rad/m.`,
      R`Frecuencia: $f=\omega/2\pi=50/6{,}28=7{,}96$ Hz.`,
      R`Longitud de onda: $\lambda=2\pi/k=6{,}28/4=1{,}57$ m.`,
      R`Velocidad de propagación: $v=\omega/k=50/4=12{,}5$ m/s.`,
      R`Velocidad máxima de vibración: $v_{max}=A\omega=0{,}02\cdot50=1$ m/s. Fíjate en que es muy distinta de los 12,5 m/s de propagación.`
    ]
  }],
  test:[
    {q:R`Cuando una onda pasa de un medio a otro, ¿qué magnitud no cambia?`,
     op:["La velocidad","La longitud de onda","La frecuencia","La amplitud"], sol:2,
     why:R`La frecuencia la impone el foco emisor; el medio determina $v$, y por tanto $\lambda=v/f$.`},
    {q:R`En $y=0{,}05\sin(100\pi t-2\pi x)$ (SI), la velocidad de propagación vale:`,
     op:["50 m/s","100 m/s","2 m/s","314 m/s"], sol:0,
     why:R`$v=\omega/k=100\pi/2\pi=50$ m/s.`},
    {q:R`Si te alejas al doble de distancia de una fuente sonora puntual, la intensidad que recibes:`,
     op:["se reduce a la mitad","se reduce a la cuarta parte","no cambia","se reduce a la octava parte"], sol:1,
     why:R`En ondas esféricas $I\propto1/r^2$, así que al duplicar $r$ la intensidad cae cuatro veces.`},
    {q:R`En una onda estacionaria, los nodos son puntos que:`,
     op:["vibran con amplitud máxima","no vibran nunca","vibran con la frecuencia doble","se desplazan con la onda"], sol:1,
     why:R`En los nodos la interferencia es siempre destructiva y la amplitud resultante es nula.`},
    {q:R`Un sonido de 60 dB tiene una intensidad de:`,
     op:["10⁻⁶ W/m²","10⁻⁹ W/m²","60 W/m²","10⁻¹² W/m²"], sol:0,
     why:R`$60=10\log(I/10^{-12})\Rightarrow I/I_0=10^{6}\Rightarrow I=10^{-6}$ W/m².`}
  ]
},

{
  n:3, id:"t3", titulo:"Ondas electromagnéticas", lema:"La luz como onda",
  bloque:"C. Vibraciones y ondas",
  resumen:"Maxwell unificó electricidad, magnetismo y óptica en cuatro ecuaciones y predijo ondas que viajan a 3·10⁸ m/s sin necesidad de medio. La luz es una de ellas; el resto del espectro sostiene las telecomunicaciones, la medicina y la astronomía.",
  secciones:[
    {h:"La síntesis electromagnética",
     p:[R`Un campo eléctrico variable crea un campo magnético y un campo magnético variable crea un campo eléctrico (tema 9). La combinación se automantiene y se propaga: eso es una **onda electromagnética**.`,
        R`Maxwell dedujo su velocidad a partir de dos constantes medidas en el laboratorio, $c=1/\sqrt{\varepsilon_0\mu_0}\approx3\cdot10^8$ m/s, que coincidía con la velocidad de la luz medida por Fizeau. Hertz las produjo y detectó experimentalmente en 1887.`],
     ul:[R`Son **transversales**: $\vec E$, $\vec B$ y la dirección de propagación son perpendiculares entre sí.`,
         R`Los campos oscilan **en fase** y se cumple $E=cB$.`,
         R`**No necesitan medio**: se propagan en el vacío, lo que descartó la hipótesis del éter.`]},
    {h:"El espectro electromagnético",
     p:[R`Todas las ondas electromagnéticas son idénticas en naturaleza y solo se diferencian en frecuencia (y por tanto en longitud de onda y energía por fotón). El reparto en bandas es convencional y sus límites no son nítidos.`],
     tabla:{head:["Banda","Longitud de onda","Usos y origen"],rows:[
       ["Ondas de radio","> 1 m","Radio, TV, RMN"],
       ["Microondas","1 m – 1 mm","Radar, móviles, hornos"],
       ["Infrarrojo","1 mm – 780 nm","Calor, mandos, visión nocturna"],
       ["Visible","780 – 380 nm","Del rojo al violeta"],
       ["Ultravioleta","380 – 10 nm","Sol, esterilización, fluorescencia"],
       ["Rayos X","10 – 0,01 nm","Radiografías, cristalografía"],
       ["Rayos gamma","< 0,01 nm","Núcleos, astrofísica, radioterapia"]
     ]}},
    {h:"Propagación y fenómenos",
     p:[R`En un medio material la luz se frena: $v=c/n$, donde $n$ es el **índice de refracción**. Como la frecuencia no cambia, lo que se acorta es la longitud de onda.`],
     ul:[R`**Dispersión**: $n$ depende de la frecuencia, por eso un prisma separa los colores y aparece el arcoíris.`,
         R`**Polarización**: solo se da en ondas transversales; fue una prueba decisiva del carácter transversal de la luz.`,
         R`**Difracción e interferencias**: el experimento de la doble rendija de Young demostró el carácter ondulatorio de la luz.`,
         R`**Efecto Doppler luminoso**: el corrimiento al rojo de las galaxias lejanas indica que se alejan (ley de Hubble).`,
         R`La energía de cada fotón, $E=hf$, crece con la frecuencia: de ahí que los rayos X y gamma sean radiaciones ionizantes y las de radio no.`]}
  ],
  formulas:[
    {tex:R`c=\frac{1}{\sqrt{\varepsilon_0\mu_0}}=3\cdot10^{8}\ \mathrm{m/s}`, d:"Velocidad de la luz en el vacío", clave:true},
    {tex:R`c=\lambda f \qquad E=cB`, d:"Relaciones básicas de la onda electromagnética", clave:true},
    {tex:R`n=\frac{c}{v}\qquad \lambda_{medio}=\frac{\lambda_0}{n}`, d:"Índice de refracción", clave:true},
    {tex:R`E=hf=\frac{hc}{\lambda}`, d:"Energía de un fotón (tema 11)"},
    {tex:R`I=\frac{P}{4\pi r^2}`, d:"Intensidad de una fuente puntual"}
  ],
  sim:"espectro",
  claves:[
    R`Al entrar en un medio, $f$ se conserva y $\lambda$ disminuye: un láser rojo sigue siendo rojo dentro del agua.`,
    R`$c$ es el límite de velocidad del universo (tema 10) y solo se alcanza en el vacío.`,
    R`Recuerda el orden del espectro por energía creciente: radio, microondas, IR, visible, UV, X, gamma.`,
    R`Dentro del visible, el rojo es el de mayor $\lambda$ y menor energía; el violeta, al revés.`
  ],
  problemas:[{
    e:R`Una emisora de radio FM emite a 98,5 MHz y un láser verde tiene $\lambda=532$ nm en el vacío. Calcula la longitud de onda de la emisora, la frecuencia del láser y la velocidad y longitud de onda de ese láser al entrar en agua ($n=1{,}33$).`,
    pasos:[
      R`Emisora: $\lambda=c/f=3\cdot10^{8}/98{,}5\cdot10^{6}=3{,}05$ m.`,
      R`Láser: $f=c/\lambda=3\cdot10^{8}/532\cdot10^{-9}=5{,}64\cdot10^{14}$ Hz.`,
      R`En el agua: $v=c/n=3\cdot10^{8}/1{,}33=2{,}26\cdot10^{8}$ m/s.`,
      R`Longitud de onda en el agua: $\lambda'=\lambda_0/n=532/1{,}33=400$ nm. La frecuencia sigue siendo $5{,}64\cdot10^{14}$ Hz.`
    ]
  }],
  test:[
    {q:R`En una onda electromagnética, los campos eléctrico y magnético están:`,
     op:["en oposición de fase y son paralelos","en fase y son perpendiculares entre sí","desfasados π/2","siempre en reposo"], sol:1,
     why:R`Oscilan en fase, perpendiculares entre sí y a la dirección de propagación, cumpliendo $E=cB$.`},
    {q:R`¿Cuál de estas radiaciones tiene mayor energía por fotón?`,
     op:["Microondas","Luz roja","Ultravioleta","Ondas de radio"], sol:2,
     why:R`$E=hf$: de las cuatro, el ultravioleta es la de mayor frecuencia.`},
    {q:R`Al pasar la luz del aire al vidrio (n = 1,5):`,
     op:["aumenta su frecuencia","disminuye su longitud de onda","aumenta su velocidad","cambia su color"], sol:1,
     why:R`$v$ y $\lambda$ se reducen en un factor $n$; la frecuencia, y con ella el color, no cambian.`},
    {q:R`La polarización de la luz demuestra que:`,
     op:["la luz es longitudinal","la luz es transversal","la luz necesita un medio","la luz tiene masa"], sol:1,
     why:R`Solo las ondas transversales pueden polarizarse, ya que su vibración es perpendicular a la propagación.`},
    {q:R`El valor de c se obtiene teóricamente a partir de:`,
     op:["la constante de Planck","la permitividad y la permeabilidad del vacío","la constante de gravitación","el índice de refracción del aire"], sol:1,
     why:R`$c=1/\sqrt{\varepsilon_0\mu_0}$, resultado obtenido por Maxwell.`}
  ]
},

{
  n:4, id:"t4", titulo:"Óptica geométrica", lema:"Espejos y lentes",
  bloque:"C. Vibraciones y ondas",
  resumen:"Cuando los objetos son mucho mayores que la longitud de onda podemos olvidarnos de la naturaleza ondulatoria de la luz y trabajar con rayos. Con dos leyes y una ecuación se explican el ojo, las gafas, la lupa, el microscopio y el telescopio.",
  secciones:[
    {h:"Reflexión y refracción",
     p:[R`En la **reflexión**, el rayo incidente, la normal y el reflejado están en el mismo plano y el ángulo de incidencia es igual al de reflexión.`,
        R`En la **refracción**, el rayo cambia de dirección al cambiar de medio según la **ley de Snell**: $n_1\sin\hat\imath=n_2\sin\hat r$. Si pasa a un medio más refringente se acerca a la normal; si pasa a uno menos refringente, se aleja.`],
     ul:[R`**Ángulo límite**: cuando la luz va del medio más denso al menos denso, existe un ángulo a partir del cual no hay rayo refractado, $\sin\hat\imath_L=n_2/n_1$.`,
         R`Por encima de ese ángulo se produce **reflexión total**, principio de la fibra óptica y de los endoscopios.`]},
    {h:"Convenio de signos DIN",
     p:[R`Se sitúa el origen en el centro óptico (lentes) o en el vértice (espejos) y la luz se dibuja viajando de izquierda a derecha. Las distancias medidas en el sentido de propagación son positivas; las contrarias, negativas.`],
     ul:[R`Un objeto real está siempre a la izquierda, así que $s<0$.`,
         R`Si al resolver sale $s'>0$ en una lente, la imagen es **real** (está a la derecha, donde llega la luz). Si sale $s'<0$, es **virtual**.`,
         R`En espejos es al revés, porque la luz vuelve hacia atrás: $s'<0$ corresponde a imagen real.`,
         R`Si el aumento $\beta$ es negativo, la imagen es invertida; si es positivo, derecha. Si $|\beta|>1$, mayor que el objeto.`]},
    {h:"Espejos esféricos",
     p:[R`Un espejo cóncavo ($R<0$ en el convenio DIN) puede dar imágenes reales o virtuales según dónde esté el objeto; un espejo convexo da siempre imagen virtual, derecha y menor, por eso se usa como retrovisor y en las esquinas de los aparcamientos.`],
     ul:[R`Rayos notables: el paralelo al eje se refleja pasando por el foco; el que pasa por el foco sale paralelo; el que pasa por el centro de curvatura vuelve sobre sí mismo.`]},
    {h:"Lentes delgadas e instrumentos",
     p:[R`Una lente **convergente** ($f'>0$) da imagen real e invertida si el objeto está más lejos del foco, y virtual, derecha y mayor si está más cerca: ese es el funcionamiento de la **lupa**. Una lente **divergente** ($f'<0$) da siempre imagen virtual, derecha y menor.`,
        R`La **potencia** de una lente, $P=1/f'$, se mide en dioptrías (m⁻¹) y es el dato que aparece en las recetas de gafas.`],
     ul:[R`**Miopía**: el ojo enfoca antes de la retina; se corrige con lente divergente.`,
         R`**Hipermetropía**: enfoca detrás de la retina; se corrige con lente convergente.`,
         R`El **microscopio** y el **telescopio** combinan objetivo y ocular; en el telescopio el aumento angular es $f'_{obj}/f'_{oc}$.`]}
  ],
  formulas:[
    {tex:R`\hat\imath=\hat r`, d:"Ley de la reflexión"},
    {tex:R`n_1\sin\hat\imath = n_2\sin\hat r`, d:"Ley de Snell de la refracción", clave:true},
    {tex:R`\sin\hat\imath_L=\frac{n_2}{n_1}\quad (n_1>n_2)`, d:"Ángulo límite y reflexión total", clave:true},
    {tex:R`\frac{1}{s'}+\frac{1}{s}=\frac{2}{R}=\frac{1}{f}`, d:"Ecuación de los espejos esféricos", clave:true},
    {tex:R`\beta=\frac{y'}{y}=-\frac{s'}{s}`, d:"Aumento lateral en espejos"},
    {tex:R`\frac{1}{s'}-\frac{1}{s}=\frac{1}{f'}`, d:"Ecuación de las lentes delgadas", clave:true},
    {tex:R`\beta=\frac{y'}{y}=\frac{s'}{s}`, d:"Aumento lateral en lentes", clave:true},

        R`La **energía de puesta en órbita** es la diferencia entre la energía mecánica en órbita y en la superficie. Y si se quiere escapar del campo ($E_m\ge0$), la velocidad mínima necesaria es la **velocidad de escape**.`],

    {q:R`El flujo eléctrico a través de una superficie cerrada que no encierra carga neta es:`,
     op:["proporcional al área","nulo","infinito","igual a E·S siempre"], sol:1,
     why:R`Por el teorema de Gauss, $\Phi=q_{int}/\varepsilon_0=0$: entran tantas líneas como salen.`},
    {q:R`Una diferencia con el campo gravitatorio es que el eléctrico:`,
     op:["no es conservativo","puede ser repulsivo y apantallarse","no cumple la ley del inverso del cuadrado","no tiene potencial"], sol:1,
     why:R`Ambos son centrales y conservativos, pero solo el eléctrico tiene dos signos y admite apantallamiento.`}
  ]
},

{
  n:8, id:"t8", titulo:"Electromagnetismo", lema:"El campo magnético",
  bloque:"B. Campo electromagnético",
  resumen:"Oersted descubrió en 1820 que una corriente desvía una brújula: electricidad y magnetismo son la misma cosa. El campo magnético no actúa sobre cargas en reposo, sino sobre cargas en movimiento, y esa es la base de motores, altavoces y aceleradores.",
  secciones:[
    {h:"El campo magnético",
     p:[R`El campo magnético $\vec B$ se mide en teslas (T) y se representa con líneas **cerradas** que salen del polo norte y entran por el sur del imán. No existen monopolos magnéticos: si partes un imán obtienes dos imanes completos.`,
        R`El **experimento de Oersted** demostró que las corrientes eléctricas crean campo magnético; Ampère completó la idea mostrando que dos corrientes se atraen o se repelen.`]},
    {h:"Fuerza sobre cargas y corrientes",
     p:[R`La **fuerza de Lorentz** sobre una carga en movimiento es $\vec F=q\,\vec v\times\vec B$: perpendicular a la velocidad y al campo, de módulo $qvB\sin\alpha$. Al ser siempre perpendicular al desplazamiento, **no realiza trabajo** y no cambia el módulo de la velocidad, solo su dirección.`,
        R`Si $\vec v\perp\vec B$ la trayectoria es una circunferencia de radio $r=mv/qB$, con un periodo que no depende de la velocidad. En eso se basan el ciclotrón y el espectrómetro de masas.`],
     ul:[R`Sobre un hilo con corriente: $\vec F=I\,\vec L\times\vec B$.`,
         R`Sobre una espira: el campo genera un par de fuerzas que la hace girar, principio del **motor eléctrico** y del galvanómetro.`,
         R`Si hay campo eléctrico y magnético a la vez: $\vec F=q(\vec E+\vec v\times\vec B)$, que permite construir un **selector de velocidades** cuando ambas fuerzas se equilibran ($v=E/B$).`]},
    {h:"Campos creados por corrientes",
     ul:[R`**Hilo recto indefinido**: $B=\dfrac{\mu_0 I}{2\pi d}$, líneas circulares concéntricas (regla de la mano derecha).`,
         R`**Espira circular** en su centro: $B=\dfrac{\mu_0 I}{2R}$.`,
         R`**Solenoide**: $B=\dfrac{\mu_0 N I}{L}$, prácticamente uniforme en su interior.`,
         R`**Ley de Ampère**: $\oint\vec B\cdot d\vec l=\mu_0 I_{int}$, el equivalente magnético del teorema de Gauss.`,
         R`**Fuerza entre hilos paralelos**: $\dfrac{F}{L}=\dfrac{\mu_0I_1I_2}{2\pi d}$; se atraen si las corrientes tienen el mismo sentido.`]}
  ],
  formulas:[
    {tex:R`\vec F=q\,\vec v\times\vec B \qquad F=qvB\sin\alpha`, d:"Fuerza de Lorentz", clave:true},
    {tex:R`r=\frac{mv}{qB}\qquad T=\frac{2\pi m}{qB}`, d:"Movimiento circular en un campo magnético", clave:true},
    {tex:R`\vec F=I\,\vec L\times\vec B`, d:"Fuerza sobre un conductor rectilíneo", clave:true},
    {tex:R`B=\frac{\mu_0 I}{2\pi d}\qquad \mu_0=4\pi\cdot10^{-7}\ \mathrm{T\,m/A}`, d:"Campo de un hilo indefinido", clave:true},
    {tex:R`B=\frac{\mu_0 I}{2R}\qquad B=\frac{\mu_0 N I}{L}`, d:"Espira y solenoide"},
    {tex:R`\frac{F}{L}=\frac{\mu_0 I_1 I_2}{2\pi d}`, d:"Fuerza entre dos hilos paralelos"},
    {tex:R`\vec F=q(\vec E+\vec v\times\vec B)`, d:"Fuerza electromagnética total"}
  ],
  sim:"lorentz",
  claves:[
    R`La fuerza magnética **nunca realiza trabajo** sobre una carga libre: no cambia su energía cinética.`,
    R`Si $\vec v$ es paralela a $\vec B$, la fuerza es nula y la carga sigue recta.`,
    R`Usa la regla de la mano derecha con cuidado y recuerda invertir el sentido si la carga es negativa.`,
    R`El periodo del movimiento circular no depende de $v$ ni de $r$: por eso funciona el ciclotrón.`
  ],
  problemas:[{
    e:R`Un protón ($q=1{,}6\cdot10^{-19}$ C, $m=1{,}67\cdot10^{-27}$ kg) entra perpendicularmente a un campo magnético de 0,5 T con una velocidad de $2\cdot10^{6}$ m/s. Calcula la fuerza, el radio de la trayectoria y el periodo.`,
    pasos:[
      R`Fuerza: $F=qvB\sin90^\circ=1{,}6\cdot10^{-19}\cdot2\cdot10^{6}\cdot0{,}5=1{,}6\cdot10^{-13}$ N.`,
      R`Como $\vec F\perp\vec v$ siempre, la trayectoria es circular y $F$ actúa de fuerza centrípeta.`,
      R`Radio: $r=mv/qB=1{,}67\cdot10^{-27}\cdot2\cdot10^{6}/(1{,}6\cdot10^{-19}\cdot0{,}5)=4{,}2\cdot10^{-2}$ m.`,
      R`Periodo: $T=2\pi m/qB=2\pi\cdot1{,}67\cdot10^{-27}/(1{,}6\cdot10^{-19}\cdot0{,}5)=1{,}3\cdot10^{-7}$ s.`
    ]
  }],
  test:[
    {q:R`Una carga en reposo dentro de un campo magnético experimenta una fuerza:`,
     op:["máxima","nula","perpendicular al campo","igual a qB"], sol:1,
     why:R`$F=qvB\sin\alpha$ y si $v=0$ la fuerza es nula: el campo magnético solo actúa sobre cargas en movimiento.`},
    {q:R`El trabajo realizado por la fuerza magnética sobre una carga libre es:`,
     op:["positivo","negativo","nulo","depende del campo"], sol:2,
     why:R`La fuerza es siempre perpendicular al desplazamiento, luego $W=0$ y la energía cinética no cambia.`},
    {q:R`Dos hilos paralelos con corrientes del mismo sentido:`,
     op:["se atraen","se repelen","no interaccionan","giran"], sol:0,
     why:R`El campo de uno ejerce sobre el otro una fuerza dirigida hacia él cuando las corrientes son paralelas y del mismo sentido.`},
    {q:R`Si se duplica la velocidad de una partícula que gira en un campo magnético, el periodo:`,
     op:["se duplica","se reduce a la mitad","no cambia","se cuadruplica"], sol:2,
     why:R`$T=2\pi m/qB$ no depende de la velocidad: el radio aumenta, pero el tiempo de vuelta es el mismo.`},
    {q:R`El campo creado por un hilo indefinido a 10 cm de distancia con I = 5 A vale:`,
     op:["1·10⁻⁵ T","1·10⁻⁶ T","5·10⁻⁵ T","2·10⁻⁴ T"], sol:0,
     why:R`$B=\mu_0I/2\pi d=4\pi\cdot10^{-7}\cdot5/(2\pi\cdot0{,}1)=1\cdot10^{-5}$ T.`}
  ]
},

{
  n:9, id:"t9", titulo:"Inducción electromagnética", lema:"Faraday, Lenz y la corriente alterna",
  bloque:"B. Campo electromagnético",
  resumen:"Si una corriente crea un campo magnético, ¿puede un campo magnético crear una corriente? Faraday y Henry respondieron que sí, siempre que el flujo varíe. De esa respuesta salen los generadores, los transformadores y todo el sistema eléctrico moderno.",
  secciones:[
    {h:"Flujo magnético",
     p:[R`El **flujo magnético** a través de una superficie mide cuántas líneas de campo la atraviesan: $\Phi=\vec B\cdot\vec S=BS\cos\alpha$, donde $\alpha$ es el ángulo entre $\vec B$ y la normal a la superficie. Se mide en webers (Wb).`,
        R`Para inducir corriente hay tres formas de hacer variar el flujo: cambiar $B$ (acercando un imán), cambiar $S$ (deformando el circuito) o cambiar $\alpha$ (haciendo girar la espira, que es lo que hace un alternador).`]},
    {h:"Ley de Faraday-Lenz",
     p:[R`La **fuerza electromotriz inducida** es igual a la variación del flujo por unidad de tiempo, cambiada de signo: $\varepsilon=-N\dfrac{d\Phi}{dt}$.`,
        R`El signo menos es la **ley de Lenz**: la corriente inducida se opone a la causa que la produce. No es un capricho, es la conservación de la energía: si fuera al revés obtendríamos energía de la nada.`],
     ul:[R`Si acercas el polo norte de un imán a una espira, la cara enfrentada se comporta como un norte y lo repele.`,
         R`Una **barra** de longitud $L$ que se mueve con velocidad $v$ perpendicular a $\vec B$ genera $\varepsilon=BLv$.`,
         R`Aplicaciones de la ley de Lenz: frenos magnéticos, cocinas de inducción, placas de vitrocerámica y detectores de metales.`]},
    {h:"Alternador y transformador",
     p:[R`Una espira de $N$ vueltas y área $S$ que gira con velocidad angular $\omega$ dentro de un campo uniforme produce $\varepsilon=NBS\omega\sin(\omega t)$: una **fuerza electromotriz alterna sinusoidal**. Ese es el principio del alternador de cualquier central eléctrica.`,
        R`El **transformador** aprovecha la inducción mutua entre dos bobinas sobre un núcleo de hierro: $\dfrac{V_1}{V_2}=\dfrac{N_1}{N_2}$. Permite elevar la tensión para transportar la energía con pocas pérdidas y reducirla luego para el consumo.`],
     ul:[R`Valor eficaz: $V_{ef}=V_0/\sqrt2$. Los 230 V de la red son un valor eficaz.`,
         R`La **autoinducción** de una bobina, $\varepsilon=-L\,dI/dt$, se opone a las variaciones bruscas de corriente.`]}
  ],
  formulas:[
    {tex:R`\Phi=\vec B\cdot\vec S=B\,S\cos\alpha`, d:"Flujo magnético (Wb)", clave:true},
    {tex:R`\varepsilon=-N\frac{d\Phi}{dt}`, d:"Ley de Faraday-Lenz", clave:true},
    {tex:R`\varepsilon=B\,L\,v`, d:"Fem en una barra en movimiento", clave:true},
    {tex:R`\varepsilon=N B S \omega \sin(\omega t)\qquad \varepsilon_0=NBS\omega`, d:"Alternador: fem alterna", clave:true},
    {tex:R`\frac{V_1}{V_2}=\frac{N_1}{N_2}=\frac{I_2}{I_1}`, d:"Transformador ideal", clave:true},
    {tex:R`V_{ef}=\frac{V_0}{\sqrt2}\qquad I_{ef}=\frac{I_0}{\sqrt2}`, d:"Valores eficaces"},
    {tex:R`\varepsilon=-L\frac{dI}{dt}`, d:"Autoinducción"}
  ],
  sim:"induccion",
  claves:[
    R`Sin **variación** de flujo no hay fem inducida: un imán quieto dentro de una espira no induce nada.`,
    R`El signo menos de la ley de Faraday no se puede quitar: indica oposición al cambio (Lenz).`,
    R`Cuando la espira es paralela al campo el flujo es nulo, pero es justo ahí donde la fem es **máxima**, porque el flujo varía más deprisa.`,
    R`En los problemas, escribe primero $\Phi(t)$ y después deriva; no derives magnitudes constantes.`
  ],
  problemas:[{
    e:R`Una espira cuadrada de 10 cm de lado y 50 vueltas gira a 3000 rpm dentro de un campo de 0,2 T. Calcula la fem máxima y la expresión de la fem instantánea.`,
    pasos:[
      R`Área: $S=0{,}1^2=0{,}01$ m². Velocidad angular: $\omega=3000\cdot2\pi/60=314$ rad/s.`,
      R`Flujo: $\Phi=NBS\cos(\omega t)=50\cdot0{,}2\cdot0{,}01\cos(314t)=0{,}1\cos(314t)$ Wb.`,
      R`Fem: $\varepsilon=-d\Phi/dt=0{,}1\cdot314\sin(314t)=31{,}4\sin(314t)$ V.`,
      R`Fem máxima: $\varepsilon_0=NBS\omega=31{,}4$ V, que se alcanza cuando el plano de la espira es paralelo al campo.`
    ]
  }],
  test:[
    {q:R`Se induce corriente en una espira cuando:`,
     op:["hay campo magnético","el flujo magnético varía con el tiempo","la espira está en reposo en un campo uniforme","el campo es muy intenso"], sol:1,
     why:R`Lo esencial es la variación: $\varepsilon=-d\Phi/dt$.`},
    {q:R`La ley de Lenz es una consecuencia de:`,
     op:["la conservación de la carga","la conservación de la energía","la ley de Ohm","el teorema de Gauss"], sol:1,
     why:R`Si la corriente inducida favoreciese el cambio, se crearía energía indefinidamente.`},
    {q:R`Un transformador con 200 espiras en el primario y 1000 en el secundario, alimentado a 230 V, da en el secundario:`,
     op:["46 V","1150 V","230 V","500 V"], sol:1,
     why:R`$V_2=V_1N_2/N_1=230\cdot1000/200=1150$ V. Es un transformador elevador.`},
    {q:R`En un alternador, la fem es máxima cuando el flujo es:`,
     op:["máximo","mínimo (plano paralelo al campo)","negativo","constante"], sol:1,
     why:R`La fem depende de la derivada del flujo, que es máxima justo cuando el flujo pasa por cero.`},
    {q:R`Una barra de 0,5 m se mueve a 4 m/s perpendicular a un campo de 0,3 T. La fem inducida vale:`,
     op:["0,6 V","1,2 V","0,06 V","2,4 V"], sol:0,
     why:R`$\varepsilon=BLv=0{,}3\cdot0{,}5\cdot4=0{,}6$ V.`}
  ]
},

{
  n:10, id:"t10", titulo:"Física relativista", lema:"Espacio, tiempo y energía",
  bloque:"D. Física moderna",
  resumen:"A finales del XIX la mecánica de Newton y el electromagnetismo de Maxwell eran incompatibles. Einstein resolvió el conflicto en 1905 renunciando a algo que parecía intocable: el tiempo absoluto.",
  secciones:[
    {h:"La crisis de la física clásica",
     p:[R`En mecánica clásica las velocidades se suman según Galileo, pero las ecuaciones de Maxwell dan un valor fijo para $c$. Para salvar ambas cosas se supuso que la luz se propagaba por un medio, el **éter**.`,
        R`El **experimento de Michelson y Morley** (1887) intentó medir la velocidad de la Tierra respecto del éter con un interferómetro y obtuvo un resultado negativo: no había diferencia. El éter no existía.`]},
    {h:"Los postulados de Einstein",
     ul:[R`**Principio de relatividad**: las leyes de la física son las mismas en todos los sistemas de referencia inerciales.`,
         R`**Constancia de c**: la velocidad de la luz en el vacío es la misma para todos los observadores, independientemente del movimiento de la fuente o del observador.`],
     p:[R`Del segundo postulado se sigue que el tiempo y las distancias no pueden ser absolutos: dos sucesos simultáneos para un observador no lo son para otro que se mueva respecto de él.`]},
    {h:"Consecuencias: dilatación y contracción",
     p:[R`Todos los efectos relativistas se concentran en el **factor de Lorentz** $\gamma=1/\sqrt{1-v^2/c^2}$, que vale 1 para velocidades pequeñas (por eso no notamos nada en la vida diaria) y tiende a infinito cuando $v\to c$.`],
     ul:[R`**Dilatación del tiempo**: un reloj en movimiento va más lento, $\Delta t=\gamma\,\Delta t_0$, donde $\Delta t_0$ es el **tiempo propio**, medido en el sistema donde los dos sucesos ocurren en el mismo lugar.`,
         R`**Contracción de longitudes**: solo en la dirección del movimiento, $L=L_0/\gamma$, con $L_0$ la longitud propia medida en reposo.`,
         R`Comprobación experimental: los **muones** creados en la alta atmósfera llegan al suelo aunque su vida media clásica no lo permitiría. Los relojes de los satélites **GPS** deben corregirse a diario.`]},
    {h:"Masa y energía",
     p:[R`El momento lineal relativista es $p=\gamma m v$ y la energía total $E=\gamma mc^2$. Un cuerpo en reposo tiene ya una energía $E_0=mc^2$: masa y energía son dos formas de lo mismo, idea que explica la energía nuclear (tema 12).`,
        R`La energía cinética es la diferencia entre ambas, $E_c=(\gamma-1)mc^2$, que para $v\ll c$ se reduce a $\tfrac12mv^2$. Acelerar una masa hasta $c$ exigiría energía infinita: $c$ es un límite insuperable.`]}
  ],
  formulas:[
    {tex:R`\gamma=\frac{1}{\sqrt{1-\dfrac{v^2}{c^2}}}`, d:"Factor de Lorentz", clave:true},
    {tex:R`\Delta t=\gamma\,\Delta t_0`, d:"Dilatación del tiempo", clave:true},
    {tex:R`L=\frac{L_0}{\gamma}`, d:"Contracción de la longitud", clave:true},
    {tex:R`p=\gamma m v`, d:"Momento lineal relativista"},
    {tex:R`E=\gamma mc^2 \qquad E_0=mc^2`, d:"Energía total y energía en reposo", clave:true},
    {tex:R`E_c=(\gamma-1)mc^2`, d:"Energía cinética relativista", clave:true},
    {tex:R`E^2=p^2c^2+m^2c^4`, d:"Relación energía-momento"}
  ],
  sim:"relatividad",
  claves:[
    R`El tiempo propio $\Delta t_0$ es siempre el **menor**; la longitud propia $L_0$, siempre la **mayor**.`,
    R`Los efectos son **simétricos**: cada observador ve al otro más lento y más corto. No hay un sistema privilegiado.`,
    R`La contracción se da solo en la dirección del movimiento, no en las perpendiculares.`,
    R`Trabaja con $v/c$ en lugar de con $v$ en m/s: los números salen mucho más limpios.`
  ],
  problemas:[{
    e:R`Una nave viaja a 0,8c respecto de la Tierra. Su tripulación mide un viaje de 3 años y la nave tiene 100 m de longitud en reposo. Calcula el tiempo transcurrido en la Tierra y la longitud de la nave vista desde la Tierra.`,
    pasos:[
      R`Factor de Lorentz: $\gamma=1/\sqrt{1-0{,}8^2}=1/\sqrt{0{,}36}=1/0{,}6=1{,}67$.`,
      R`El tiempo propio es el de la tripulación: $\Delta t_0=3$ años.`,
      R`En la Tierra: $\Delta t=\gamma\Delta t_0=1{,}67\cdot3=5$ años.`,
      R`Longitud: $L=L_0/\gamma=100/1{,}67=60$ m (la longitud propia, 100 m, la miden los tripulantes).`
    ]
  }],
  test:[
    {q:R`El resultado del experimento de Michelson y Morley fue:`,
     op:["que el éter se movía","negativo: no se detectó movimiento respecto al éter","que la luz era más rápida en verano","que la Tierra estaba en reposo absoluto"], sol:1,
     why:R`No apareció la diferencia esperada, lo que acabó con la hipótesis del éter.`},
    {q:R`Para v = 0,6c, el factor de Lorentz vale:`,
     op:["1,25","0,8","1,67","2"], sol:0,
     why:R`$\gamma=1/\sqrt{1-0{,}36}=1/0{,}8=1{,}25$.`},
    {q:R`La longitud propia de un objeto es la medida:`,
     op:["desde un sistema en movimiento","en el sistema donde el objeto está en reposo","siempre por un observador terrestre","cuando v = c"], sol:1,
     why:R`Es la mayor de todas las longitudes medidas; cualquier observador en movimiento la ve contraída.`},
    {q:R`La energía en reposo de un electrón (m = 9,1·10⁻³¹ kg) es aproximadamente:`,
     op:["8,2·10⁻¹⁴ J","0,511 MeV","ambas son correctas","nula"], sol:2,
     why:R`$E_0=mc^2=8{,}2\cdot10^{-14}$ J, que al dividir entre $1{,}6\cdot10^{-19}$ da 0,511 MeV.`},
    {q:R`Ningún cuerpo con masa puede alcanzar la velocidad de la luz porque:`,
     op:["se rompería","haría falta energía infinita","el tiempo se pararía para el resto","la masa se anularía"], sol:1,
     why:R`Cuando $v\to c$, $\gamma\to\infty$ y por tanto $E=\gamma mc^2\to\infty$.`}
  ]
},

{
  n:11, id:"t11", titulo:"Elementos de física cuántica", lema:"Cuantización y dualidad",
  bloque:"D. Física moderna",
  resumen:"A escala atómica la energía no es continua: se intercambia en paquetes. Y la distinción entre onda y partícula deja de tener sentido. Con estas dos ideas se explican el efecto fotoeléctrico, los espectros atómicos y la electrónica actual.",
  secciones:[
    {h:"La hipótesis de Planck",
     p:[R`La física clásica predecía que un cuerpo negro emitiría energía infinita en el ultravioleta (la llamada catástrofe ultravioleta). En 1900 Planck resolvió el problema suponiendo que la energía se emite y absorbe en **cuantos** de valor $E=hf$, con $h=6{,}63\cdot10^{-34}$ J·s.`]},
    {h:"El efecto fotoeléctrico",
     p:[R`Al iluminar un metal con luz de frecuencia suficiente, se arrancan electrones. Lo que la física clásica no podía explicar es que **no dependiera de la intensidad** sino de la frecuencia, y que la emisión fuera instantánea.`,
        R`Einstein (1905) lo explicó tratando la luz como un chorro de **fotones**: cada electrón absorbe un fotón completo. Si su energía supera el **trabajo de extracción** $W_0$, el sobrante se convierte en energía cinética.`],
     ul:[R`**Frecuencia umbral**: $f_0=W_0/h$. Por debajo de ella no hay emisión, por intensa que sea la luz.`,
         R`Aumentar la intensidad aumenta el **número** de electrones, no su energía.`,
         R`El **potencial de frenado** mide la energía cinética máxima: $eV_0=E_{c,max}$.`,
         R`Aplicaciones: células fotovoltaicas, sensores de cámaras, detectores de humo, puertas automáticas.`]},
    {h:"Espectros y modelo de Bohr",
     p:[R`Los gases emiten y absorben solo ciertas frecuencias, formando espectros de líneas característicos de cada elemento. Bohr lo explicó postulando órbitas estacionarias con energías fijas: el átomo emite un fotón al saltar de un nivel a otro, con $\Delta E=hf$.`]},
    {h:"Dualidad e incertidumbre",
     p:[R`De Broglie propuso que la dualidad también funciona al revés: toda partícula lleva asociada una onda de longitud $\lambda=h/p$. Se confirmó al observar difracción de electrones, y es la base del microscopio electrónico.`,
        R`El **principio de incertidumbre** de Heisenberg pone un límite a lo que se puede conocer: no es una limitación de los aparatos, sino una propiedad de la naturaleza. Por eso en cuántica se habla de probabilidades y no de trayectorias.`]}
  ],
  formulas:[
    {tex:R`E=hf=\frac{hc}{\lambda}\qquad h=6{,}63\cdot10^{-34}\ \mathrm{J\,s}`, d:"Cuanto de energía (fotón)", clave:true},
    {tex:R`hf=W_0+E_{c,max}`, d:"Ecuación de Einstein del efecto fotoeléctrico", clave:true},
    {tex:R`W_0=hf_0=\frac{hc}{\lambda_0}`, d:"Trabajo de extracción y frecuencia umbral", clave:true},
    {tex:R`E_{c,max}=eV_0=\tfrac12mv_{max}^2`, d:"Potencial de frenado"},
    {tex:R`\lambda=\frac{h}{p}=\frac{h}{mv}`, d:"Longitud de onda de De Broglie", clave:true},
    {tex:R`\Delta x\cdot\Delta p\ \ge\ \frac{\hbar}{2}\qquad \Delta E\cdot\Delta t\ \ge\ \frac{\hbar}{2}`, d:"Principio de incertidumbre", clave:true},
    {tex:R`\Delta E=E_2-E_1=hf`, d:"Transición entre niveles atómicos"}
  ],
  sim:"fotoelectrico",
  claves:[
    R`En el efecto fotoeléctrico manda la **frecuencia**, no la intensidad: es el error más repetido en los exámenes.`,
    R`Pasa siempre $W_0$ de eV a julios (multiplicando por $1{,}6\cdot10^{-19}$) antes de sustituir.`,
