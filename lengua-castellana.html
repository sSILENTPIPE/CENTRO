<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castellano PAU 27</title>
<meta name="description" content="Plataforma de estudio de Lengua Castellana y Literatura II para la PAU 2027 (Illes Balears): comunicación, reflexión sobre la lengua, educación literaria y simulador de examen.">
<meta name="color-scheme" content="light dark">

<!-- Aplicar el tema antes de pintar, para que no parpadee al cargar -->
<script>
  (function () {
    try {
      var g = localStorage.getItem('tema');
      if (g) document.documentElement.setAttribute('data-theme', g === 'oscuro' ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>

<!-- Las fuentes son un lujo: si no hay red, se usan las del sistema -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">

<style>
  :root{
    --paper:#F6F7FA; --surface:#FFFFFF; --surface-2:#F0F3F7; --glass:#FFFFFFE0;
    --ink:#0F1A2A; --ink-soft:#46536A; --muted:#738199;
    --line:#E1E7EF; --line-soft:#ECF0F5;
    --acc:#0E7490; --acc-ink:#0B5D74; --acc-soft:rgba(14,116,144,.09); --acc-line:rgba(14,116,144,.28);
    --b1:#2563EB; --b2:#B4371F; --b3:#7C3AED;
    --ok:#15803D; --ok-soft:rgba(21,128,61,.10);
    --warn:#B45309; --warn-soft:rgba(180,83,9,.10);
    --bad:#B91C1C; --bad-soft:rgba(185,28,28,.09);
    --shadow:0 1px 2px rgba(15,26,42,.05), 0 12px 32px -20px rgba(15,26,42,.35);
    --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --disp:"Space Grotesk","IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#080D16; --surface:#111925; --surface-2:#172131; --glass:#111925E0;
      --ink:#E9EEF6; --ink-soft:#AEBACB; --muted:#7D8BA1;
      --line:#223047; --line-soft:#1A2536;
      --acc:#38BDD8; --acc-ink:#7DD7EA; --acc-soft:rgba(56,189,216,.11); --acc-line:rgba(56,189,216,.32);
      --b1:#7AA2F7; --b2:#F08A6E; --b3:#B69CF6;
      --ok:#4ADE80; --ok-soft:rgba(74,222,128,.11);
      --warn:#FBBF24; --warn-soft:rgba(251,191,36,.11);
      --bad:#F87171; --bad-soft:rgba(248,113,113,.11);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -20px rgba(0,0,0,.7);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#080D16; --surface:#111925; --surface-2:#172131; --glass:#111925E0;
    --ink:#E9EEF6; --ink-soft:#AEBACB; --muted:#7D8BA1;
    --line:#223047; --line-soft:#1A2536;
    --acc:#38BDD8; --acc-ink:#7DD7EA; --acc-soft:rgba(56,189,216,.11); --acc-line:rgba(56,189,216,.32);
    --b1:#7AA2F7; --b2:#F08A6E; --b3:#B69CF6;
    --ok:#4ADE80; --ok-soft:rgba(74,222,128,.11);
    --warn:#FBBF24; --warn-soft:rgba(251,191,36,.11);
    --bad:#F87171; --bad-soft:rgba(248,113,113,.11);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:120px}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;transition:background-color .35s ease,color .35s ease;overflow-x:hidden}
  h1,h2,h3,h4,p,ul,ol,figure,blockquote{margin:0}
  ul,ol{padding-left:1.25rem}
  li+li{margin-top:.25rem}
  a{color:var(--acc-ink)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  ::selection{background:var(--acc-line)}
  [hidden]{display:none !important}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

  /* ============ fondo ============ */
  .aurora{position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(44rem 30rem at 4% -10%, rgba(14,116,144,.20), transparent 70%),
      radial-gradient(38rem 28rem at 98% -8%, rgba(124,58,237,.14), transparent 70%),
      radial-gradient(40rem 30rem at 50% 115%, rgba(37,99,235,.10), transparent 70%)}
  .trama{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:radial-gradient(rgba(15,26,42,.06) 1px, transparent 1px);background-size:26px 26px;
    -webkit-mask-image:radial-gradient(ellipse 85% 60% at 50% 0%, #000 30%, transparent 100%);
            mask-image:radial-gradient(ellipse 85% 60% at 50% 0%, #000 30%, transparent 100%)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .trama{background-image:radial-gradient(rgba(190,210,255,.07) 1px, transparent 1px)} }
  :root[data-theme="dark"] .trama{background-image:radial-gradient(rgba(190,210,255,.07) 1px, transparent 1px)}

  /* ============ cabecera ============ */
  .top{position:sticky;top:0;z-index:30;background:var(--glass);border-bottom:1px solid var(--line);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .marca{display:flex;align-items:center;gap:10px;min-width:0}
  .marca-ico{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;
    color:var(--acc);background:var(--acc-soft);border:1px solid var(--acc-line)}
  .marca-ico svg{width:20px;height:20px}
  .marca b{display:block;font-family:var(--disp);font-size:1.02rem;letter-spacing:-.01em;line-height:1.2}
  .marca small{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acciones{display:flex;gap:8px;align-items:center;flex:none}
  .icobtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 11px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);text-decoration:none;font-size:.85rem;font-weight:500}
  .icobtn:hover{color:var(--ink);border-color:var(--acc-line)}
  .icobtn svg{width:17px;height:17px}
  .tema .sol{display:none}
  :root[data-theme="dark"] .tema .sol{display:block} :root[data-theme="dark"] .tema .luna{display:none}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tema .sol{display:block}
    :root:not([data-theme="light"]) .tema .luna{display:none}
  }
  .nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;display:flex;align-items:center;gap:7px;padding:9px 12px 11px;text-decoration:none;color:var(--ink-soft);
    font-weight:500;font-size:.92rem;border-bottom:2px solid transparent;white-space:nowrap}
  .nav a:hover{color:var(--ink)}
  .nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--acc)}
  .nav .pts{font-family:var(--mono);font-size:.68rem;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
  .nav a[aria-current="page"] .pts{background:var(--acc-soft);color:var(--acc-ink)}

  /* reloj del simulador, fijo arriba cuando hay examen */
  .reloj{display:none;align-items:center;gap:8px;font-family:var(--mono);font-weight:500;font-size:.95rem;
    padding:0 12px;height:38px;border-radius:12px;border:1px solid var(--acc-line);background:var(--acc-soft);color:var(--acc-ink)}
  .reloj.on{display:inline-flex}
  .reloj.aviso{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
  .reloj.fin{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

  /* ============ estructura ============ */
  main{max-width:1180px;margin:0 auto;padding:28px 16px 80px}
  .vista{animation:entra .4s cubic-bezier(.16,.84,.34,1)}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .cab{margin-bottom:22px;max-width:760px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--acc))}
  h1.tit{font-family:var(--disp);font-size:clamp(1.9rem,4.6vw,2.9rem);line-height:1.08;letter-spacing:-.025em;margin-top:10px}
  h2.sub{font-family:var(--disp);font-size:1.35rem;letter-spacing:-.015em;line-height:1.25}
  h3{font-family:var(--disp);font-size:1.08rem;letter-spacing:-.01em;line-height:1.3}
  .lead{color:var(--ink-soft);font-size:1.04rem;margin-top:10px}
  .soft{color:var(--ink-soft)} .muted{color:var(--muted)} .mono{font-family:var(--mono)}
  .small{font-size:.86rem} .tiny{font-size:.76rem}
  .bloque{margin-top:34px}
  .bloque>.sub{margin-bottom:6px}
  .bloque>.soft{margin-bottom:16px;max-width:760px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
  .fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .entre{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .pila>*+*{margin-top:12px}

  /* ============ piezas ============ */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
  .card.plano{box-shadow:none}
  .card.click{cursor:pointer;transition:transform .3s cubic-bezier(.16,.84,.34,1),border-color .3s ease}
  .card.click:hover{transform:translateY(-3px);border-color:var(--acc-line)}
  .card h3+p,.card h3+ul{margin-top:6px}
  .filo{border-top:3px solid var(--c,var(--acc))}
  .tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;
    padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);background:var(--surface-2);white-space:nowrap}
  .tag.acc{border-color:var(--acc-line);background:var(--acc-soft);color:var(--acc-ink)}
  .tag.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
  .tag.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
  .tag.bad{border-color:transparent;background:var(--bad-soft);color:var(--bad)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 15px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:.92rem;text-decoration:none;
    transition:border-color .2s ease,background-color .2s ease,transform .15s ease}
  .btn:hover{border-color:var(--acc-line)}
  .btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  :root[data-theme="dark"] .btn.pri{color:#04222B}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.pri{color:#04222B} }
  .btn.pri:hover{filter:brightness(1.07)}
  .btn.peq{min-height:32px;padding:4px 11px;font-size:.84rem;border-radius:10px}
  .btn.grande{min-height:52px;padding:12px 22px;font-size:1.02rem;border-radius:14px;font-family:var(--disp);font-weight:600}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn svg{width:17px;height:17px}
  .seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}
  .seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-size:.88rem;color:var(--ink-soft);font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  select,input[type=text],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    font-size:.96rem;line-height:1.55;transition:border-color .2s ease}
  select{width:auto;max-width:100%;padding:8px 10px}
  textarea{min-height:120px;resize:vertical}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--acc)}
  label.lab{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
  .cuenta{font-family:var(--mono);font-size:.74rem;color:var(--muted);text-align:right;margin-top:4px}
  .cuenta.ok{color:var(--ok)} .cuenta.mal{color:var(--warn)}

  /* acordeones */
  details.acc{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
  details.acc+details.acc{margin-top:10px}
  details.acc>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    transform:rotate(45deg);transition:transform .25s ease;margin-right:4px}
  details.acc[open]>summary::after{transform:rotate(-135deg)}
  details.acc>summary:hover{background:var(--surface-2)}
  details.acc>.in{padding:2px 16px 16px;border-top:1px solid var(--line-soft)}
  details.acc>.in>*+*{margin-top:10px}
  details.acc>.in h4{font-size:.94rem;margin-top:14px}
  .tabla{width:100%;border-collapse:collapse;font-size:.9rem}
  .tabla th,.tabla td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  .tabla th{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .nota{border-left:3px solid var(--acc);background:var(--acc-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.92rem}
  .nota.warn{border-color:var(--warn);background:var(--warn-soft)}
  .nota.ok{border-color:var(--ok);background:var(--ok-soft)}
  .nota.bad{border-color:var(--bad);background:var(--bad-soft)}
  .ej{font-family:var(--serif);font-style:italic;color:var(--ink-soft)}
  mark{background:var(--acc-soft);color:inherit;border-radius:4px;padding:0 2px}

  /* textos para leer */
  .texto{font-family:var(--serif);font-size:1.06rem;line-height:1.75;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:20px 22px;max-height:none}
  .texto h3{font-family:var(--serif);font-size:1.25rem;font-weight:600;margin-bottom:2px}
  .texto .fuente{font-family:var(--sans);font-size:.8rem;color:var(--muted);margin-bottom:12px}
  .texto p+p{margin-top:.8em;text-indent:1.2em}
  .texto.verso p{white-space:pre-line;text-indent:0}
  .texto.verso p+p{margin-top:1em}
  .texto .dial{display:block;text-indent:0}
  .texto .acot{font-style:italic;color:var(--ink-soft)}
  .texto .pers{font-variant:small-caps;font-weight:600;letter-spacing:.03em}

  /* preguntas */
  .preg{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px}
  .preg+.preg{margin-top:12px}
  .preg-cab{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
  .preg-cab h3{font-size:1rem}
  .punt{flex:none;font-family:var(--mono);font-size:.74rem;padding:3px 9px;border-radius:999px;background:var(--acc-soft);color:var(--acc-ink);border:1px solid var(--acc-line)}
  .modelo{margin-top:12px;border:1px dashed var(--acc-line);background:var(--acc-soft);border-radius:12px;padding:12px 14px;font-size:.94rem}
  .modelo b.t{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink);margin-bottom:4px}
  .modelo p+p{margin-top:.6em}
  .rubrica{margin-top:12px;display:grid;gap:6px}
  .rubrica label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid var(--line-soft);background:var(--surface-2);font-size:.9rem;cursor:pointer}
  .rubrica input{margin-top:4px;accent-color:var(--acc);flex:none}
  .rubrica .v{margin-left:auto;font-family:var(--mono);font-size:.74rem;color:var(--muted);flex:none;padding-left:8px}
  .opcs{display:grid;gap:8px}
  .opc{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:.94rem}
  .opc:hover{border-color:var(--acc-line)}
  .opc .l{flex:none;font-family:var(--mono);font-size:.78rem;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
  .opc.sel{border-color:var(--acc);background:var(--acc-soft)}
  .opc.bien{border-color:var(--ok);background:var(--ok-soft)}
  .opc.mal{border-color:var(--bad);background:var(--bad-soft)}
  .opc[disabled]{cursor:default}

  /* analizador sintáctico */
  .frase{display:flex;flex-wrap:wrap;align-items:center;row-gap:10px;font-family:var(--serif);font-size:1.18rem;line-height:1.4;
    padding:18px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
  .pal{padding:2px 3px;border-radius:6px}
  .pal.verbo{background:var(--warn-soft);box-shadow:inset 0 -2px 0 var(--warn)}
  .pal.p0{color:var(--b1)} .pal.p1{color:var(--b2)} .pal.p2{color:var(--b3)} .pal.p3{color:var(--ok)} .pal.p4{color:var(--warn)}
  .hueco{width:16px;height:30px;border:0;background:transparent;position:relative;padding:0;margin:0 1px}
  .hueco::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;transform:translateX(-50%);border-radius:2px;background:var(--line);transition:background-color .15s ease}
  .hueco:hover::before{background:var(--acc-line)}
  .hueco.on::before{width:4px;background:var(--acc)}
  .hueco.on::after{content:"✂";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--acc)}
  .hueco.bien::before{background:var(--ok)} .hueco.mal::before{background:var(--bad)} .hueco.falta::before{background:var(--warn);width:4px}
  .props{display:grid;gap:10px;margin-top:14px}
  .prop{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
  .prop .n{flex:none;font-family:var(--mono);font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--surface-2)}
  .rel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0 4px 18px;border-left:2px dashed var(--line);margin-left:18px}
  .rel input{width:150px}
  .rel .est{font-size:.82rem}

  /* fichas de literatura */
  .obra{position:relative;overflow:hidden}
  .obra .anio{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
  .obra h3{margin-top:6px}
  .obra .aut{font-size:.9rem;color:var(--ink-soft)}
  .obra .pie{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .lista-temas li::marker{color:var(--acc)}
  .flash-wrap{perspective:1200px;max-width:640px;margin:0 auto}
  .flash{position:relative;min-height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.16,.84,.34,1)}
  .flash.vuelta{transform:rotateY(180deg)}
  .flash .cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:24px;
    display:flex;flex-direction:column;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
  .flash .cara.atras{transform:rotateY(180deg);background:var(--acc-soft);border-color:var(--acc-line)}
  .flash .q{font-family:var(--disp);font-size:1.22rem;line-height:1.35}
  .flash .a{font-size:1rem;line-height:1.6}
  .flash .tipo{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .barra{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line-soft)}
  .barra>i{display:block;height:100%;background:var(--acc);border-radius:inherit;transition:width .4s ease}

  /* inicio */
  .hero{display:grid;gap:18px;grid-template-columns:1fr}
  @media (min-width:900px){ .hero{grid-template-columns:1.25fr .75fr;align-items:end} }
  .cuentaatras{display:flex;gap:10px;flex-wrap:wrap}
  .cuentaatras div{flex:1;min-width:76px;text-align:center;padding:12px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
  .cuentaatras b{display:block;font-family:var(--disp);font-size:1.8rem;line-height:1.1}
  .cuentaatras span{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .reparto{display:flex;height:46px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .reparto a{display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;text-decoration:none;font-weight:600;font-size:.86rem;min-width:0;padding:0 6px;white-space:nowrap;overflow:hidden}
  .stat b{display:block;font-family:var(--disp);font-size:1.6rem;line-height:1.1}
  .stat span{font-size:.84rem;color:var(--ink-soft)}
  .linea{position:relative;display:grid;gap:10px;padding-left:18px}
  .linea::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .linea .it{position:relative}
  .linea .it::before{content:"";position:absolute;left:-17px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--acc));border:2px solid var(--surface)}

  /* examen */
  .ex-parte{margin-top:26px}
  .ex-parte>h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .elige{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer;font-weight:500}
  .elige input{accent-color:var(--acc);width:18px;height:18px}
  .nota-final{font-family:var(--disp);font-size:clamp(3rem,10vw,5rem);line-height:1;letter-spacing:-.03em}
  .desglose{display:grid;gap:8px}
  .desglose .r{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
  .vacio{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;z-index:50;
    background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.9rem;transition:opacity .25s ease,transform .25s ease;max-width:calc(100% - 32px)}
  .toast.on{opacity:1;transform:translateX(-50%)}

  footer{border-top:1px solid var(--line);padding:22px 16px;text-align:center;font-family:var(--mono);font-size:.72rem;color:var(--muted)}

  @media (max-width:560px){

    .card{padding:15px;border-radius:16px}

  @media (prefers-reduced-motion: reduce){

    .top,.aurora,.trama,footer,.no-print{display:none !important}
    body{background:#fff;color:#000}
    .card,.preg,.texto{box-shadow:none;break-inside:avoid}

<script>
/* =====================================================================
   BLOQUE I · COMUNICACIÓN
   Textos periodísticos de elaboración propia (para no reproducir prensa
   con derechos), cada uno con sus tres preguntas resueltas.
   ===================================================================== */
const TEXTOS = [
{
  id:'biblio', genero:'Artículo de opinión', grupo:'opinión',
  titulo:'El último salón gratuito',
  fuente:'Texto de elaboración propia con formato de artículo de opinión firmado.',
  p:[
`El sábado pasado conté cuarenta y tres personas en la biblioteca de mi barrio antes de las diez de la mañana. Había estudiantes con ojeras de examen, un jubilado que leía la prensa con una lupa, una madre que buscaba cuentos mientras su hijo exploraba las estanterías a gatas y dos chicos que, sencillamente, aprovechaban el wifi y la calefacción. Nadie les pidió que consumieran nada. Nadie les miró mal por quedarse tres horas.`,
`Las bibliotecas públicas son el último salón de la ciudad que no te cobra por sentarte. Lo digo sin nostalgia: en una urbe donde cada banco se ha convertido en una terraza y cada plaza en un escaparate, el simple derecho a estar se ha vuelto un lujo. Las estadísticas oficiales muestran que las visitas a las bibliotecas no dejan de crecer, sobre todo entre los menores de veinticinco años. No es casualidad: los jóvenes no buscan solo libros, buscan un lugar.`,
`Sin embargo, cada vez que llega la hora de recortar, las bibliotecas son las primeras en pagar. Se reducen horarios, se congelan las compras y se cubre con voluntarios lo que debería ser un empleo. ¿Alguien imagina que se cerrara un hospital los sábados por falta de presupuesto? Pues eso es exactamente lo que hacemos con la cultura cuando decidimos que puede esperar.`,
`Quizá deberíamos dejar de pensar en la biblioteca como un almacén de libros y empezar a verla como lo que es: una infraestructura de la igualdad. Allí el hijo del fontanero y la hija del notario se sientan a la misma mesa, con la misma luz y el mismo silencio. Defenderla no es un capricho de lectores románticos; es defender que la ciudad siga siendo de todos.`
  ],
  tema:'Defensa de la biblioteca pública como espacio gratuito e imprescindible para la igualdad.',
  resumen:'A partir de la observación de una biblioteca de barrio llena un sábado por la mañana, se defiende que estos espacios son los únicos lugares de la ciudad donde se puede permanecer sin pagar, algo cada vez más valioso, como demuestra el aumento de visitas de los jóvenes. Se critica que, pese a ello, sean las primeras en sufrir los recortes, y se concluye que deben considerarse un servicio básico que garantiza la igualdad y que la ciudad pertenezca a todos.',
  q2:[
    {f:'Las bibliotecas públicas son el último salón de la ciudad que no te cobra por sentarte.',
     m:'Mediante una metáfora, el autor identifica la biblioteca con el salón de una casa, el espacio común donde se descansa y se convive. Al afirmar que es «el último» que «no te cobra por sentarte», denuncia que el espacio público urbano se ha mercantilizado: casi en todas partes hay que consumir para poder estar. La biblioteca aparece así como un refugio gratuito y compartido, idea que prepara la tesis final del texto.'},
    {f:'una infraestructura de la igualdad',
     m:'El autor aplica a la biblioteca un término, «infraestructura», que normalmente se reserva para carreteras, redes de agua u hospitales, es decir, para servicios básicos sin los que una sociedad no funciona. Con esta metáfora la eleva de «almacén de libros» a servicio esencial, y precisa su función con el complemento «de la igualdad»: es el lugar donde personas de distinto origen social, como el hijo del fontanero y la hija del notario, acceden a las mismas condiciones.'}
  ],
  q3:[
'El texto pertenece, según su ámbito de uso, a los textos periodísticos, en concreto al género de opinión y al subgénero del artículo de opinión, ya que es un texto firmado en el que un autor expone su punto de vista personal sobre un tema de actualidad. Se dirige a un público amplio y heterogéneo, utiliza el español estándar con algunos rasgos coloquiales («a gatas», «el wifi») y se transmite por un canal escrito. Su finalidad es persuadir al lector y crear un estado de opinión favorable a la defensa de las bibliotecas.',
'Por ello predominan la función apelativa, visible en la interrogación retórica «¿Alguien imagina que se cerrara un hospital los sábados…?», y la función expresiva, propia de la primera persona («conté», «Lo digo sin nostalgia»). Aparece también la función poética, ya que el artículo, cercano al ensayo, tiene voluntad de estilo: metáforas («el último salón de la ciudad», «infraestructura de la igualdad»), paralelismos («Nadie les pidió… Nadie les miró mal…») y antítesis («el hijo del fontanero y la hija del notario»).',
'La modalidad principal es la argumentativa. La tesis aparece al final, por lo que la estructura es inductiva: la biblioteca pública es un servicio básico que garantiza la igualdad y debe protegerse de los recortes. Para defenderla, el autor emplea un argumento de experiencia personal (la visita del sábado), un argumento de datos («las visitas a las bibliotecas no dejan de crecer»), un argumento por analogía (la comparación con el cierre de un hospital) y un argumento basado en valores (la igualdad de oportunidades). También refuta una posible objeción: «Defenderla no es un capricho de lectores románticos».',
'Entre las marcas de subjetividad destacan la primera persona del singular y del plural inclusivo («deberíamos», «hacemos»), el adverbio de duda «Quizá», que suaviza la propuesta, la perífrasis modal de obligación «deberíamos dejar de pensar», el léxico valorativo («lujo», «capricho») y la modalidad interrogativa. Como modalidad secundaria aparece la narración y la descripción en el primer párrafo, con verbos en pretérito («conté», «Había») y una enumeración de personajes que sirve de ejemplo de partida. En definitiva, se trata de un artículo de opinión argumentativo con estructura inductiva y una marcada voluntad persuasiva.'
  ],
  claves:{tesis:'Al final (estructura inductiva).', args:['Experiencia personal','Datos','Analogía (hospital)','Valores (igualdad)','Refutación'], subj:['1.ª persona','Interrogación retórica','Quizá','Perífrasis modal','Metáforas']}
},
{
  id:'agua', genero:'Editorial', grupo:'opinión',
  titulo:'El agua no puede esperar a la próxima lluvia',
  fuente:'Texto de elaboración propia con formato de editorial (sin firma, expresa la opinión del periódico).',
  p:[
`Las islas afrontan este verano la tercera temporada consecutiva de lluvias por debajo de la media, y los embalses y acuíferos llegan a junio con reservas que antes solo se veían en septiembre. Ante este panorama, la respuesta de las administraciones no puede seguir siendo la de rezar al cielo y esperar que el otoño arregle lo que no hemos sabido gestionar. La sequía ya no es una excepción: es el nuevo clima, y conviene actuar en consecuencia.`,
`Los datos son tozudos. Una parte significativa del agua que circula por las redes municipales se pierde en fugas antes de llegar a los grifos, y en algunos municipios esa pérdida supera la cuarta parte. Mientras tanto, en plena temporada alta, el consumo por habitante se dispara con piscinas, campos de golf y jardines que parecen diseñados para otra latitud. No se trata de demonizar al turismo, motor económico indiscutible, sino de exigir que pague el coste real del recurso que consume.`,
`Este periódico considera que hay tres medidas que no admiten más demora: renovar las redes de distribución, ampliar el uso de agua regenerada para el riego y establecer tarifas progresivas que premien el ahorro y penalicen el derroche. Ninguna de ellas es popular ni barata, pero todas son más baratas que traer agua en barco, como ya ocurrió en el pasado.`,
`La ciudadanía también tiene su parte. Cerrar el grifo mientras nos cepillamos los dientes parece un gesto insignificante, pero multiplicado por un millón de residentes y varios millones de visitantes deja de serlo. El agua no puede esperar a la próxima lluvia. Nosotros, tampoco.`
  ],
  tema:'Necesidad urgente de una gestión responsable del agua ante la sequía.',
  resumen:'Ante la persistente falta de lluvias y el bajo nivel de las reservas, el editorial sostiene que la sequía es ya una situación permanente que exige actuar. Señala como problemas las pérdidas en las redes y el elevado consumo de la temporada turística, y propone tres medidas urgentes: renovar las conducciones, reutilizar agua regenerada y aplicar tarifas progresivas. Concluye que también la ciudadanía debe implicarse con pequeños gestos de ahorro.',
  q2:[
    {f:'la respuesta de las administraciones no puede seguir siendo la de rezar al cielo y esperar que el otoño arregle lo que no hemos sabido gestionar',
     m:'«Rezar al cielo» no alude a una oración literal: es una expresión hiperbólica e irónica que critica la pasividad de las administraciones, que confían en que la lluvia resuelva el problema en lugar de tomar decisiones. Además, la primera persona del plural de «no hemos sabido gestionar» reparte la responsabilidad entre todos: la falta de agua no es solo un fenómeno natural, sino también la consecuencia de una mala gestión humana.'},
    {f:'El agua no puede esperar a la próxima lluvia. Nosotros, tampoco.',
     m:'El cierre personifica el agua, a la que atribuye la capacidad de «esperar», para subrayar que el problema es urgente. La segunda oración, con elipsis del verbo («Nosotros [no podemos esperar], tampoco»), incluye al periódico y a los lectores en ese «nosotros» y convierte la advertencia en un llamamiento colectivo. La brevedad de las dos frases, tras párrafos largos, da al final un tono rotundo que refuerza la tesis.'}
  ],
  q3:[
'El texto es un texto periodístico del género de opinión, concretamente un editorial: no aparece firmado porque expresa la postura del propio periódico, como se ve en la referencia explícita «Este periódico considera». Se dirige a un público amplio y heterogéneo, emplea el español estándar en un registro formal y se transmite por un canal escrito. Su finalidad es persuadir a los lectores y, sobre todo, presionar a las administraciones para que actúen.',
'Predominan la función apelativa, porque se exige a las instituciones y a la ciudadanía un cambio de conducta («conviene actuar en consecuencia»), y la referencial, ya que el texto se apoya en datos sobre las reservas y las fugas. La función expresiva aparece en el plural institucional («Este periódico considera», «Nosotros») y la poética en recursos como la personificación del agua o la ironía de «rezar al cielo».',
'La modalidad principal es la argumentativa. La tesis aparece al principio («La sequía ya no es una excepción: es el nuevo clima, y conviene actuar en consecuencia») y se retoma al final, por lo que la estructura es encuadrada. Los argumentos son de datos («esa pérdida supera la cuarta parte»), de causa-consecuencia (el consumo turístico dispara la demanda), de carácter pragmático o económico (las medidas son «más baratas que traer agua en barco») y de ejemplificación. Incluye además una concesión que matiza la crítica: «No se trata de demonizar al turismo, motor económico indiscutible, sino de exigir…».',
'Las marcas de subjetividad son propias del editorial: plural institucional, perífrasis de obligación («no puede seguir siendo»), verbos de opinión («considera»), adjetivos valorativos («tozudos», «insignificante»), la expresión de urgencia «no admiten más demora» y el contraste entre «premien el ahorro» y «penalicen el derroche». Como modalidad secundaria aparece la exposición, en la presentación objetiva de la situación de embalses y acuíferos. En conclusión, es un editorial argumentativo de estructura encuadrada que combina datos y exhortación.'
  ],
  claves:{tesis:'Al principio y al final (encuadrada).', args:['Datos','Causa-consecuencia','Pragmático/económico','Concesión'], subj:['Plural institucional','Perífrasis de obligación','Adjetivos valorativos','Personificación']}
},
{
  id:'salas', genero:'Noticia', grupo:'informativo',
  titulo:'Las salas de estudio municipales abrirán las 24 horas durante la época de exámenes',
  fuente:'Texto de elaboración propia con formato de noticia. Los datos son ficticios.',
  p:[
`El Ayuntamiento abrirá de forma ininterrumpida las tres salas de estudio municipales durante el periodo de exámenes de este curso. La medida, que se aplicará del 4 de mayo al 12 de junio, responde a una petición firmada por más de 2.000 estudiantes a través de la web municipal.`,
`Según explicó ayer la concejala de Juventud en rueda de prensa, las salas ofrecerán en total 420 puestos de lectura, conexión a internet y servicio de préstamo de ordenadores portátiles. El acceso será libre y gratuito, aunque entre las 22.00 y las 8.00 horas será necesario presentar el carné de estudiante o el DNI. «Queremos que ningún joven tenga que estudiar en una cocina compartida o en un pasillo porque no tiene otro sitio», declaró.`,
`El servicio nocturno contará con personal de seguridad y tendrá un coste aproximado de 85.000 euros, que se financiarán con el presupuesto de la concejalía. El consistorio evaluará al final del periodo el número de usuarios para decidir si amplía la iniciativa a la convocatoria extraordinaria de julio.`,
`La asociación de estudiantes que impulsó la recogida de firmas valoró positivamente el anuncio, aunque recordó que la petición inicial incluía también la apertura de las salas los domingos durante todo el curso. «Es un primer paso, pero el problema de los espacios de estudio no desaparece en junio», señaló su portavoz.`,
`Según los datos municipales, el año pasado las salas registraron más de 30.000 visitas solo durante el mes de mayo.`
  ],
  tema:'Apertura ininterrumpida de las salas de estudio municipales durante los exámenes.',
  resumen:'El Ayuntamiento mantendrá abiertas las veinticuatro horas sus tres salas de estudio entre mayo y junio, atendiendo a una petición estudiantil. El servicio, gratuito y con control de acceso por la noche, ofrecerá puestos de lectura, internet y préstamo de portátiles, y su ampliación dependerá del uso que se registre. Los estudiantes valoran la medida, pero la consideran insuficiente porque reclamaban también la apertura dominical durante todo el curso.',
  q2:[
    {f:'Es un primer paso, pero el problema de los espacios de estudio no desaparece en junio',
     m:'Con esta cita en estilo directo, la portavoz valora la medida, pero la presenta como incompleta. «Un primer paso» es una metáfora del comienzo de un camino que todavía no se ha recorrido; y la afirmación de que el problema «no desaparece en junio» subraya que la falta de lugares de estudio dura todo el curso, no solo la época de exámenes. El nexo adversativo «pero» introduce así un matiz crítico dentro de una noticia por lo demás objetiva.'},
    {f:'Queremos que ningún joven tenga que estudiar en una cocina compartida o en un pasillo porque no tiene otro sitio',
     m:'La concejala no habla de cocinas y pasillos concretos, sino que usa estos ejemplos como imágenes de la precariedad de muchos estudiantes, que viven en pisos compartidos o en casas sin un espacio tranquilo. El cuantificador negativo «ningún» da a la frase un valor general y convierte la medida en una cuestión de igualdad de oportunidades. Al tratarse de una cita, esta valoración se atribuye a la fuente y no al periodista.'}
  ],
  q3:[
'Se trata de un texto periodístico del género informativo, en concreto una noticia, ya que relata un hecho de actualidad y de interés público (la apertura de las salas de estudio) de forma objetiva. Va dirigido a un público amplio, emplea el español estándar en registro formal y se transmite por un canal escrito. Su finalidad es informar, por lo que predomina la función referencial o representativa del lenguaje.',
'Su estructura responde a la pirámide invertida: el titular resume lo esencial; la entradilla (primer párrafo) responde a las preguntas básicas —qué (apertura de las salas), quién (el Ayuntamiento), cuándo (del 4 de mayo al 12 de junio) y por qué (una petición de 2.000 estudiantes)—; y el cuerpo añade detalles de importancia decreciente, hasta un último párrafo con un dato de contexto que podría suprimirse sin perder la información principal.',
'La modalidad principal es la expositiva con elementos narrativos. Entre sus rasgos lingüísticos destacan la tercera persona y la ausencia del emisor, que busca la objetividad; los datos precisos (cifras, fechas, horarios, presupuesto); el uso del futuro de indicativo para anunciar lo que ocurrirá («abrirá», «ofrecerá», «evaluará») y del pretérito para lo ya sucedido («explicó», «declaró»); el léxico denotativo y la presencia de verbos de lengua que introducen las fuentes («explicó», «declaró», «recordó», «señaló»).',
'La subjetividad no procede del periodista, sino de las fuentes citadas: las citas en estilo directo, entre comillas, recogen valoraciones de la concejala y de la portavoz estudiantil, y el estilo indirecto («recordó que la petición inicial incluía…») resume otras opiniones. Así, la noticia incorpora distintos puntos de vista sin abandonar la objetividad. En definitiva, es una noticia de modalidad expositiva, estructura de pirámide invertida y finalidad informativa.'
  ],
  claves:{tesis:'No hay tesis: es un texto informativo.', args:['Pirámide invertida','Entradilla con las preguntas básicas','Citas directas e indirectas','Datos'], subj:['Objetividad','3.ª persona','Verbos de lengua','Subjetividad solo en las citas']}
},
{
  id:'redes', genero:'Reportaje interpretativo', grupo:'híbrido',

  fuente:'Texto de elaboración propia con formato de reportaje interpretativo. Personajes ficticios.',
  p:[
`A las siete de la mañana, cuando el puerto todavía huele a gasoil y a sal, Joan ya tiene las manos dentro de la red. Tiene setenta y un años y lleva cincuenta y cinco remendando las mallas que los pescadores rompen contra las rocas. «Antes éramos más de veinte en este muelle; ahora quedamos tres, y uno ya no ve bien», cuenta sin levantar la vista de la aguja de madera.`,
`Su caso no es una excepción. La flota artesanal de las islas se ha reducido de forma drástica en las últimas décadas, presionada por el aumento del precio del combustible, la competencia del pescado importado y una normativa que los propios pescadores consideran pensada para los grandes barcos. Con cada embarcación que se desguaza desaparecen también los oficios que vivían a su alrededor: carpinteros de ribera, remendadores, vendedores de lonja.`,
`Los expertos en patrimonio advierten de que no se trata solo de una pérdida económica. «Cuando muere un oficio, muere un vocabulario entero», explica una investigadora universitaria que lleva años grabando a los marineros de la costa. Palabras que nombran nudos, vientos o fondos marinos se olvidan porque ya no hay nadie que las necesite.`,
`Algunos ayuntamientos han empezado a organizar talleres para que los jóvenes aprendan el oficio, y la respuesta ha sorprendido: las plazas se llenan. Marta, de veintitrés años, es una de las alumnas. Estudió Bellas Artes y ahora alterna los encargos de diseño con las tardes en el muelle. «Me gusta pensar que lo que hago tiene un sentido que se puede tocar», dice mientras sujeta la red con el pie, como le ha enseñado Joan.`,
`Él la observa con media sonrisa. Quizá el mar ya no da para todos, pero, mientras alguien siga aprendiendo a cerrar una malla, el puerto seguirá teniendo memoria.`
  ],
  tema:'La desaparición de los oficios tradicionales del mar y los intentos por conservarlos.',
  resumen:'El reportaje parte del caso de un anciano remendador de redes para mostrar la decadencia de la pesca artesanal, provocada por el encarecimiento del combustible, la competencia exterior y una normativa desfavorable. Esta crisis arrastra a otros oficios y supone, además, una pérdida cultural y lingüística. Sin embargo, los talleres municipales atraen a jóvenes dispuestos a aprenderlos, lo que abre la posibilidad de que esa memoria no desaparezca.',
  q2:[
    {f:'Cuando muere un oficio, muere un vocabulario entero',
     m:'La investigadora personifica el oficio y el vocabulario, a los que atribuye la capacidad de «morir». Quiere decir que la desaparición de un trabajo tradicional no es solo económica: con él se pierden las palabras específicas que lo nombraban (nudos, vientos, fondos marinos), porque ya nadie las usa. El paralelismo de la frase («muere… muere») subraya esa relación de causa y efecto y amplía el problema al patrimonio lingüístico y cultural.'},
    {f:'mientras alguien siga aprendiendo a cerrar una malla, el puerto seguirá teniendo memoria',
     m:'El cierre personifica el puerto, que «tiene memoria» como si fuera una persona. Esa memoria es la tradición de los oficios del mar, que solo sobrevive si se transmite. «Cerrar una malla» tiene un sentido literal (remendar la red) y otro figurado: cerrar el círculo entre generaciones, como hacen Joan y Marta. Tras la concesión pesimista «Quizá el mar ya no da para todos», el final deja una nota de esperanza.'}
  ],
  q3:[
'El texto es un reportaje interpretativo, un género periodístico híbrido que combina la información con la interpretación y la valoración del periodista. Se dirige a un público amplio, utiliza el español estándar con algunos términos del ámbito marinero («mallas», «carpinteros de ribera», «lonja») y se transmite por un canal escrito. Su finalidad es informar sobre la crisis de los oficios del mar y, al mismo tiempo, sensibilizar al lector sobre su valor cultural.',
'Predomina la función referencial, ya que aporta datos y causas, pero aparecen también la expresiva, en las valoraciones del periodista («de forma drástica», «la respuesta ha sorprendido»), y la poética, en la personificación del puerto o la sinestesia inicial («huele a gasoil y a sal»).',
'La modalidad principal es la expositiva, pues explica un fenómeno, sus causas (combustible, competencia, normativa) y sus consecuencias. Sin embargo, como corresponde al reportaje, la combina con otras modalidades: la narración, con un comienzo que presenta a un personaje en acción; la descripción, sensorial y detallada; y el diálogo, a través de las citas en estilo directo de Joan, de la investigadora y de Marta, que aportan voces diversas (testimonio, experto y relevo generacional). La estructura es circular: empieza y termina con Joan, y pasa de lo particular (un caso) a lo general (la crisis del sector) para volver a lo particular.',
'Hay marcas de subjetividad moderadas, propias de la interpretación: adjetivos y adverbios valorativos («drástica», «Quizá»), léxico connotativo, personificaciones y un final con intención lírica. Esta mezcla de información contrastada, testimonios y estilo cuidado es característica del reportaje interpretativo frente a la noticia, más objetiva, y al artículo, abiertamente argumentativo.'

  claves:{tesis:'No hay una tesis explícita; sí una interpretación (hay que conservar los oficios).', args:['Estructura circular','Particular → general','Testimonios','Causas y consecuencias'], subj:['Adjetivos valorativos','Quizá','Personificación','Sinestesia']}

{
  id:'movil', genero:'Columna / artículo de opinión', grupo:'opinión',
  titulo:'Con el pulgar en guardia',
  fuente:'Texto de elaboración propia con formato de columna de opinión.',
  p:[
`Mi sobrina de quince años me explicó el domingo que no contesta los mensajes de voz porque «son muy invasivos». Lo dijo mientras deslizaba el pulgar sobre la pantalla a una velocidad que ya quisieran muchos pianistas, sin levantar la vista, con la concentración de un cirujano. Le pregunté cuántas horas pasaba al día con el móvil. Me respondió con otra pregunta: «¿Contando el instituto?».`,
`No voy a hacer aquí el sermón del adulto escandalizado, que es un género literario en sí mismo y bastante aburrido. Los mayores también vivimos con el pulgar en guardia: consultamos el teléfono en los semáforos, en las cenas y, aunque nadie lo confiese, en los entierros. La diferencia es que nosotros recordamos cómo era el aburrimiento, ese territorio fértil donde se inventaban juegos, se escribían diarios y se miraba por la ventana sin ninguna finalidad.`,
`Los psicólogos llevan años advirtiendo de que la atención es un músculo que se atrofia si no se ejercita. Las propias empresas tecnológicas diseñan sus aplicaciones para que sea imposible soltarlas: cada notificación es un pequeño anzuelo, cada vídeo que empieza solo es una red. ¿De verdad creemos que un adolescente puede ganar esa partida con la única arma de su fuerza de voluntad?`,
`Por eso me parece injusto culpar a los chavales. Lo que necesitan no son reproches, sino espacios y tiempos sin pantalla que los adultos seamos capaces de respetar primero. Quizá la revolución pendiente sea la más sencilla: dejar el móvil boca abajo durante la comida y volver a aburrirnos juntos.`
  ],
  tema:'La dependencia del móvil y la necesidad de recuperar espacios sin pantallas.',
  resumen:'A partir de una anécdota familiar, el texto reconoce que la dependencia del teléfono afecta tanto a los jóvenes como a los adultos, aunque estos aún recuerdan el valor creativo del aburrimiento. Añade que las aplicaciones están diseñadas para captar la atención, de modo que no puede exigirse a los adolescentes que se resistan solo con su voluntad. Concluye que, en lugar de culparlos, los adultos deben dar ejemplo y crear momentos compartidos sin pantallas.',
  q2:[
    {f:'cada notificación es un pequeño anzuelo, cada vídeo que empieza solo es una red',
     m:'El autor recurre a dos metáforas del campo de la pesca: las notificaciones son «anzuelos» y la reproducción automática de vídeos, una «red». Igual que el pez queda atrapado sin darse cuenta, el usuario es capturado por la aplicación. Con estas imágenes y con la estructura paralelística («cada… cada…»), denuncia que la dependencia del móvil no es solo un problema de voluntad individual, sino el resultado de un diseño intencionado de las empresas.'},
    {f:'el aburrimiento, ese territorio fértil donde se inventaban juegos',
     m:'El aburrimiento suele valorarse de forma negativa, pero el autor lo presenta mediante una metáfora como un «territorio fértil», es decir, un terreno donde algo puede crecer. Lo que crece en él es la creatividad: juegos, diarios, la mirada sin finalidad. La metáfora invierte el valor habitual de la palabra y apoya la tesis del texto: perder la capacidad de aburrirse por el uso constante del móvil supone perder también un espacio de imaginación.'}
  ],
  q3:[
'El texto es un artículo de opinión breve con rasgos de columna: el autor firma y expresa su visión personal con un estilo cercano e irónico. Pertenece al ámbito periodístico, se dirige a un público amplio y heterogéneo, emplea el español estándar con rasgos coloquiales («chavales», «boca abajo») y se transmite por un canal escrito. Su finalidad es persuadir y hacer reflexionar al lector.',
'Destacan la función expresiva, por la primera persona y las valoraciones («me parece injusto»); la apelativa, por la interrogación retórica que interpela al lector («¿De verdad creemos…?»); y la poética, por las metáforas («pulgar en guardia», «territorio fértil», «anzuelo», «red»), las comparaciones («con la concentración de un cirujano») y la ironía («que ya quisieran muchos pianistas», «en los entierros»).',
'La modalidad principal es la argumentativa, con una estructura inductiva: la tesis aparece al final («Lo que necesitan no son reproches, sino espacios y tiempos sin pantalla que los adultos seamos capaces de respetar primero»). Los argumentos son de experiencia personal (la anécdota de la sobrina), de autoridad («Los psicólogos llevan años advirtiendo…»), de analogía («la atención es un músculo»), de causa-consecuencia (el diseño de las aplicaciones provoca la dependencia) y de valores (la justicia hacia los jóvenes). Además, anticipa y rechaza el discurso contrario: «No voy a hacer aquí el sermón del adulto escandalizado».',
'Son abundantes las marcas de subjetividad: primera persona del singular y plural inclusivo («vivimos», «creemos», «seamos»), adjetivos valorativos («injusto», «aburrido», «fértil»), el adverbio de duda «Quizá», la ironía y la modalidad interrogativa. Como modalidad secundaria aparecen la narración y el diálogo en el primer párrafo, con verbos en pretérito («me explicó», «Le pregunté») y citas en estilo directo. Se trata, por tanto, de un texto argumentativo inductivo de tono irónico y persuasivo.'
  ],
  claves:{tesis:'Al final (inductiva).', args:['Experiencia personal','Autoridad','Analogía','Causa-consecuencia','Refutación'], subj:['Ironía','Interrogación retórica','Metáforas','1.ª persona','Coloquialismos']}

{
  id:'error', genero:'Artículo de opinión', grupo:'opinión',
  titulo:'Elogio del error',
  fuente:'Texto de elaboración propia con formato de artículo de opinión.',
  p:[
`Equivocarse es la forma más eficaz de aprender, y una escuela que castiga el error está, en realidad, castigando el aprendizaje. Lo sabe cualquiera que haya intentado montar en bicicleta: nadie aprende a mantener el equilibrio sin antes haberse caído unas cuantas veces.`,
`Sin embargo, nuestro sistema educativo parece empeñado en lo contrario. El alumno que levanta la mano y falla siente las miradas de la clase como pequeñas piedras; el que no la levanta nunca, en cambio, pasa inadvertido. Así aprendemos muy pronto la lección equivocada: es mejor callar que arriesgarse. Los especialistas en neurociencia explican que el cerebro consolida mejor un conocimiento cuando antes ha cometido un error y lo ha corregido, porque la sorpresa activa la memoria.`,
`La historia de la ciencia está llena de equivocaciones fecundas. Alexander Fleming descubrió la penicilina porque dejó sin limpiar unas placas de cultivo antes de irse de vacaciones. Si hubiera sido un investigador obsesionado con no fallar, quizá nunca habría mirado dos veces aquel moho que había arruinado su experimento.`,
`Alguien dirá que no es lo mismo equivocarse en un laboratorio que en un quirófano, y tiene razón: hay errores que no nos podemos permitir. Precisamente por eso debemos equivocarnos mucho, y pronto, en el lugar adecuado. El aula debería ser ese lugar: un espacio donde fallar no cueste caro y donde la respuesta incorrecta sea el principio de la conversación, no el final.`
  ],
  tema:'El valor del error en el proceso de aprendizaje.',
  resumen:'El texto defiende que equivocarse es imprescindible para aprender y critica que la escuela penalice el error, porque enseña a los alumnos a no arriesgarse. Apoya esta idea en la neurociencia, según la cual corregir un fallo refuerza la memoria, y en la historia de la ciencia, con el descubrimiento casual de la penicilina. Aunque admite que en algunos ámbitos no se puede fallar, concluye que el aula debe ser el lugar seguro donde equivocarse.',
  q2:[
    {f:'siente las miradas de la clase como pequeñas piedras',
     m:'Mediante un símil, el autor compara las miradas de los compañeros con «pequeñas piedras» que golpean al alumno que se equivoca. La imagen transmite el dolor y la vergüenza que provoca el error en público, como si fuera un castigo físico; el adjetivo «pequeñas» indica que cada mirada hiere poco, pero todas juntas pesan. Así se explica por qué muchos estudiantes prefieren no participar, que es precisamente la crítica central del artículo.'},
    {f:'la respuesta incorrecta sea el principio de la conversación, no el final',
     m:'La frase se construye sobre la antítesis entre «principio» y «final». Normalmente, una respuesta incorrecta cierra el diálogo en clase: se señala el fallo y se pasa a otro alumno. El autor propone lo contrario: que el error abra una conversación en la que se analiza por qué se ha producido y cómo corregirlo. Resume así su tesis: el error no es un fracaso, sino una oportunidad de aprendizaje.'}
  ],
  q3:[
'Es un texto periodístico perteneciente al género de opinión, en concreto un artículo de opinión, puesto que un autor expone y defiende su postura personal sobre un tema de interés general, la educación. Se dirige a un público amplio, utiliza el español estándar en un registro culto pero accesible y se transmite por un canal escrito. Su finalidad es persuadir al lector.',
'Predominan la función apelativa, porque busca la adhesión del lector, y la expresiva, por las valoraciones personales; también aparece la función poética, propia del carácter ensayístico del artículo, en el símil («como pequeñas piedras»), la antítesis («el principio de la conversación, no el final») o el oxímoron implícito de «equivocaciones fecundas».',
'La modalidad principal es la argumentativa. La tesis se formula en la primera oración («Equivocarse es la forma más eficaz de aprender…») y se retoma al final («El aula debería ser ese lugar…»), por lo que la estructura es encuadrada. Los argumentos son variados: de analogía (aprender a montar en bicicleta), de autoridad científica (los especialistas en neurociencia), de ejemplificación histórica (Fleming y la penicilina) y de causa-consecuencia (castigar el error enseña a callar). Además, el autor introduce un contraargumento («Alguien dirá que no es lo mismo equivocarse en un laboratorio que en un quirófano»), lo concede («y tiene razón») y lo refuta, convirtiéndolo en un nuevo apoyo para su tesis.',
'Entre las marcas de subjetividad destacan la primera persona del plural inclusivo («aprendemos», «debemos»), las perífrasis modales de obligación («debemos equivocarnos», «debería ser»), los adjetivos valorativos («eficaz», «fecundas», «equivocada») y la oración condicional irreal («Si hubiera sido un investigador obsesionado…»). La modalidad secundaria es la narrativa, en la breve anécdota de Fleming. En definitiva, es un artículo argumentativo de estructura encuadrada y finalidad persuasiva.'
  ],
  claves:{tesis:'Al principio y al final (encuadrada).', args:['Analogía','Autoridad','Ejemplo histórico','Contraargumento + refutación'], subj:['1.ª persona plural','Perífrasis modales','Adjetivos valorativos','Símil y antítesis']}
}

const TEORIA_COM = [
{t:'Los géneros periodísticos (clasificación de Martínez Albertos)', h:`
<p>La PAU 2027 propone un <b>texto periodístico de cualquier género</b>. Clasificación que sigue la UIB:</p>
<div class="scroll-x"><table class="tabla">
<tr><th>Grupo</th><th>Género</th><th>Rasgos que tienes que reconocer</th></tr>
<tr><td>Informativo</td><td><b>Noticia</b></td><td>Hecho de actualidad contado con objetividad. Pirámide invertida (titular, entradilla, cuerpo). Responde a qué, quién, cuándo, dónde, cómo y por qué. 3.ª persona, léxico denotativo, datos, citas en estilo directo e indirecto, verbos de lengua (<i>declaró, señaló</i>). Función referencial.</td></tr>
<tr><td>Híbrido</td><td><b>Reportaje interpretativo</b></td><td>Información amplia + interpretación del periodista. Entrada atractiva (anécdota, escena), testimonios y expertos, causas y consecuencias. Combina exposición, narración, descripción y diálogo. Subjetividad moderada y estilo cuidado.</td></tr>
<tr><td>Opinión</td><td><b>Artículo de opinión</b> (y columna)</td><td>Firmado. El autor defiende su punto de vista. Cercano al ensayo: voluntad de estilo, recursos literarios, ironía. Modalidad argumentativa con muchas marcas de subjetividad.</td></tr>
<tr><td>Opinión</td><td><b>Editorial</b></td><td>Sin firma: es la opinión del periódico. Plural institucional (<i>este diario</i>, <i>nosotros</i>). Temas de gran trascendencia. Tono serio y exhortativo, a menudo dirigido a las instituciones.</td></tr>
</table></div>`},
{t:'La modalidad argumentativa: tesis, estructura y tipos de argumentos', h:`
<h4>La tesis</h4>
<p>Es la idea principal que defiende el autor. Puede ser <b>explícita</b> (se formula en una oración del texto) o <b>implícita</b> (se deduce). En el comentario hay que <b>citarla o parafrasearla</b> y decir dónde aparece.</p>
<h4>Estructura (según dónde está la tesis)</h4>
<ul>
<li><b>Deductiva o analizante</b>: tesis al principio → argumentos.</li>
<li><b>Inductiva o sintetizante</b>: argumentos → tesis al final (muy frecuente en el artículo de opinión).</li>
<li><b>Encuadrada</b>: tesis al principio y se retoma al final.</li>
<li><b>Paralela o repetitiva</b>: varios argumentos independientes sin una tesis única destacada.</li>
</ul>
<h4>Tipos de argumentos</h4>
<div class="scroll-x"><table class="tabla">
<tr><th>Tipo</th><th>En qué consiste</th></tr>
<tr><td>De autoridad</td><td>Se cita a un experto, institución u obra prestigiosa (<i>según la OMS…</i>).</td></tr>
<tr><td>Datos / estadísticos</td><td>Cifras y porcentajes que parecen objetivos.</td></tr>
<tr><td>Ejemplificación</td><td>Casos concretos que ilustran la tesis.</td></tr>
<tr><td>Experiencia personal</td><td>Anécdotas vividas por el autor (muy típico en el artículo).</td></tr>
<tr><td>Causa-consecuencia</td><td>Relaciones lógicas: <i>si X, entonces Y</i>.</td></tr>
<tr><td>Analogía o comparación</td><td>Se compara con un caso parecido para trasladar la conclusión.</td></tr>
<tr><td>Sentido común / generalización</td><td>Creencias compartidas, refranes, lo que «todo el mundo sabe».</td></tr>
<tr><td>Valores éticos</td><td>Apela a lo justo, lo bueno, la igualdad, la libertad…</td></tr>
<tr><td>Hecho / evidencia</td><td>Hechos conocidos y comprobables.</td></tr>
<tr><td>Contraargumento y refutación</td><td>El autor recoge la idea contraria (<i>alguien dirá que…</i>), a veces la concede y después la rebate.</td></tr>
</table></div>
<p class="nota">Truco: no basta con nombrar el tipo. <b>Cita el fragmento</b> y explica en una línea por qué es ese tipo de argumento.</p>`},
{t:'Marcas de subjetividad (modalización)', h:`
<p>Son las huellas del emisor en el texto. Tu profesora insiste: <b>si aparecen apelaciones al lector y vocativos, hay que comentarlos obligatoriamente</b>.</p>
<h4>1. Modalidad oracional</h4>
<ul>
<li><b>Enunciativa</b> (afirma o niega) · <b>Interrogativa</b> (retórica: no espera respuesta) · <b>Exclamativa</b> (emoción) · <b>Exhortativa</b> (orden, ruego, consejo) · <b>Desiderativa</b> (deseo: <i>ojalá…</i>) · <b>Dubitativa</b> (duda: <i>quizá, tal vez</i>).</li>
</ul>
<h4>2. Deixis personal</h4>
<ul><li>1.ª persona del singular (yo) · plural inclusivo (<i>nosotros</i> = autor + lectores, busca complicidad) · 2.ª persona y vocativos (apelación al lector) · plural de modestia o institucional (editorial).</li></ul>
<h4>3. Verbos</h4>
<ul>
<li><b>Verbos volitivos</b> (de voluntad o deseo): <i>querer, desear, pretender, exigir</i>.</li>
<li>Verbos de opinión y pensamiento: <i>creer, pensar, considerar, opinar</i>.</li>
<li>Verbos de sentimiento: <i>temer, lamentar, alegrarse</i>.</li>
<li><b>Modo subjuntivo</b> (deseo, duda, posibilidad) y condicional.</li>
<li><b>Perífrasis modales</b>: obligación (<i>tener que, deber, hay que</i>), posibilidad o probabilidad (<i>poder, deber de</i>).</li>
</ul>
<h4>4. Clases de palabras</h4>
<ul>
<li><b>Adjetivos valorativos</b> o de atribución subjetiva (<i>estupendo, injusto</i>), sobre todo <b>antepuestos</b> y explicativos; epítetos.</li>
<li>Sustantivos valorativos o despectivos (<i>chapuza, despropósito</i>).</li>
<li>Sufijos apreciativos: diminutivos, aumentativos y despectivos (<i>cochecito, cochazo, gentuza</i>).</li>
<li>Adverbios modalizadores: <i>afortunadamente, desgraciadamente, sin duda, evidentemente, quizá</i>.</li>
<li>Léxico connotativo, coloquialismos, cultismos, extranjerismos.</li>
</ul>
<h4>5. Recursos y signos</h4>
<ul><li>Figuras retóricas: metáfora, ironía, hipérbole, interrogación retórica, enumeración, antítesis…</li>
<li>Comillas irónicas o de distanciamiento, puntos suspensivos, paréntesis y rayas con comentarios del autor.</li>
<li>Expresiones evidenciales o de opinión: <i>a mi juicio, es evidente que, lo cierto es que</i>.</li></ul>`},
{t:'Otras modalidades textuales (modalidad secundaria)', h:`
<div class="scroll-x"><table class="tabla">
<tr><th>Modalidad</th><th>Rasgos lingüísticos</th></tr>
<tr><td><b>Narración</b></td><td>Acciones en el tiempo. Verbos de acción en pretérito perfecto simple e imperfecto, marcadores temporales, personajes.</td></tr>
<tr><td><b>Descripción</b></td><td>Cómo es algo o alguien. Adjetivos, sustantivos, verbos copulativos y de estado, imperfecto, enumeraciones, comparaciones.</td></tr>
<tr><td><b>Exposición</b></td><td>Explicar con claridad y objetividad. Presente atemporal, 3.ª persona, léxico denotativo y técnico, conectores explicativos, datos.</td></tr>
<tr><td><b>Diálogo</b></td><td>Citas en estilo directo e indirecto, verbos de lengua, turnos de palabra.</td></tr>
</table></div>
<p class="nota">Para la modalidad secundaria basta con <b>justificarla con su definición y un ejemplo</b> del texto.</p>`},
{t:'Funciones del lenguaje (Jakobson)', h:`
<ul>
<li><b>Referencial o representativa</b> (contexto): informar con objetividad. Predomina en la noticia.</li>
<li><b>Expresiva o emotiva</b> (emisor): sentimientos y opiniones. 1.ª persona, exclamaciones, valoraciones.</li>
<li><b>Apelativa o conativa</b> (receptor): influir en el lector. 2.ª persona, imperativos, vocativos, interrogaciones.</li>
<li><b>Poética</b> (mensaje): cuidar la forma. Figuras retóricas. Típica del artículo, cercano al ensayo.</li>
<li><b>Fática</b> (canal): mantener el contacto (<i>¿me sigues?</i>).</li>
<li><b>Metalingüística</b> (código): hablar de la propia lengua.</li>
</ul>
<p class="nota">No basta con nombrarlas: justifica cada función con su definición y con la modalidad oracional o el ejemplo que la demuestra.</p>`},
{t:'Cómo responder cada pregunta del Bloque I', h:`
<h4>1. Tema y resumen (1,5 p)</h4>
<ul>
<li><b>Tema</b>: una frase <b>nominal</b> breve y abstracta, sin verbo conjugado (<i>Defensa de…</i>, <i>Crítica a…</i>, <i>Rechazo de…</i>). Debe recoger la postura del autor, no solo el asunto.</li>
<li><b>Resumen</b>: las ideas principales con <b>tus palabras</b>, en un solo párrafo, en 3.ª persona, sin opiniones propias, sin citas literales y con conectores. Alrededor de un 20-25 % del original. Si el texto tiene tesis, <b>tiene que aparecer en el resumen</b> (fallo marcado en tus correcciones: «Falta la tesis»).</li>
</ul>
<h4>2. Interpretación del lenguaje en su contexto (1 p)</h4>
<ul>
<li><b>Entre 50 y 80 palabras</b>.</li>
<li>Explica el significado <b>no literal</b> de la expresión y relaciónalo con el significado literal.</li>
<li><b>Nombra la figura retórica</b> (metáfora, personificación, ironía, hipérbole…).</li>
<li>Conecta el sentido de la expresión con la tesis o la intención del texto.</li>
</ul>
<h4>3. Caracterización lingüística: tipología y modalidad (1,5 p)</h4>
<ol>
<li><b>Clasificación</b>: ámbito periodístico, género y subgénero, justificado (dónde se publica, si va firmado…).</li>
<li><b>Elementos de la comunicación</b>: emisor (autor/periódico), receptor (público amplio y heterogéneo), código (español estándar), canal (escrito).</li>
<li><b>Finalidad</b>: informar / persuadir y crear opinión.</li>
<li><b>Funciones del lenguaje</b>, justificadas.</li>
<li><b>Modalidad principal</b> (normalmente argumentativa): tesis, estructura, tipos de argumentos con ejemplos y marcas de subjetividad.</li>
<li><b>Modalidad secundaria</b>: definición + ejemplo.</li>
<li><b>Conclusión</b> breve.</li>
</ol>
<p class="nota warn">Todo redactado en párrafos, aunque en la corrección del parcial aparezca en esquema.</p>`}
];
