{
  id:'gonzalez', t:'«Me basta así»', a:'Ángel González', g:'Poesía', y:1961, fecha:'Sin esperanza, con convencimiento (1961); recogido en Palabra sobre palabra',
  mov:'Generación del 50 · poesía de la experiencia', libre:false, c:'#2563EB',
  contexto:`<p>A finales de los años cincuenta surge la <b>generación del 50</b> o de los «niños de la guerra»: Ángel González, Jaime Gil de Biedma, José Ángel Valente, Claudio Rodríguez y José Agustín Goytisolo. Este grupo supera la poesía social y entiende la poesía como <b>conocimiento</b> de la propia experiencia. Combina lo personal con lo cívico y recurre a la <b>ironía</b>, al humor y a un lenguaje coloquial muy trabajado.</p>
<p>Ángel González (Oviedo, 1925 - Madrid, 2008) vivió la guerra de niño y perdió en ella a un hermano. «Me basta así» pertenece a <i>Sin esperanza, con convencimiento</i> (1961), su segundo libro, después de <i>Áspero mundo</i> (1956). Más tarde reunió toda su obra con el título <i>Palabra sobre palabra</i>. Su poesía alterna la crítica social irónica y la poesía amorosa, con un tono cercano, escéptico y tierno.</p>`,
  argumento:'Poema amoroso construido como una larga hipótesis: «Si yo fuese Dios». El poeta imagina que podría crear un ser exacto a la amada y «repetirla» siempre, pero concluye que, aun siendo Dios, preferiría «ser Ángel González» para quererla tal como es. Así podría ver cómo ella se crea a sí misma cada día y lo resucita con su palabra. El cierre entre paréntesis («Creo en ti. / Eres. / Me basta.») resume la plenitud del amor.',
  temas:[
    ['El amor como plenitud','La amada basta tal como es; el título expresa la satisfacción del enamorado.'],
    ['Lo humano frente a lo divino','Ni siquiera el poder de Dios supera la experiencia humana de amar: el poeta elegiría ser él mismo.'],
    ['La amada como creadora','Ella «se crea a sí misma cada día» y devuelve la vida al poeta, que es un «Lázaro alegre».'],
    ['Identidad y cambio','La amada es «siempre la misma y siempre diferente», y el amor se renueva sin cansancio.'],
    ['La fe amorosa','El lenguaje religioso se aplica al amor: «Creo en ti».']
  ],
  rasgos:[
    ['Estructura condicional','La hipótesis «Si yo fuese Dios» ordena el poema, que termina en una conclusión inesperada.'],
    ['Ironía y humor','Hay comparaciones cotidianas que desacralizan lo solemne: Dios prueba a la amada «a la manera de los panaderos».'],
    ['Lenguaje coloquial elaborado','Usa muletillas y aclaraciones del habla: «es decir», «o sea», «ya no sé si me explico».'],
    ['Paréntesis e incisos','Reproducen el pensamiento en voz alta. El cierre entre paréntesis funciona como un susurro final.'],
    ['Autorreferencia','El poeta se nombra a sí mismo: «ser Ángel González».'],
    ['Alusión bíblica','La figura de Lázaro resucitado se aplica en clave amorosa y alegre.'],
    ['Verso libre','Versos de medida variable, con muchos encabalgamientos y versos muy breves que destacan palabras clave («Eres.»).']
  ],
  flash:[
    ['¿A qué generación pertenece Ángel González?','A la generación del 50, la de los niños de la guerra.'],
    ['¿En qué libro aparece «Me basta así»?','En Sin esperanza, con convencimiento (1961). Su obra completa se titula Palabra sobre palabra.'],
    ['¿Cómo empieza «Me basta así»?','Con una hipótesis: «Si yo fuese Dios».'],
    ['¿Qué haría el poeta si fuese Dios?','Haría lo posible por ser Ángel González, para quererla tal como la quiere.'],
    ['¿Con qué comparación irónica se desacraliza a Dios?','Prueba a la amada «a la manera de los panaderos / cuando prueban el pan».'],
    ['¿Cómo termina el poema?','Entre paréntesis: «Creo en ti. / Eres. / Me basta.»'],
    ['Rasgo clave de la poesía del 50','La poesía como conocimiento de la experiencia, con ironía y lenguaje coloquial.']
  ],
  frags:[],
  modelo:{ref:'«Me basta así», poema completo',
    a:'El poema «Me basta así» es de Ángel González (1925-2008) y pertenece a <i>Sin esperanza, con convencimiento</i> (1961), recogido después en <i>Palabra sobre palabra</i>. El autor forma parte de la generación del 50, la de los «niños de la guerra», junto a Gil de Biedma, Valente o Claudio Rodríguez. Este grupo deja atrás la poesía social de los primeros cincuenta, representada por Celaya y Blas de Otero, y concibe la poesía como conocimiento de la experiencia personal. Su poesía es intimista sin renunciar a la mirada cívica, usa con frecuencia la ironía y emplea un lenguaje coloquial muy elaborado. Dentro de la obra de González, este poema representa su vertiente amorosa, más tierna, frente a la crítica social irónica de otros libros.',
    b:'El tema central es el amor como plenitud: la amada basta tal como es, como resume el título y el cierre «Me basta». Para expresarlo, el poeta plantea una hipótesis («Si yo fuese Dios») que enfrenta lo divino y lo humano. Podría crear un ser exacto a ella y repetirla eternamente, pero prefiere «ser Ángel González / para quererte tal como te quiero», es decir, la experiencia humana del amor vale más que el poder de Dios. A ello se suman otros temas. La amada aparece como creadora, pues «se crea a sí misma cada día» y resucita al poeta como a un «Lázaro alegre». También está la tensión entre identidad y cambio («siempre la misma y siempre diferente»). Por último, el lenguaje religioso se convierte en fe amorosa: «Creo en ti».',
    c:'El poema reúne los rasgos de la poesía de la experiencia:<ul><li><b>Estructura.</b> Es una larga oración condicional («Si yo fuese Dios… haría») con un desenlace sorprendente.</li><li><b>Ironía y humor.</b> La comparación de Dios con «los panaderos / cuando prueban el pan» desacraliza lo solemne.</li><li><b>Lenguaje coloquial elaborado.</b> Recurre a marcadores del habla («es decir», «o sea», «ya no sé si me explico») y a paréntesis e incisos que imitan el pensamiento en voz alta.</li><li><b>Autorreferencia.</b> El poeta se nombra a sí mismo («ser Ángel González»).</li><li><b>Alusión bíblica.</b> Se presenta como un «Lázaro alegre».</li><li><b>Verso libre.</b> Los versos son de medida variable, con abundantes encabalgamientos y versos mínimos que aíslan palabras clave («Eres.»).</li></ul>Todo ello responde a la poesía del 50: un tono cercano y reflexivo que convierte una experiencia íntima en conocimiento.'},
  pasajes:['El poema completo, de unos 60 versos (por derechos de autor no se reproduce aquí): pégalo desde tu antología y tendrás respuesta modelo.']
},

{
  id:'chocolate', t:'Como agua para chocolate', a:'Laura Esquivel', g:'Novela', y:1989, fecha:'1989',
  mov:'Narrativa hispanoamericana · realismo mágico', libre:false, c:'#D97706',
  contexto:`<p>Laura Esquivel (Ciudad de México, 1950), educadora especializada en teatro infantil, publicó en 1989 <i>Como agua para chocolate</i>, un éxito internacional llevado al cine en 1992 por Alfonso Arau. La novela se inscribe en la <b>narrativa hispanoamericana</b> y en el <b>realismo mágico</b>, que funde lo real y lo fantástico como si lo extraordinario fuera natural.</p>
<p>Ambientada en el México de principios del siglo XX, durante la <b>Revolución mexicana</b>, refleja un mundo de inestabilidad política, desigualdad social y mezcla de tradiciones indígenas y europeas. El realismo mágico buscó mostrar una realidad «más profunda» y reivindicar lo popular y lo mágico como parte de la identidad latinoamericana.</p>`,
  argumento:'Tita, la menor de las hermanas De la Garza, está condenada por la tradición familiar a no casarse para cuidar de su madre, Mamá Elena. Pedro, que la ama, se casa con su hermana Rosaura para estar cerca de ella. Tita expresa sus emociones a través de la cocina: sus platos provocan efectos mágicos en quienes los comen (llanto colectivo en la boda, el fuego erótico de Gertrudis). Tras muertes, huidas y el amor del doctor John Brown, Tita y Pedro se reencuentran al final; Pedro muere y Tita se une a él en un incendio que arrasa el rancho. Solo se salva el recetario, que hereda la narradora.',
  temas:[
    ['El amor prohibido','Entre Tita y Pedro, frustrado por la tradición.'],
    ['La opresión de la mujer','El autoritarismo de Mamá Elena y la tradición familiar.'],
    ['La comida como lenguaje emocional','Los platos transmiten los sentimientos de Tita.'],
    ['Tradición frente a libertad','El peso de las costumbres y el deseo individual.'],
    ['La Revolución como telón de fondo','La lucha de Tita es paralela a la del país.']
  ],
  rasgos:[
    ['Realismo mágico','Lo sobrenatural se cuenta con naturalidad (lágrimas en el pastel, la ropa incendiada…).'],
    ['Estructura','Doce capítulos, uno por mes, que empiezan con una receta: «novela de entregas mensuales».'],
    ['Narradora','La sobrina nieta de Tita (hija de Esperanza) cuenta la historia a partir del recetario.'],
    ['Lenguaje sensorial','Olores, sabores, texturas y colores; tono poético.'],
    ['Figuras','Hipérbole, metáfora (el título), personificación, símbolos (fuego, rosas, cerillos).']
  ],
  flash:[
    ['¿Qué significa «estar como agua para chocolate»?','Estar a punto de hervir: furioso o lleno de pasión.'],
    ['¿Cómo se estructura la novela?','Doce capítulos, uno por mes, cada uno con una receta.'],
    ['¿Por qué no puede casarse Tita?','Por la tradición: la hija menor debe cuidar de su madre hasta que muera.'],
    ['¿Qué ocurre en la boda de Pedro y Rosaura?','Las lágrimas de Tita en el pastel provocan llanto y náuseas en los invitados.'],
    ['¿Quién narra la historia?','La sobrina nieta de Tita, a partir de su libro de recetas.'],
    ['¿A qué corriente pertenece?','Al realismo mágico de la narrativa hispanoamericana.']
  ],
  frags:[],
  pasajes:['Capítulo I (enero): nacimiento de Tita en la cocina.','Capítulo II: el pastel de boda.','Capítulo III: codornices en pétalos de rosa.','Capítulo XII: el final y el incendio.']
},

{
  id:'carmela', t:'¡Ay, Carmela!', a:'José Sanchis Sinisterra', g:'Teatro', y:1987, fecha:'1986 (estrenada en 1987)',

  contexto:`<p>Tras la muerte de Franco, el teatro español vive una etapa de libertad creadora: desaparece la censura, se recuperan autores del exilio y conviven el teatro comercial, los grupos independientes y una nueva dramaturgia de autor. Muchos dramaturgos vuelven sobre la <b>memoria</b> de la Guerra Civil y la posguerra.</p>

  /* Bloque 3 */
  h += `<section class="ex-parte"><h2 class="sub">Bloque 3. Educación literaria <span class="tag">3 puntos</span></h2>
    <p class="soft" style="margin-top:6px">6) Elija uno de los dos textos y responda las preguntas que se plantean a continuación:</p>
    <div class="grid g2" style="margin-top:12px;align-items:start">${EX.lit.map((sel, i) => {
      const L = litDe(sel);
      return `<div><label class="elige" style="margin-bottom:10px"><input type="radio" name="exlit" data-act="ex-lit" data-i="${i}" ${EX.eleL === i ? 'checked' : ''} ${corr ? 'disabled' : ''}> Texto ${'AB'[i]}${corr ? ` — <span class="soft">${esc(L.o.t)}, ${esc(L.o.a)}</span>` : ''}</label>${htmlTexto(L.texto, L.tipo, L.titulo, '')}</div>`;
    }).join('')}</div>`;
  if (EX.eleL != null) {
    const L = litDe(EX.lit[EX.eleL]);
    [['a', 'Identifique al autor y la obra de la que forma parte. A continuación, contextualícela en el marco de la historia de la literatura.', 'la'],
     ['b', 'Determine y comente los temas que aparecen en este texto.', 'lb'],
     ['c', 'Reconozca y explique qué características formales nos permiten atribuirlo a la época a la que pertenece.', 'lc']].forEach(([l, q, r]) => {
      h += `<div class="preg" ${l === 'a' ? 'style="margin-top:14px"' : ''}><div class="preg-cab"><h3>${l}) ${q}</h3><span class="punt">1 p</span></div>${ta('l' + l, '', '', 170)}
        ${corr ? htmlModeloLit(L.o, L.f, l) : ''}${rub(r, RUB[r], l !== 'a' ? 'Sin citas del texto, la UIB penaliza.' : '')}</div>`;
    });
  } else if (!corr) h += '<p class="nota" style="margin-top:12px">Elige el texto A o el B para que aparezcan las preguntas.</p>';
  else h += '<p class="nota bad" style="margin-top:12px">No elegiste ningún texto: 0 puntos en este bloque.</p>';
  h += `</section>`;

  h += `<div class="card entre no-print" style="margin-top:26px">` + (EX.estado === 'curso'
    ? `<span class="soft small">Cuando termines (o se acabe el tiempo), entrega para corregir con los criterios y las respuestas modelo.</span><button class="btn pri grande" data-act="ex-entregar">Entregar examen</button>`
    : EX.estado === 'corregir'
    ? `<span class="soft small">Marca los criterios que cumples en cada respuesta abierta. La nota se actualiza sola.</span><button class="btn pri grande" data-act="ex-guardar">Guardar nota y terminar</button>`
    : `<span class="soft small">Examen guardado en tu historial.</span><div class="fila"><button class="btn" data-act="ex-cerrar">Volver</button><button class="btn pri" data-act="examen-nuevo">Nuevo examen aleatorio</button></div>`) + `</div></div>`;
  app.innerHTML = h;
  if (EX.estado === 'curso') arrancarReloj();
  setTimeout(() => autoPalabrasQ2(app), 0);
}
function htmlResumenNota(n) {
  const fila = (lab, v, max) => `<div class="r"><div><div class="entre small"><span>${lab}</span><b class="mono">${fmt(v)} / ${fmt(max)}</b></div><div class="barra" style="margin-top:4px"><i style="width:${v / max * 100}%"></i></div></div></div>`;
  return `<div class="card" style="margin-top:6px"><div class="grid g2" style="align-items:center">
    <div><p class="small soft">Nota ${EX.estado === 'hecho' ? 'final' : 'provisional'}</p><p class="nota-final" id="nota-total">${fmt(n.total)}</p>
      <p class="small muted">Tiempo empleado: ${mmss(EX.usado || 0)} de 90:00</p></div>
    <div class="desglose" id="desglose">${fila('Bloque I · Comunicación', n.b1, 4)}${fila('Bloque II · Oración compuesta', n.an, 1.5)}${fila('Bloque II · Preguntas breves', n.br, 1.5)}${fila('Bloque III · Literatura', n.b3, 3)}</div>
  </div></div>`;
}
function vSimIntro() {
  const hist = P.examenes.slice().reverse();
  app.innerHTML = `<div>
  <header class="cab"><span class="eyebrow">Simulador PAU 2027</span><h1 class="tit">Un examen completo, como el de junio</h1>
    <p class="lead">El botón monta una prueba al azar con la ponderación exacta 4-3-3: un texto periodístico con sus tres preguntas, una oración compuesta y cuatro preguntas breves (eliges dos), y dos textos literarios del listado (eliges uno). Tienes 90 minutos.</p></header>
  <div class="grid g2" style="align-items:start">
    <div class="card pila"><h3>Antes de empezar</h3>
      <ul class="small soft"><li>El reloj sigue corriendo aunque cambies de sección o cierres la pestaña (puedes pausarlo).</li>
      <li>Al llegar a 0 el examen se entrega solo.</li><li>Las respuestas se guardan mientras escribes.</li>
      <li>Al entregar verás las respuestas modelo y los criterios: autoevalúate con honestidad.</li>
      <li>Los fragmentos que pegues en las obras con derechos de autor también pueden salir.</li></ul>
      <button class="btn pri grande" data-act="examen-nuevo">Examen aleatorio · 90 minutos</button></div>
    <div class="card"><h3>Tu historial</h3>
      ${hist.length ? `<div class="scroll-x"><table class="tabla" style="margin-top:8px"><tr><th>Fecha</th><th>Nota</th><th>I</th><th>II</th><th>III</th><th>Tiempo</th></tr>
        ${hist.map(e => `<tr><td>${new Date(e.fecha).toLocaleDateString('es-ES')}</td><td><b>${fmt(e.nota)}</b></td><td>${fmt(e.b1)}</td><td>${fmt(e.b2)}</td><td>${fmt(e.b3)}</td><td class="mono">${mmss(e.usado || 0)}</td></tr>`).join('')}</table></div>`
        : '<p class="vacio" style="margin-top:10px">Todavía no has hecho ningún simulacro.</p>'}</div>
  </div></div>`;
}

const VISTAS = {inicio: vInicio, comunicacion: vCom, lengua: vLen, literatura: vLit, simulador: vSim};

/* =====================================================================
   EVENTOS (delegados)
   ===================================================================== */
function actualizarNotaExamen() {
  if (!EX || EX.estado === 'curso') return;
  const n = notasExamen(), tot = $('#nota-total'); if (!tot) return;
  tot.textContent = fmt(n.total);
  const vals = [[n.b1, 4], [n.an, 1.5], [n.br, 1.5], [n.b3, 3]];
  $$('#desglose .r').forEach((r, i) => { r.querySelector('b').textContent = fmt(vals[i][0]) + ' / ' + fmt(vals[i][1]); r.querySelector('.barra i').style.width = vals[i][0] / vals[i][1] * 100 + '%'; });
}
function anEstado(ctxEl) { return ctxEl.dataset.anCtx === 'ex' ? EX.an : AN.prac; }
function anOracion(ctxEl) { return ctxEl.dataset.anCtx === 'ex' ? ORACIONES[EX.oracion] : ORACIONES[AN.prac.idx]; }
function anPintar(ctxEl) {
  const ex = ctxEl.dataset.anCtx === 'ex';
  if (ex) { ctxEl.innerHTML = htmlAnalizador(anOracion(ctxEl), EX.an, EX.estado === 'curso' ? 'ex' : 'corr'); guardarEx(); }
  else pintarAn();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  switch (a) {
    case 'examen-nuevo':
      if (EX && EX.estado === 'curso' && !confirm('Tienes un examen en curso. ¿Empezar otro y descartar el actual?')) return;
      nuevoExamen(); break;
    case 'reset':
      if (confirm('¿Borrar todo tu progreso, borradores e historial de exámenes?')) {
        try { Object.keys(localStorage).filter(k => k.startsWith('castellano:')).forEach(k => localStorage.removeItem(k)); } catch (err) {}
        location.reload();
      } break;
    /* comunicación */
    case 'quiz-gen': { quizGen.resp = b.dataset.g; if (quizGen.resp === GENEROS_QUIZ[quizGen.orden[quizGen.i]].ok) quizGen.ok++; pintarQuiz(); break; }
    case 'quiz-sig': quizGen.i = (quizGen.i + 1) % GENEROS_QUIZ.length; if (quizGen.i === 0) quizGen.ok = 0; quizGen.resp = null; pintarQuiz(); break;
    case 'com-sel': comSel = b.dataset.id; store.set('comSel', comSel); $$('#sel-textos button').forEach(x => x.setAttribute('aria-pressed', x.dataset.id === comSel)); pintarTaller(); break;
    case 'q2-otra': { const t = textoActual(); q2Sel[t.id] = (q2Sel[t.id] + 1) % t.q2.length; pintarTaller(); break; }
    case 'propio-ok': pintarTaller(); toast('Texto guardado'); break;
    case 'ver-modelo': { const w = b.nextElementSibling; w.hidden = !w.hidden; b.textContent = w.hidden ? 'Ver respuesta modelo y autoevaluarme' : 'Ocultar respuesta modelo'; break; }
    /* lengua: analizador */
    case 'corte': case 'an-verbos': case 'an-borrar': case 'an-check': case 'an-sol': {
      const c = b.closest('[data-an-ctx]'); if (!c) break;
      const st = anEstado(c), o = anOracion(c);
      if (a === 'corte') { const i = +b.dataset.i, s = new Set(st.cuts); s.has(i) ? s.delete(i) : s.add(i); st.cuts = [...s].sort((x, y) => x - y); st.rels = []; st.check = false; }
      if (a === 'an-verbos') st.verbos = !st.verbos;
      if (a === 'an-borrar') { st.cuts = []; st.rels = []; st.check = false; }
      if (a === 'an-check') { st.check = true; const ev = evaluarOracion(o, st); P.oraciones[st.idx] = Math.max(P.oraciones[st.idx] || 0, ev.pts); guardarP(); }
      if (a === 'an-sol') { st.cuts = [...cortesEsperados(o)]; st.rels = o.r.map(r => ({t: r.t, n: r.t === 'yux' ? '' : r.n[0]})); st.check = true; }
      anPintar(c); break;
    }
    case 'an-mover': case 'an-azar': {
      const st = AN.prac;
      st.idx = a === 'an-azar' ? Math.floor(Math.random() * ORACIONES.length) : (st.idx + +b.dataset.d + ORACIONES.length) % ORACIONES.length;
      st.cuts = []; st.rels = []; st.check = false; store.set('anIdx', st.idx); const r = $('#an-redac'); if (r) r.value = ''; pintarAn(); break;
    }
    /* lengua: breves */
    case 'cat': { const id = b.dataset.id; breveCats = breveCats.includes(id) ? breveCats.filter(x => x !== id) : breveCats.concat(id); if (!breveCats.length) breveCats = [id]; store.set('breveCats', breveCats);
      $$('#cats button').forEach(x => { const on = breveCats.includes(x.dataset.id); x.setAttribute('aria-pressed', on); x.style.borderColor = on ? 'var(--acc)' : ''; x.style.background = on ? 'var(--acc-soft)' : ''; });
      RAP = null; pintarRap(); break; }
    case 'bat-nueva': Object.keys(PRAC_RUB).filter(k => k.startsWith('pb:')).forEach(k => delete PRAC_RUB[k]); BAT = {ids: generarBateria(breveCats), ele: [], resp: {}, rub: PRAC_RUB, rubPref: 'pb', corr: false}; pintarBat(); break;
    case 'elige-breve': {
      const st = b.closest('[data-bat-ctx="ex"]') ? EX.bat : BAT, id = +b.dataset.id;
      st.ele = st.ele.includes(id) ? st.ele.filter(x => x !== id) : st.ele.concat(id).slice(0, 2);
      if (st === BAT) pintarBat(); else { guardarEx(); const c = b.closest('[data-bat-ctx]'); c.innerHTML = (EX.bat.ele.length < 2 ? '<p class="small soft">Marca las dos que eliges.</p>' : '') + EX.breves.map((x, i) => htmlBreve(x, '5.' + (i + 1), EX.bat, '')).join(''); rellenarEx(c); }
      break;
    }
    case 'resp-breve': {
      const enEx = !!b.closest('[data-bat-ctx="ex"]'), st = enEx ? EX.bat : BAT, id = +b.dataset.id; st.resp[id] = +b.dataset.i;
      $$(`[data-act="resp-breve"][data-id="${id}"]`, b.parentElement.parentElement).forEach(x => x.classList.toggle('sel', +x.dataset.i === st.resp[id]));
      if (enEx) guardarEx(); break;
    }
    case 'bat-corr': BAT.corr = true; BAT.ele.forEach(id => { if (BREVES[id].o) { P.breves.tot++; if (BAT.resp[id] === BREVES[id].k) P.breves.ok++; } }); guardarP(); pintarBat(); break;
    case 'rap-resp': { RAP.resp = +b.dataset.i; const ok = RAP.resp === BREVES[RAP.id].k; RAP.racha = ok ? RAP.racha + 1 : 0; P.breves.tot++; if (ok) P.breves.ok++; guardarP(); pintarRap(); break; }
    case 'rap-sig': RAP.id = -1; pintarRap(); break;
    /* literatura */
    case 'lit-filtro': litFiltro = b.dataset.g; ruta(); break;
    case 'obra-tab': { litTab[b.dataset.id] = b.dataset.t; const o = OBRAS.find(x => x.id === b.dataset.id); vObra(o, b.dataset.t); rellenar(app); break; }
    case 'frag-sel': fragSel[b.dataset.id] = b.dataset.f; pintarComentario(OBRAS.find(x => x.id === b.dataset.id), $('#obra-cont')); break;
    case 'fc-flip': FC.cur.vuelta = !FC.cur.vuelta; b.classList.toggle('vuelta', FC.cur.vuelta); break;
    case 'fc-mov': FC.cur.i = Math.max(0, FC.cur.i + +b.dataset.d); FC.cur.vuelta = false; pintarFC(FC.el); break;
    case 'fc-marca': {
      const m = FC.cur, cartas = m.soloPend ? m.cartas.filter(c => !P.flash[c.key]) : m.cartas, c = cartas[m.i];
      if (c) { P.flash[c.key] = b.dataset.v === '1'; guardarP(); }
      if (!(m.soloPend && b.dataset.v === '1')) m.i++;
      m.vuelta = false; pintarFC(FC.el); break;
    }
    case 'fc-pend': if (b.tagName === 'INPUT') { FC.cur.soloPend = b.checked; } else FC.cur.soloPend = false; FC.cur.i = 0; FC.cur.vuelta = false; pintarFC(FC.el); break;
    /* simulador */
    case 'ex-pausa':
      if (EX.pausa != null) { EX.fin = Date.now() + EX.pausa; EX.pausa = null; } else EX.pausa = Math.max(0, EX.fin - Date.now());
      guardarEx(); b.textContent = EX.pausa != null ? 'Reanudar' : 'Pausar'; arrancarReloj(); break;
    case 'ex-abandonar': if (confirm('¿Abandonar el examen? Se perderán tus respuestas.')) { EX = null; store.del('examen'); arrancarReloj(); $('#reloj').classList.remove('on', 'aviso', 'fin'); ruta(); } break;
    case 'ex-entregar': if (confirm('¿Entregar el examen?')) entregar(); break;
    case 'ex-lit': EX.eleL = +b.dataset.i; guardarEx(); { const y = window.scrollY; ruta(); window.scrollTo(0, y); } break;
    case 'ex-guardar': {
      const n = notasExamen();
      P.examenes.push({fecha: Date.now(), nota: n.total, b1: n.b1, b2: n.b2, b3: n.b3, usado: EX.usado});
      guardarP(); EX.estado = 'hecho'; EX.ver = true; guardarEx(); toast('Nota guardada: ' + fmt(n.total)); const y = window.scrollY; ruta(); window.scrollTo(0, y); break;
    }
    case 'ex-cerrar': EX.ver = false; guardarEx(); ruta(); break;
  }
});
$('#reloj').addEventListener('click', () => { location.hash = '#simulador'; });
$('#reloj').style.cursor = 'pointer';

function rellenarEx(root) { $$('[data-count]', root).forEach(contar); }

document.addEventListener('change', e => {
  const el = e.target;
  /* rúbricas */
  const rb = el.closest('[data-rub]');
  if (rb && el.type === 'checkbox') {
    const clave = rb.dataset.rub, ex = !!rb.dataset.ex, mapa = ex ? EX.rub : PRAC_RUB;
    const est = mapa[clave] = mapa[clave] || []; est[+el.dataset.i] = el.checked;
    const defs = RUB[clave.split(':').pop()] || (/:(\d+)$/.test(clave) ? rubBreve(BREVES[+clave.split(':').pop()]) : RUB[clave]);
    $('[data-rub-pts]', rb).textContent = fmt(rubPuntos(defs, est));
    if (ex) { guardarEx(); actualizarNotaExamen(); }
    else {
      store.set('rub', PRAC_RUB);
      const nb1 = $('#nota-b1'); if (nb1 && clave.startsWith('b1:')) { const k = clave.split(':').slice(0, 2).join(':'); nb1.textContent = fmt(notaB1(k)) + ' / 4,00'; P.textos[k.split(':')[1]] = notaB1(k); guardarP(); }
      const nb3 = $('#nota-b3'); if (nb3 && clave.startsWith('b3:')) { const k = clave.split(':').slice(0, 3).join(':'); nb3.textContent = fmt(['la', 'lb', 'lc'].reduce((s, r) => s + rubPuntos(RUB[r], PRAC_RUB[k + ':' + r]), 0)) + ' / 3,00'; }
      const bn = $('#bat-nota'); if (bn && BAT) bn.textContent = fmt(BAT.ele.reduce((s, id) => s + puntosBreve(id, BAT), 0)) + ' / 1,50';
    }
    return;
  }
  /* analizador: tipo de relación */
  if (el.matches('select[data-an]')) {
    const c = el.closest('[data-an-ctx]'), st = anEstado(c), k = +el.dataset.k;
    st.rels[k] = Object.assign(st.rels[k] || {t: '', n: ''}, {t: el.value});
    if (el.value === 'yux') st.rels[k].n = '';
    st.check = false; anPintar(c); return;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.save) store.set('borrador:' + el.dataset.save, el.value);
  if (el.dataset.count != null) contar(el);
  if (el.dataset.count === '50-80') autoPalabrasQ2(el.closest('.preg'));
  if (el.dataset.ex) { EX.resp[el.dataset.ex] = el.value; guardarEx(); }
  if (el.dataset.an === 'n') { const c = el.closest('[data-an-ctx]'), st = anEstado(c), k = +el.dataset.k; st.rels[k] = Object.assign(st.rels[k] || {t: '', n: ''}, {n: el.value}); if (c.dataset.anCtx === 'ex') guardarEx(); }
  if (el.dataset.breve != null) { const enEx = !!el.closest('[data-bat-ctx="ex"]'); (enEx ? EX.bat : BAT).resp[+el.dataset.breve] = el.value; if (enEx) guardarEx(); contar(el); }
  if (el.dataset.propio) { const p = store.get('textoPropio', {titulo: '', cuerpo: ''}); p[el.dataset.propio] = el.value; store.set('textoPropio', p); }
  if (el.dataset.expPropia != null) store.set('expPropia', el.value);
  if (el.dataset.frag) { const p = store.get('frag:' + el.dataset.frag, {texto: '', ref: ''}); p.texto = el.value; store.set('frag:' + el.dataset.frag, p); }
  if (el.dataset.fragRef) { const p = store.get('frag:' + el.dataset.fragRef, {texto: '', ref: ''}); p.ref = el.value; store.set('frag:' + el.dataset.fragRef, p); }
});

/* teclado en las tarjetas: espacio para girar, flechas para moverse */
document.addEventListener('keydown', e => {
  if (!FC.el || !document.body.contains(FC.el) || /INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) return;
  if (e.key === ' ' || e.key === 'Enter') { const f = $('.flash', FC.el); if (f) { e.preventDefault(); f.click(); } }
  if (e.key === 'ArrowRight') { FC.cur.i++; FC.cur.vuelta = false; pintarFC(FC.el); }
  if (e.key === 'ArrowLeft') { FC.cur.i = Math.max(0, FC.cur.i - 1); FC.cur.vuelta = false; pintarFC(FC.el); }
});

window.addEventListener('hashchange', ruta);
ruta();
if (EX && EX.estado === 'curso') arrancarReloj();
})();
</script>
</body>
</html>
