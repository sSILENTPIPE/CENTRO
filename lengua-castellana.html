 e:'Delimita el ámbito desde el que se hace la afirmación: adverbio de punto de vista o de marco.'},
{c:'adv', q:'¿Qué tipo de adverbio es «semanalmente» en: «Nos reunimos semanalmente»?', o:['De frecuencia','De modo','Aspectual','De cantidad'], k:0,
 e:'Indica cuántas veces se repite la acción: adverbio de frecuencia.'},
{c:'adv', q:'Escribe una oración con un adverbio de frecuencia y otra con un adverbio aspectual.',
 m:'Frecuencia (cuántas veces ocurre la acción): «Hago ejercicio diariamente para mantenerme sano». Aspectual (fase o desarrollo interno de la acción): «Todavía está haciendo el examen de Lengua» o «Mi sobrina ya sabe nadar».',
 r:['Oración correcta con un adverbio de frecuencia','Oración correcta con un adverbio aspectual (ya, todavía, aún)','Explica brevemente el valor de cada uno']},

/* --- cuantificadores --- */
{c:'cuant', q:'Localiza un cuantificador en: «Las gentes me miran, algunos sonríen».', o:['gentes','me','algunos','sonríen'], k:2,
 e:'«Algunos» es un cuantificador indefinido (existencial) que funciona como pronombre: lo que tradicionalmente llamabas «indefinido».'},
{c:'cuant', q:'¿Cómo se clasifica «cada» en: «Cada alumno trae su libro»?', o:['Cuantificador universal distributivo','Cuantificador existencial','Numeral ordinal','Demostrativo'], k:0,
 e:'Abarca a todos los miembros del conjunto, uno por uno: cuantificador universal de valor distributivo.'},
{c:'cuant', q:'¿Qué tipo de cuantificador es «demasiados» en: «Hay demasiados coches»?', o:['Universal','Existencial','Evaluativo (de grado)','Numeral'], k:2,
 e:'Expresa una cantidad valorada respecto a una norma (más de la adecuada): cuantificador evaluativo, como mucho, poco o bastante.'},
{c:'cuant', q:'¿Qué significa «sendos»?', o:['Los dos','Uno para cada uno','Varios','Ninguno'], k:1,
 e:'«Sendos» es distributivo: «Los ministros llegaron en sendos coches» = cada ministro en su coche.'},
{c:'cuant', q:'«Los tres ministros llegaron en sendos coches». ¿Cuántos coches hay?', o:['Dos','Tres','Uno','No se puede saber'], k:1,
 e:'«Sendos» reparte un coche para cada ministro: tres ministros, tres coches. No significa «dos» (eso es «ambos»).'},
{c:'cuant', q:'¿Qué es «tercer» en: «el tercer capítulo»?', o:['Numeral cardinal','Numeral ordinal','Numeral fraccionario','Numeral multiplicativo'], k:1,
 e:'Indica el orden en una serie: numeral ordinal (forma apocopada de «tercero»).'},
{c:'cuant', q:'¿En qué oración «mucho» es un determinante cuantificador?', o:['Estudia mucho','Tiene mucho tiempo','Es mucho mejor','Mucho me temo que no vendrá'], k:1,
 e:'Solo en «mucho tiempo» acompaña a un sustantivo. En las demás es adverbio.'},
{c:'cuant', q:'¿Cómo se clasifica «ningún» en: «No tengo ningún problema»?', o:['Universal','Indefinido (existencial) negativo','Numeral','Adverbio de negación'], k:1,
 e:'Es un cuantificador indefinido de polaridad negativa que actúa como determinante de «problema».'},

/* --- sinónimos contextuales --- */
{c:'sin', q:'Sinónimo contextual de «desterrar» en: «un plan para desterrar la discriminación».', o:['Exiliar','Erradicar','Enterrar','Desplazar'], k:1,
 e:'Literalmente «desterrar» es expulsar de un territorio; en este contexto significa eliminar por completo: erradicar.'},
{c:'sin', q:'Sinónimo contextual de «frondosa» en: «dependiendo de lo frondosa que sea tu imaginación».', o:['Con muchas hojas','Rica, exuberante','Confusa','Arbolada'], k:1,
 e:'Uso metafórico: una imaginación «frondosa» es abundante y rica en detalles.'},
{c:'sin', q:'Sinónimo contextual de «proclives» en: «proclives a reconocer peor las caras».', o:['Contrarios','Propensos','Incapaces','Aficionados'], k:1,
 e:'«Proclive» significa inclinado o propenso a algo.'},
{c:'sin', q:'Sinónimo contextual de «mascullo» en: «mascullo en voz baja».', o:['Grito','Murmuro','Mastico','Repito'], k:1,
 e:'Mascullar es hablar entre dientes: murmurar, musitar.'},
{c:'sin', q:'Significado contextual de «tozudos» en: «Los datos son tozudos».', o:['Testarudos','Irrefutables','Abundantes','Recientes'], k:1,
 e:'Es una personificación: aplicado a los datos, significa que no se pueden negar ni discutir.'},
{c:'sin', q:'Sinónimo contextual de «languidezca» en: «para que el legado de la experiencia no languidezca».', o:['Florezca','Se debilite','Se ordene','Se esconda'], k:1,
 e:'Languidecer es perder fuerza o intensidad poco a poco.'},
{c:'sin', q:'Sinónimo contextual de «paliar» en: «medidas para paliar la crisis».', o:['Agravar','Mitigar','Ocultar','Anunciar'], k:1, e:'Paliar es atenuar o suavizar un daño.'},
{c:'sin', q:'Sinónimo contextual de «efímero» en: «un éxito efímero».', o:['Duradero','Pasajero','Inesperado','Rotundo'], k:1, e:'Efímero: que dura muy poco.'},
{c:'sin', q:'Sinónimo contextual de «soslayar» en: «No podemos soslayar el problema».', o:['Eludir','Resolver','Estudiar','Agrandar'], k:0, e:'Soslayar es esquivar o evitar una dificultad.'},
{c:'sin', q:'Sinónimo contextual de «acérrimo» en: «un defensor acérrimo de la escuela pública».', o:['Tibio','Incondicional','Antiguo','Crítico'], k:1, e:'Acérrimo: muy firme, tenaz, incondicional.'},
{c:'sin', q:'Sinónimo contextual de «coyuntura» en: «la actual coyuntura económica».', o:['Situación','Crisis','Estructura','Unión'], k:0, e:'Coyuntura: combinación de circunstancias en un momento determinado.'},
{c:'sin', q:'Sinónimo contextual de «aflorar» en: «Todos somos divergentes en algo y eso empieza a aflorar».', o:['Desaparecer','Salir a la luz','Florecer','Ocultarse'], k:1, e:'Aflorar: manifestarse algo que estaba oculto.'},
{c:'sin', q:'Indica un sinónimo y explica el significado contextual de: «desterrar», «frondosa» y «proclives».',
 m:'«Desterrar» (erradicar, eliminar): en el texto no significa expulsar de un territorio, sino acabar por completo con la discriminación. «Frondosa» (rica, exuberante): se aplica en sentido figurado a la imaginación, para indicar que es abundante en detalles, como un árbol lleno de hojas. «Proclives» (propensos, inclinados): las personas con afantasía tienen tendencia a reconocer peor las caras.',
 r:['Sinónimo y explicación correctos de «desterrar»','Sinónimo y explicación correctos de «frondosa»','Sinónimo y explicación correctos de «proclives»']},

/* --- formación de palabras --- */
{c:'form', q:'Indica el procedimiento de formación de: «conciudadanos», «afantásticos» e «incapacidad».',
 m:'«Conciudadanos»: derivación por prefijación (con- + ciudadano, que a su vez es derivada de «ciudad» + -ano). «Afantásticos»: derivación por prefijación con el prefijo privativo a- (a- + fantástico, derivado de «fantasía»). «Incapacidad»: derivación por prefijación y sufijación (in- + capaz + -idad); no es parasintética, porque existen tanto «incapaz» como «capacidad».',
 r:['«Conciudadanos»: prefijación con con-','«Afantásticos»: prefijación con a- (privativo)','«Incapacidad»: prefijo + sufijo, y no parasintética (justificado)']},
{c:'form', q:'¿Cómo se forma «envejecer»?', o:['Composición','Derivación por sufijación','Parasíntesis','Acronimia'], k:2,
 e:'en- + viej- + -ecer a la vez: no existen ni «*envejo» ni «*vejecer». Es parasintética.'},
{c:'form', q:'¿Cómo se forma «anochecer»?', o:['Composición','Parasíntesis','Prefijación','Sufijación'], k:1, e:'a- + noch- + -ecer a la vez (no existen «*anoche-» como verbo ni «*nochecer»): parasintética.'},
{c:'form', q:'¿Cómo se forma «sacacorchos»?', o:['Composición','Derivación','Parasíntesis','Sigla'], k:0, e:'Une dos palabras: el verbo «saca» y el sustantivo «corchos». Es un compuesto.'},
{c:'form', q:'¿Cómo se forma «agridulce»?', o:['Derivación','Composición','Parasíntesis','Acortamiento'], k:1, e:'Agrio + dulce: compuesto (con la -o final convertida en -i-).'},
{c:'form', q:'¿Qué es «Mercosur» (Mercado Común del Sur)?', o:['Sigla','Acrónimo','Compuesta','Parasintética'], k:1, e:'Se forma con fragmentos de las palabras (no solo con iniciales) y se lee como una palabra: acrónimo.'},
{c:'form', q:'¿Qué es «ONU»?', o:['Sigla','Acrónimo','Derivada','Compuesta'], k:0, e:'Se forma con las iniciales de Organización de las Naciones Unidas: sigla.'},
{c:'form', q:'¿Cómo se forma «picapedrero»?', o:['Composición','Derivación','Parasíntesis por composición y derivación','Acortamiento'], k:2,
 e:'Combina a la vez composición (picar + piedra) y derivación (-ero): parasíntesis por composición y derivación.'},
{c:'form', q:'¿Cómo se forma «ilegalidad»?', o:['Parasíntesis','Derivación por prefijación y sufijación','Composición','Acronimia'], k:1,
 e:'i- + legal + -idad, pero existen «ilegal» y «legalidad», así que no es parasintética.'},

/* --- perífrasis --- */
{c:'peri', q:'Clasifica las perífrasis: «estamos viviendo», «empieza a aflorar» y «seguimos dejándonos llevar».',
 m:'«Estamos viviendo» (estar + gerundio): perífrasis aspectual durativa, presenta la acción en su desarrollo. «Empieza a aflorar» (empezar a + infinitivo): aspectual ingresiva o incoativa, indica el comienzo de la acción. «Seguimos dejándonos llevar» (seguir + gerundio): aspectual continuativa, indica que la acción continúa.',
 r:['«Estamos viviendo»: aspectual durativa','«Empieza a aflorar»: aspectual ingresiva/incoativa','«Seguimos dejándonos»: aspectual continuativa']},
{c:'peri', q:'¿Qué tipo de perífrasis es «Tengo que estudiar»?', o:['Aspectual ingresiva','Modal de obligación','Modal de posibilidad','Aspectual terminativa'], k:1, e:'Tener que + infinitivo expresa obligación: modal.'},
{c:'peri', q:'¿Qué tipo de perífrasis es «Debe de haber llegado»?', o:['Modal de obligación','Modal de probabilidad o conjetura','Aspectual durativa','No es perífrasis'], k:1,
 e:'Deber de + infinitivo expresa suposición. «Deber» sin «de» expresa obligación.'},
{c:'peri', q:'¿Qué tipo de perífrasis es «Acaba de salir»?', o:['Ingresiva','Terminativa (de pasado reciente)','Reiterativa','Habitual'], k:1, e:'Acabar de + infinitivo indica que la acción ha terminado hace muy poco.'},
{c:'peri', q:'¿Qué tipo de perífrasis es «Se echó a llorar»?', o:['Ingresiva o incoativa','Terminativa','Durativa','Modal'], k:0, e:'Echarse a + infinitivo marca el comienzo brusco de la acción.'},
{c:'peri', q:'¿Qué tipo de perífrasis es «Volvió a llamarme»?', o:['Reiterativa','Habitual','Durativa','Ingresiva'], k:0, e:'Volver a + infinitivo indica repetición.'},
{c:'peri', q:'¿Qué tipo de perífrasis es «Dejó de fumar»?', o:['Ingresiva','Terminativa o interruptiva','Reiterativa','Modal'], k:1, e:'Dejar de + infinitivo indica la interrupción de la acción.'},
{c:'peri', q:'¿Qué tipo de perífrasis es «Lleva tres años estudiando»?', o:['Durativa','Terminativa','Modal','Reiterativa'], k:0, e:'Llevar + gerundio presenta la acción en desarrollo desde un momento anterior.'},
{c:'peri', q:'¿Qué tipo de perífrasis es «Suele llegar tarde»?', o:['Habitual','Ingresiva','Modal de posibilidad','Durativa'], k:0, e:'Soler + infinitivo indica costumbre.'},
{c:'peri', q:'¿Cuál de estas NO es una perífrasis verbal?', o:['Tiene que venir','Vino a verme','Suele llegar tarde','Está estudiando'], k:1,
 e:'En «Vino a verme», «venir» conserva su significado de movimiento y «a verme» expresa finalidad.'},

/* --- se --- */
{c:'se', q:'¿Qué valor tiene «se» en: «Se venden pisos»?', o:['Reflexivo','Pasiva refleja','Impersonal','Recíproco'], k:1, e:'El sujeto es «pisos» (concuerda: se vende un piso / se venden pisos): pasiva refleja.'},
{c:'se', q:'¿Qué valor tiene «se» en: «Aquí se vive bien»?', o:['Pasiva refleja','Impersonal','Pronominal','Reflexivo'], k:1, e:'No hay sujeto posible y el verbo queda en 3.ª persona del singular: impersonal con «se».'},
{c:'se', q:'¿Qué valor tiene «se» en: «Juan y Paco se saludaron»?', o:['Reflexivo','Recíproco','Pasiva refleja','Variante de «le»'], k:1, e:'La acción se produce de uno a otro: recíproco (funciona como CD).'},
{c:'se', q:'¿Qué valor tiene «se» en: «Se lava la cara»?', o:['Reflexivo (CI)','Reflexivo (CD)','Impersonal','Pronominal'], k:0, e:'El CD es «la cara»; «se» indica a quién afecta la acción: reflexivo con función de CI.'},
{c:'se', q:'¿Qué valor tiene «se» en: «Se lo di ayer»?', o:['Reflexivo','Variante de «le» (CI)','Pasiva refleja','Impersonal'], k:1, e:'«Le» se convierte en «se» delante de «lo»: le di el libro → se lo di. Función de CI.'},
{c:'se', q:'¿Qué valor tiene «se» en: «Se arrepintió de todo»?', o:['Reflexivo','Recíproco','Pronominal (forma parte del verbo)','Impersonal'], k:2, e:'«Arrepentirse» solo existe como verbo pronominal: el «se» no tiene función sintáctica.'},
{c:'se', q:'¿Qué valor tiene «se» en: «Se peina cada mañana»?', o:['Reflexivo (CD)','Reflexivo (CI)','Pasiva refleja','Impersonal'], k:0, e:'La acción recae sobre el propio sujeto, que es lo peinado: reflexivo con función de CD.'},

/* --- funciones sintácticas --- */
{c:'func', q:'Indica de manera justificada la función de los sintagmas subrayados: «Pero no soy pesimista. En realidad, estamos viviendo tiempos formidables» (pesimista, En realidad, tiempos formidables).',
 m:'«Pesimista» es el atributo del verbo copulativo «ser»: concuerda con el sujeto y puede sustituirse por «lo» (no lo soy). «En realidad» es una locución adverbial que funciona como modificador oracional (o complemento oracional): no afecta solo al verbo, sino a toda la oración, y va separada por una coma. «Tiempos formidables» es el CD de la perífrasis «estamos viviendo»: puede sustituirse por «los» (estamos viviéndolos).',
 r:['«Pesimista»: atributo, justificado (copulativo, «lo»)','«En realidad»: modificador oracional','«Tiempos formidables»: CD, justificado («los»)']},
{c:'func', q:'¿Qué función tiene «de su trabajo» en: «Está orgulloso de su trabajo»?', o:['CRV','Complemento del adjetivo','CN','CC'], k:1, e:'Depende del adjetivo «orgulloso», no del verbo: complemento del adjetivo.'},
{c:'func', q:'¿Qué función tiene «de su pasado» en: «Nunca habla de su pasado»?', o:['CN','CC de tema','CRV (suplemento)','CD'], k:2, e:'El verbo «hablar de» exige la preposición: complemento de régimen verbal.'},
{c:'func', q:'¿Qué función tiene «cansada» en: «Llegó cansada a casa»?', o:['Atributo','Complemento predicativo','CN','CC de modo'], k:1,
 e:'El verbo es predicativo y el adjetivo concuerda con el sujeto: complemento predicativo.'},
{c:'func', q:'¿Qué función tiene «por el jurado» en: «La novela fue premiada por el jurado»?', o:['CC de causa','Complemento agente','CRV','CI'], k:1, e:'En la pasiva perifrástica indica quién realiza la acción: complemento agente.'},
{c:'func', q:'¿Qué función tiene «en Palma» en: «Vive en Palma»?', o:['CC de lugar','Complemento locativo argumental','CRV','Atributo locativo'], k:1,
 e:'«Vivir» con el sentido de «residir» exige un complemento de lugar (sin él, «Vive» significa «está vivo»): complemento locativo argumental.'},
{c:'func', q:'¿Qué función tiene «en la biblioteca» en: «Los alumnos están en la biblioteca»?', o:['CC de lugar','Atributo locativo','CRV','Complemento predicativo'], k:1,
 e:'Con «estar» de ubicación, el complemento de lugar es imprescindible: atributo locativo (según las puntualizaciones de la UIB).'},
{c:'func', q:'¿Qué función tiene «tres kilos» en: «El paquete pesa tres kilos»?', o:['CD','Complemento de medida argumental','CC de cantidad','Atributo'], k:1,
 e:'No se puede pasar a pasiva ni sustituir por «los» con naturalidad: complemento de medida argumental.'},
{c:'func', q:'¿Qué función tiene «con un cuchillo» en: «Cortó el pan con un cuchillo»?', o:['CC de compañía','CC de instrumento','CRV','CN'], k:1, e:'Indica el instrumento con el que se realiza la acción.'},

/* --- agramaticales --- */
{c:'agram', q:'¿Qué oración es correcta?', o:['Habían muchas personas en la sala','Había muchas personas en la sala','Hubieron muchas personas en la sala','Han habido muchas personas en la sala'], k:1,
 e:'«Haber» existencial es impersonal: va siempre en 3.ª persona del singular. «Muchas personas» es CD, no sujeto.'},
{c:'agram', q:'Corrige: «Pienso de que tienes razón».', o:['Es correcta','Pienso que tienes razón','Pienso en que tienes razón','Pienso a que tienes razón'], k:1,
 e:'Dequeísmo: «pensar» rige un CD sin preposición (pienso eso).'},
{c:'agram', q:'Corrige: «Me acuerdo que llovía».', o:['Es correcta','Me acuerdo de que llovía','Me acuerdo en que llovía','Acuerdo de que llovía'], k:1,
 e:'Queísmo: «acordarse» exige la preposición «de» (me acuerdo de eso).'},
{c:'agram', q:'Corrige: «Le dije a mis amigos la verdad».', o:['Es correcta','Les dije a mis amigos la verdad','Los dije a mis amigos la verdad','Le dijeron a mis amigos la verdad'], k:1,
 e:'El pronombre de CI debe concordar con el CI duplicado: «a mis amigos» es plural → «les».'},
{c:'agram', q:'Corrige: «Se alquila habitaciones».', o:['Es correcta','Se alquilan habitaciones','Se alquila las habitaciones','Alquila habitaciones'], k:1,
 e:'Es una pasiva refleja: «habitaciones» es el sujeto y el verbo debe concordar en plural.'},
{c:'agram', q:'Elige la opción correcta.', o:['No lo hizo él, si no su hermano','No lo hizo él, sino su hermano'], k:1,
 e:'«Sino» es la conjunción adversativa (corrige una negación). «Si no» es condicional + negación: «Si no vienes, me enfado».'},
{c:'agram', q:'Corrige y explica: «Ves a comprar el pan».',
 m:'La forma correcta es «Ve a comprar el pan». El imperativo de «ir» para «tú» es «ve»; «ves» es el presente de indicativo del verbo «ver», por lo que su uso aquí es incorrecto.',
 r:['Da la forma correcta «ve»','Explica que es el imperativo de «ir»','Explica que «ves» pertenece al verbo «ver»']}
];

/* Esquemas del Bloque II */
const TEORIA_LEN = [
{t:'Oración compuesta: proposición, coordinación y yuxtaposición', h:`
<p>Una <b>oración compuesta</b> tiene <b>dos o más verbos conjugados</b> (o formas no personales que funcionan como núcleo de una oración). Cada estructura con su verbo es una <b>proposición</b>.</p>
<p class="nota warn">Cuenta los <b>núcleos verbales</b>, no las palabras que parecen verbos: una <b>perífrasis</b> (<i>tengo que estudiar</i>, <i>estamos viviendo</i>) es un solo núcleo.</p>
<ul>
<li><b>Coordinación</b>: proposiciones del mismo nivel sintáctico, unidas por un <b>nexo coordinante</b>. Ninguna depende de la otra.</li>
<li><b>Yuxtaposición</b>: proposiciones del mismo nivel unidas <b>sin nexo</b>, solo con un <b>signo de puntuación</b> (coma, punto y coma, dos puntos).</li>
<li><b>Subordinación</b>: una proposición depende de otra y cumple una función dentro de ella (sustantivas, relativas, adverbiales). <i>En el parcial solo entran coordinadas y yuxtapuestas.</i></li>
</ul>`},
{t:'Las coordinadas: tipos y nexos', h:`
<div class="scroll-x"><table class="tabla">
<tr><th>Tipo</th><th>Significado</th><th>Nexos</th><th>Ejemplo</th></tr>
<tr><td><b>Copulativa</b></td><td>Suma o adición</td><td>y, e, ni</td><td class="ej">Marta toca el piano y su hermano canta.</td></tr>
<tr><td><b>Disyuntiva</b></td><td>Alternativa u opción</td><td>o, u, o bien; o… o</td><td class="ej">¿Estudiarás o te quedarás en casa?</td></tr>
<tr><td><b>Adversativa</b></td><td>Oposición o contraste</td><td>pero, mas, sino (que); <i>conectores:</i> sin embargo, no obstante</td><td class="ej">Llovía, pero salieron al patio.</td></tr>
<tr><td><b>Distributiva</b></td><td>Alternancia de acciones</td><td>bien… bien, ya… ya, ora… ora; unos… otros</td><td class="ej">Bien te quedas, bien vienes.</td></tr>
<tr><td><b>Explicativa</b></td><td>La segunda aclara la primera</td><td>es decir, o sea, esto es</td><td class="ej">Vetusta es Oviedo, esto es, Clarín disfraza su ciudad.</td></tr>
</table></div>
<ul>
<li><b>Adversativa restrictiva</b> (<i>pero, mas</i>): limita lo dicho. <b>Exclusiva</b> (<i>sino, sino que</i>): la primera proposición es negativa y la segunda la sustituye.</li>
<li><b>Ni</b> es copulativa negativa.</li>
<li><i>Sin embargo</i> y <i>no obstante</i> son conectores: según la gramática tradicional son nexos adversativos; según la NGLE, hay yuxtaposición con valor adversativo. Si lo justificas, vale.</li>
</ul>`},
{t:'Las yuxtapuestas y su valor', h:`
<p>Se unen con signos de puntuación, pero el contexto les da un <b>valor semántico</b> que conviene mencionar:</p>
<ul>
<li>Valor <b>copulativo</b>: <span class="ej">Llegué, vi, vencí.</span></li>
<li>Valor <b>adversativo</b>: <span class="ej">Los modernistas buscaban la belleza; los del 98 reflexionaban sobre España.</span></li>
<li>Valor <b>causal</b> (dos puntos): <span class="ej">Estoy agotado: llevo toda la noche estudiando.</span></li>
<li>Valor <b>consecutivo</b>: <span class="ej">Hace frío; abrígate bien.</span></li>
<li>Valor <b>explicativo</b> (dos puntos): <span class="ej">Ya ríe, ya llora: su ánimo cambia constantemente.</span></li>
</ul>`},
{t:'Cómo redactar la respuesta (modelo de la corrección)', h:`
<p>La UIB espera la <b>estructura jerárquica</b> de la oración con terminología coherente. Modelo del simulacro:</p>
<div class="modelo"><b class="t">Respuesta modelo</b><p>«Nos encontramos ante una oración compuesta por tres proposiciones. La proposición 1 <i>"Compraremos muchos muebles para el piso"</i> se relaciona con la proposición 2 <i>"comeremos por la zona de la nueva vivienda"</i> mediante yuxtaposición, y la proposición 2 se relaciona con la proposición 3 <i>"revisaremos las condiciones de la hipoteca en la cafetería de al lado"</i> mediante un nexo coordinante copulativo (y).»</p></div>
<ol>
<li>Di qué tipo de oración es y <b>cuántas proposiciones</b> tiene.</li>
<li><b>Delimita y cita</b> cada proposición (con su verbo).</li>
<li>Explica la <b>relación</b> entre ellas: tipo y nexo (o signo de puntuación).</li>
<li>Si hay perífrasis o una trampa (un <i>y</i> que une sustantivos), coméntalo.</li>
</ol>
<p class="nota">En los criterios de corrección se segmenta la oración y se puntúa cada elemento: aunque falles uno, los demás suman.</p>`},
{t:'Puntualizaciones de la UIB: tipología de preguntas', h:`
<ul>
<li>Comentario sobre la estructura de una oración compuesta.</li>
<li>Análisis, reconocimiento y justificación de categorías gramaticales y funciones sintácticas.</li>
<li>Sintaxis inversa: elección múltiple o creación (escribe una oración con…).</li>
<li>Análisis y corrección de secuencias agramaticales.</li>
<li>Pares mínimos: sintácticos y semánticos.</li>
<li>Sinónimos, antónimos y parónimos.</li>
</ul>
<p class="nota">Recuerda la regla de oro de tu profesora: <b>en lengua hay que decir qué es y qué función hace</b>.</p>`},
{t:'Clasificación de palabras según su categoría (UIB)', h:`
<div class="scroll-x"><table class="tabla">
<tr><th>Categoría</th><th>Subclases que pueden preguntarte</th></tr>
<tr><td>Sustantivo</td><td>Común/propio, individual/colectivo (<i>equipo, enjambre</i>), concreto/abstracto, contable/no contable.</td></tr>
<tr><td>Adjetivo</td><td><b>Calificativo</b> (de atribución subjetiva o valorativo / objetiva o descriptivo) y <b>relacional</b> (<i>tren eléctrico, patología cardiaca</i>; no se antepone ni admite grado; los gentilicios son relacionales). Especificativo (pospuesto) / explicativo (antepuesto, epíteto).</td></tr>
<tr><td>Adverbio</td><td>Tiempo, frecuencia, manera, punto de vista, modalidad, aspectuales, <b>de foco</b>, cuantificación, grado, exclamativo, interrogativo, negación, afirmación, relativos, comparativos.</td></tr>
<tr><td>Verbo</td><td>Auxiliar, predicativo, copulativo, semicopulativo; perífrasis verbales.</td></tr>
<tr><td>Determinante</td><td>Artículo determinado e indeterminado, relativos, demostrativos, exclamativos, interrogativos, posesivos, <b>cuantificadores</b>, numerales.</td></tr>
<tr><td>Pronombre</td><td>Personal, demostrativo (solo neutros <i>esto, eso, aquello</i> son siempre pronombres), indefinido, relativo, interrogativo, exclamativo.</td></tr>
<tr><td>Otras</td><td>Preposición, conjunción, interjección.</td></tr>
</table></div>`},
{t:'Adverbios de foco y cuantificadores', h:`
<h4>Adverbios de foco</h4>
<p>Destacan un elemento del enunciado (el <b>foco</b>) frente a otros posibles. Pueden ser:</p>
<ul>
<li><b>Exclusivos</b>: <i>solo, solamente, únicamente, exclusivamente</i>.</li>
<li><b>Inclusivos o aditivos</b>: <i>también, tampoco, incluso, hasta</i> (= incluso), <i>ni siquiera</i>.</li>
<li><b>Particularizadores</b>: <i>precisamente, justamente, sobre todo, especialmente</i>.</li>
</ul>
<p class="ej">Hasta los profesores se rieron · Únicamente Marta lo sabía · Precisamente tú me lo dices.</p>
<h4>Cuantificadores (lo que antes llamabas indefinidos y numerales)</h4>
<ul>
<li><b>Universales</b>: <i>todo, cada, cualquiera, ambos, sendos</i>.</li>
<li><b>Existenciales o indefinidos</b>: <i>alguno, ninguno, alguien, nadie, algo, nada</i>.</li>
<li><b>Evaluativos o de grado</b>: <i>mucho, poco, bastante, demasiado</i>.</li>
<li><b>Numerales</b>: cardinales (<i>dos</i>), ordinales (<i>tercer</i>), fraccionarios (<i>medio</i>), multiplicativos (<i>doble</i>).</li>
<li>Comparativos: <i>más, menos, tanto</i>.</li>
</ul>
<p class="nota"><b>Ambos</b> = los dos. <b>Sendos</b> = uno para cada uno (<i>llegaron en sendos coches</i>). Pueden ser determinantes o, en el caso de «ambos», pronombre.</p>`},
{t:'Perífrasis verbales', h:`
<div class="scroll-x"><table class="tabla">
<tr><th>Clase</th><th>Valor</th><th>Ejemplos</th></tr>
<tr><td rowspan="3"><b>Modales</b></td><td>Obligación</td><td><i>tener que, haber que, deber</i> + inf.</td></tr>
<tr><td>Posibilidad</td><td><i>poder</i> + inf.</td></tr>
<tr><td>Probabilidad / conjetura</td><td><i>deber de</i> + inf., <i>venir a</i> + inf. (aproximación)</td></tr>
<tr><td rowspan="7"><b>Aspectuales</b></td><td>Ingresiva / incoativa</td><td><i>ir a, empezar a, ponerse a, echarse a</i> + inf.</td></tr>
<tr><td>Durativa</td><td><i>estar, andar, llevar</i> + gerundio</td></tr>
<tr><td>Continuativa</td><td><i>seguir, continuar</i> + gerundio</td></tr>
<tr><td>Terminativa</td><td><i>acabar de, dejar de, terminar de</i> + inf.; <i>llevar, tener</i> + participio</td></tr>
<tr><td>Reiterativa</td><td><i>volver a</i> + inf.</td></tr>
<tr><td>Habitual</td><td><i>soler</i> + inf.</td></tr>
<tr><td>Resultativa</td><td><i>tener, llevar, quedar</i> + participio</td></tr>
</table></div>
<p class="nota warn">No es perífrasis si el verbo conserva su significado: <i>Vino a verme</i> (movimiento + finalidad).</p>`},
{t:'Valores de «se»', h:`
<ul>
<li><b>Reflexivo</b> (CD o CI): <span class="ej">Se peina · Se lava la cara.</span></li>
<li><b>Recíproco</b>: <span class="ej">Juan y Paco se saludaron.</span></li>
<li><b>Variante de le</b> (CI ante lo, la): <span class="ej">Se lo di.</span></li>
<li><b>Pronominal</b> (parte del verbo, sin función): <span class="ej">Se arrepintió.</span></li>
<li><b>Aspectual o intensificador</b>: <span class="ej">Se comió toda la tarta.</span></li>
<li><b>Pasiva refleja</b> (el verbo concuerda con el sujeto): <span class="ej">Se venden pisos.</span></li>
<li><b>Impersonal</b> (sin sujeto, 3.ª persona del singular): <span class="ej">Aquí se vive bien · Se ayuda a los necesitados.</span></li>
</ul>`},
{t:'Funciones sintácticas (lista de la UIB)', h:`
<p>Sujeto · CD · CI · Complemento de medida argumental · Atributo · Atributo locativo · Complemento predicativo · Aposición · CN · CRV · Complemento locativo argumental · Complemento agente · CC (de lugar, tiempo, modo, cantidad, compañía, instrumento, causa, destinatario o beneficiario, finalidad, materia).</p>
<h4>Pruebas rápidas</h4>
<ul>
<li><b>CD</b>: se sustituye por <i>lo, la, los, las</i> y pasa a sujeto en pasiva.</li>
<li><b>CI</b>: se sustituye por <i>le, les</i>.</li>
<li><b>Atributo</b>: con <i>ser, estar, parecer</i>; se sustituye por <i>lo</i>.</li>
<li><b>Predicativo</b>: con verbo predicativo, concuerda con el sujeto o el CD.</li>
<li><b>CRV</b>: preposición exigida por el verbo (<i>hablar de, confiar en</i>).</li>
<li><b>Locativo argumental</b>: lugar exigido por el verbo (<i>vivir en, ir a</i>).</li>
</ul>`},
{t:'Formación de palabras', h:`
<ul>
<li><b>Derivadas</b>: lexema + afijos. Prefijación (<i>con-ciudadano</i>), sufijación (<i>capac-idad</i>) o ambas sin ser parasintéticas (<i>in-capac-idad</i>, porque existen <i>incapaz</i> y <i>capacidad</i>).</li>
<li><b>Compuestas</b>: dos o más lexemas (<i>sacacorchos, agridulce, bocacalle</i>).</li>
<li><b>Parasintéticas</b>: prefijo + lexema + sufijo a la vez, sin que existan las formas intermedias (<i>envejecer, anochecer</i>), o composición + derivación (<i>picapedrero</i>).</li>
<li><b>Siglas</b> (iniciales: <i>ONU, DNI</i>) y <b>acrónimos</b> (fragmentos: <i>Mercosur</i>).</li>
</ul>`}
];

  contexto:`<p>Antonio Machado (Sevilla, 1875 - Colliure, 1939) es el gran poeta de la <b>generación del 98</b>. Tras un primer libro de raíz modernista y simbolista e intimista (<i>Soledades</i>, 1903; <i>Soledades. Galerías. Otros poemas</i>, 1907), publica <i>Campos de Castilla</i> (1912), donde canta el paisaje, la gente y la historia de Castilla.</p>
<p>El fin de siglo en España está marcado por el <b>Desastre del 98</b>, la crisis del sistema de la Restauración y la conflictividad social. Los autores del 98 (Unamuno, Azorín, Baroja, Maeztu y Machado), herederos del regeneracionismo, reflexionan sobre el «problema de España», la angustia existencial y Dios. Machado, formado en la Institución Libre de Enseñanza, se aleja del esteticismo modernista hacia una poesía sobria y honda: «la poesía es la palabra esencial en el tiempo».</p>
<p><b>«Retrato»</b> abre <i>Campos de Castilla</i> y funciona como presentación del poeta y de su poética. <b>«A José María Palacio»</b> (fechado en Baeza el 29 de abril de 1913) se incorpora a la edición de 1917: tras la muerte de su esposa Leonor (1912), Machado se traslada a Baeza y escribe a su amigo de Soria.</p>`,

`Mi infancia son recuerdos de un patio de Sevilla,
y un huerto claro donde madura el limonero;
mi juventud, veinte años en tierras de Castilla;
mi historia, algunos casos que recordar no quiero.

Ni un seductor Mañara, ni un Bradomín he sido
—ya conocéis mi torpe aliño indumentario—,
mas recibí la flecha que me asignó Cupido,
y amé cuanto ellas puedan tener de hospitalario.

Hay en mis venas gotas de sangre jacobina,
pero mi verso brota de manantial sereno;
y, más que un hombre al uso que sabe su doctrina,
soy, en el buen sentido de la palabra, bueno.

Adoro la hermosura, y en la moderna estética
corté las viejas rosas del huerto de Ronsard;
mas no amo los afeites de la actual cosmética,
ni soy un ave de esas del nuevo gay-trinar.

Desdeño las romanzas de los tenores huecos
y el coro de los grillos que cantan a la luna.
A distinguir me paro las voces de los ecos,
y escucho solamente, entre las voces, una.

¿Soy clásico o romántico? No sé. Dejar quisiera
mi verso, como deja el capitán su espada:
famosa por la mano viril que la blandiera,
no por el docto oficio del forjador preciada.

Converso con el hombre que siempre va conmigo
—quien habla solo espera hablar a Dios un día—;
mi soliloquio es plática con este buen amigo
que me enseñó el secreto de la filantropía.

Y al cabo, nada os debo; debéisme cuanto he escrito.
A mi trabajo acudo, con mi dinero pago
el traje que me cubre y la mansión que habito,
el pan que me alimenta y el lecho donde yago.

Y cuando llegue el día del último vïaje,
y esté al partir la nave que nunca ha de tornar,
me encontraréis a bordo ligero de equipaje,
casi desnudo, como los hijos de la mar.`,
 a:'El poema «Retrato» es de Antonio Machado y abre su poemario <i>Campos de Castilla</i> (1912), adscrito a la generación del 98. [Contexto: Desastre del 98, crisis de la Restauración, regeneracionismo; autores del 98 y sus temas: España, la angustia existencial y Dios.] Con este autorretrato, siguiendo una moda de la época, Machado presenta sus señas de identidad y su estilo y anuncia el abandono del subjetivismo sentimental de <i>Soledades</i> para cantar el alma de Castilla.',
 b:'El tema es un autorretrato sereno, lúcido y sincero de un hombre «en el buen sentido de la palabra, bueno». Los temas se agrupan en tres bloques. <b>La persona</b> (estrofas 1-3): su historia («Mi infancia son recuerdos de un patio de Sevilla»), el amor, pese a no ser un donjuán («mas recibí la flecha que me asignó Cupido»), y su carácter, que templa la herencia revolucionaria («gotas de sangre jacobina») con la serenidad («manantial sereno»). <b>La poética</b> (estrofas 4-6): rechazo del modernismo vacío («no amo los afeites de la actual cosmética», «tenores huecos») y búsqueda de una voz propia («escucho solamente, entre las voces, una»); quiere que su verso valga por lo que dice, no por quién lo escribe (símil del capitán y la espada). <b>La actitud ante la vida</b> (estrofas 7-9): la soledad reflexiva («Converso con el hombre que siempre va conmigo»), la independencia («nada os debo») y la serenidad ante la muerte («ligero de equipaje»).',
 c:'El poema consta de 36 versos en nueve serventesios de alejandrinos (14A 14B 14A 14B) con rima consonante y cesura que divide cada verso en hemistiquios de 7 + 7; es una estrofa de herencia modernista que Machado pone al servicio de la intimidad. Se mantienen símbolos de su etapa anterior (huerto, rosas, aves, espada, la nave del «último vïaje»), pero la sencillez, la claridad y la intensa subjetividad lo vinculan al 98. Destaca el «adjetivo definidor», muy connotativo («huerto claro», «sangre jacobina», «tenores huecos», «docto oficio»); las metáforas («los afeites de la actual cosmética», «el coro de los grillos que cantan a la luna»); los símiles («como deja el capitán su espada», «como los hijos de la mar»); la anáfora y el paralelismo («Mi infancia… mi juventud… mi historia»; «el traje que me cubre… el pan que me alimenta…»); la elipsis verbal de los versos 3-4; la antítesis con los donjuanes Mañara y Bradomín; la bimembración y el hipérbaton («A distinguir me paro las voces de los ecos»). La diéresis de «vïaje» ajusta la medida. El resultado es un lenguaje sobrio y antirretórico, uno de los textos más representativos del 98.'
},
{id:'palacio', ref:'«A José María Palacio» (Campos de Castilla, ed. 1917)', tipo:'verso', titulo:'A José María Palacio', texto:
`Palacio, buen amigo,
¿está la primavera
vistiendo ya las ramas de los chopos
del río y los caminos? En la estepa
del alto Duero, Primavera tarda,
¡pero es tan bella y dulce cuando llega!...
¿Tienen los viejos olmos
algunas hojas nuevas?
Aún las acacias estarán desnudas
y nevados los montes de las sierras.
¡Oh mole del Moncayo blanca y rosa,
allá, en el cielo de Aragón, tan bella!
¿Hay zarzas florecidas
entre las grises peñas,
y blancas margaritas
entre la fina hierba?
Por esos campanarios
ya habrán ido llegando las cigüeñas.
Habrá trigales verdes,
y mulas pardas en las sementeras,
y labriegos que siembran los tardíos
con las lluvias de abril. Ya las abejas
libarán del tomillo y el romero.
¿Hay ciruelos en flor? ¿Quedan violetas?
Furtivos cazadores, los reclamos
de la perdiz bajo las capas luengas,
no faltarán. Palacio, buen amigo,
¿tienen ya ruiseñores las riberas?
Con los primeros lirios
y las primeras rosas de las huertas,
en una tarde azul, sube al Espino,
al alto Espino donde está su tierra...

Baeza, 29 de abril de 1913.`,
 a:'El poema es «A José María Palacio», de Antonio Machado, incluido en la edición de 1917 de <i>Campos de Castilla</i>. [Contexto del 98 y de Machado.] Está fechado en Baeza en 1913: tras la muerte de su esposa Leonor en Soria (1912), el poeta se traslada a Andalucía y escribe a su amigo soriano José María Palacio. El poema pertenece al ciclo de poemas a Leonor y al paisaje de Soria de <i>Campos de Castilla</i>.',
 b:'El tema es el recuerdo de la primavera soriana desde la distancia, que encubre el dolor por la muerte de Leonor. El poeta pregunta a su amigo, con una sucesión de interrogaciones, si ha llegado ya la primavera al alto Duero («¿está la primavera / vistiendo ya las ramas de los chopos…?»), y reconstruye de memoria el paisaje: los olmos, el Moncayo, las cigüeñas, los trigales, los labriegos. Junto al <b>paisaje castellano</b>, aparecen la <b>amistad</b> («Palacio, buen amigo», repetido), el <b>tiempo</b> como ciclo natural que se renueva («hojas nuevas», «primeros lirios») y, al final, el <b>amor y la muerte</b>: el encargo de subir flores «al alto Espino donde está su tierra» alude, sin nombrarla, a la tumba de Leonor. El contraste entre la vida que renace y la pérdida irreparable da al poema su emoción contenida.',
 c:'Es una silva arromanzada: combina heptasílabos y endecasílabos con rima asonante é-a en los versos pares (primavera, estepa, llega, nuevas…). Tiene forma de epístola poética, con el vocativo «Palacio, buen amigo» al principio y en el centro. Predominan las interrogaciones retóricas, que expresan nostalgia y ansiedad, y las enumeraciones de elementos sencillos del paisaje, típicas del primitivismo del 98. La adjetivación es sobria y precisa («viejos olmos», «grises peñas», «fina hierba», «mulas pardas», «tarde azul»), con epítetos como «blancas margaritas». Hay personificaciones («la primavera / vistiendo ya las ramas», «Primavera tarda»), exclamaciones («¡Oh mole del Moncayo blanca y rosa…!»), el futuro de probabilidad («habrán ido llegando», «Habrá trigales», «libarán»), que muestra que el poeta imagina lo que no puede ver, anáforas («Con los primeros lirios / y las primeras rosas») y una elipsis final cargada de emoción, reforzada por los puntos suspensivos. El paisaje castellano subjetivado, el intimismo y la sencillez antirretórica son rasgos del 98.'
}
  ],
  pasajes:['«Retrato»: cualquiera de sus estrofas (en la PAU puede aparecer completo o parcial).','«A José María Palacio»: el poema completo.']

  contexto:`<p>El teatro español del primer tercio del siglo XX tiene dos vertientes. El <b>teatro comercial</b> responde al gusto del público: la comedia burguesa de Jacinto Benavente (<i>Los intereses creados</i>, 1907; Nobel en 1922), el teatro poético de Eduardo Marquina y el teatro cómico de Carlos Arniches (tragicomedia grotesca) o Pedro Muñoz Seca (astracán). El <b>teatro renovador o anticomercial</b>, de escasa repercusión, es más innovador: Unamuno, Jacinto Grau, Azorín y, sobre todo, <b>Valle-Inclán</b> y, más tarde, Lorca.</p>
<p>Ramón María del Valle-Inclán (Villanueva de Arosa, 1866 - Santiago, 1936) participó en la bohemia madrileña, donde conoció a Alejandro Sawa, modelo de Max Estrella. Su teatro evoluciona en tres ciclos: <b>mítico</b>, <b>de la farsa</b> y <b>del esperpento</b>. <i>Luces de bohemia</i> (1920 en la revista <i>España</i>; versión definitiva, 1924) inaugura el esperpento: una deformación sistemática y grotesca de la realidad para mostrar lo absurdo y miserable de la vida española. Recibe influencias del expresionismo y de Goya. Se estrenó en París en 1963 y en España en 1970.</p>`,
  argumento:'La obra narra en quince escenas la última noche de Max Estrella, poeta ciego y fracasado, por un Madrid «absurdo, brillante y hambriento». Acompañado del falso amigo Don Latino de Híspalis, Max recorre la librería de Zaratustra, la taberna de Pica Lagartos, la calle con los jóvenes modernistas, el calabozo (donde conoce a un preso obrero catalán que será asesinado con la «ley de fugas»), la redacción de un periódico, el Ministerio de la Gobernación, el café con Rubén Darío y los encuentros con prostitutas. En la escena XII, tras formular la teoría del esperpento, muere en el portal de su casa; Don Latino le roba la cartera con un décimo de lotería que resulta premiado. En la escena final se conoce el suicidio de su mujer y su hija.',

{id:'luces12', ref:'Escena duodécima', tipo:'teatro', texto:
`MAX.— Los ultraístas son unos farsantes. El esperpentismo lo ha inventado Goya. Los héroes clásicos han ido a pasearse en el callejón del Gato.
DON LATINO.— ¡Estás completamente curda!
MAX.— Los héroes clásicos reflejados en los espejos cóncavos dan el Esperpento. El sentido trágico de la vida española sólo puede darse con una estética sistemáticamente deformada.
DON LATINO.— ¡Miau! ¡Te estás contagiando!
MAX.— España es una deformación grotesca de la civilización europea.
DON LATINO.— ¡Pudiera! Yo me inhibo.
MAX.— Las imágenes más bellas en un espejo cóncavo son absurdas.
DON LATINO.— Conforme. Pero a mí me divierte mirarme en los espejos de la calle del Gato.
MAX.— Y a mí. La deformación deja de serlo cuando está sujeta a una matemática perfecta. Mi estética actual es transformar con matemática de espejo cóncavo las normas clásicas.
DON LATINO.— ¿Y dónde está el espejo?
MAX.— En el fondo del vaso.
DON LATINO.— ¡Eres genial! ¡Me quito el cráneo!
MAX.— Latino, deformemos la expresión en el mismo espejo que nos deforma las caras y toda la vida miserable de España.
DON LATINO.— Nos mudaremos al callejón del Gato.`,
 a:'El fragmento pertenece a <i>Luces de bohemia</i> (1920; versión definitiva de 1924), de Ramón María del Valle-Inclán. [Contexto: teatro comercial y anticomercial del primer tercio del siglo XX; ciclos del teatro de Valle-Inclán.] La obra inaugura el ciclo del esperpento. Esta es la escena XII: de madrugada, en el portal de su casa, Max Estrella, ya moribundo, expone a Don Latino su teoría del esperpento poco antes de morir.',
 b:'El tema central es la definición del <b>esperpento</b> como forma de representar la realidad española. Max afirma que «Los héroes clásicos reflejados en los espejos cóncavos dan el Esperpento»: la deformación es la única forma de mostrar «el sentido trágico de la vida española». De ahí se deriva la <b>crítica a España</b>, «una deformación grotesca de la civilización europea», y a «toda la vida miserable de España». La deformación no es arbitraria, sino que obedece a una «matemática perfecta». Aparecen también la <b>crítica literaria</b> (los ultraístas son «unos farsantes» y el precursor es Goya) y la relación entre Max y Don Latino, entre la lucidez trágica del poeta y la vulgaridad burlona de su acompañante («¡Estás completamente curda!»).',
 c:'El fragmento muestra los rasgos del esperpento. La metáfora central del espejo cóncavo del callejón del Gato resume la estética de la obra: transformar «con matemática de espejo cóncavo las normas clásicas». El diálogo es ágil, con réplicas breves que contraponen el registro culto y reflexivo de Max («La deformación deja de serlo cuando está sujeta a una matemática perfecta») y el registro coloquial y vulgar de Don Latino («curda», «¡Miau!», «¡Me quito el cráneo!», deformación humorística de «me quito el sombrero»). Este contraste entre lo trágico y lo grotesco es la base del esperpento. Hay ironía (el espejo está «en el fondo del vaso», es decir, en el alcohol), exclamaciones e intertextualidad (Goya, los ultraístas). La propia obra se convierte en metateatro: Max formula la estética que Valle-Inclán aplica en <i>Luces de bohemia</i>, influida por el expresionismo vanguardista.'
},
{id:'luces4', ref:'Escena cuarta (fragmento del modelo PAU 2027)', tipo:'teatro', texto:
`PÉREZ.— ¿Se ha hecho usted crítico de teatros, Don Max?
DORIO DE GADEX.— ¡Calla, Pérez!
DON LATINO.— Aquí sólo hablan los genios.
MAX.— Yo me siento pueblo. Yo había nacido para ser tribuno de la plebe y me acanallé perpetrando traducciones y haciendo versos. ¡Eso sí, mejores que los hacéis los modernistas!
DORIO DE GADEX.— Maestro, preséntese usted a un sillón de la Academia.
MAX.— No lo digas en burla, idiota. ¡Me sobran méritos! Pero esa prensa miserable me boicotea. Odian mi rebeldía y odian mi talento. Para medrar hay que ser agradador de todos los Segismundos. ¡El Buey Apis me despide como a un criado! ¡La Academia me ignora! ¡Y soy el primer poeta de España! ¡El primero! ¡El primero! ¡Y ayuno! ¡Y no me humillo pidiendo limosna! ¡Y no me parte un rayo! ¡Yo soy el verdadero inmortal y no esos cabrones del cotarro académico! ¡Muera Maura!
LOS MODERNISTAS.— ¡Muera! ¡Muera! ¡Muera!
CLARINITO.— Maestro, nosotros los jóvenes impondremos la candidatura de usted para un sillón de la Academia.`,
 a:'El fragmento pertenece a <i>Luces de bohemia</i>, de Valle-Inclán (1920; versión definitiva, 1924), obra que inaugura el esperpento. [Contexto del teatro del primer tercio del siglo XX.] En esta escena, Max Estrella y Don Latino se encuentran de noche en la calle con un grupo de jóvenes poetas modernistas (Dorio de Gadex, Clarinito, Pérez); poco después, los gritos de la pandilla provocarán la detención de Max.',
 b:'El tema es la <b>rebeldía y el resentimiento del artista fracasado</b> frente a una sociedad que lo margina. Max se presenta como víctima de las instituciones culturales y del poder: «esa prensa miserable me boicotea», «¡El Buey Apis me despide como a un criado! ¡La Academia me ignora!». Denuncia que para triunfar hay que adular a los poderosos («Para medrar hay que ser agradador de todos los Segismundos»). Aparecen también la <b>miseria y el hambre</b> del poeta («¡Y ayuno!»), su <b>dignidad orgullosa</b> («¡Y no me humillo pidiendo limosna!») y su conciencia social («Yo me siento pueblo»), junto a la <b>crítica a la bohemia modernista</b>, cuyos jóvenes poetas aparecen como una pandilla ridícula que corea sin pensar («¡Muera! ¡Muera! ¡Muera!») y se burla de él. El grito «¡Muera Maura!» introduce la crítica política.',
 c:'Se aprecian los rasgos del esperpento: el contraste entre la grandeza trágica de Max («¡Y soy el primer poeta de España!») y lo grotesco de la situación (un poeta ciego y hambriento rodeado de jóvenes que lo jalean). La variedad de registros es notable: el lenguaje culto e irónico («me acanallé perpetrando traducciones», «tribuno de la plebe»), las alusiones literarias y mitológicas (los «Segismundos» de <i>La vida es sueño</i>; el «Buey Apis», dios egipcio que designa a un director de periódico) y el registro vulgar e insultante («idiota», «esos cabrones del cotarro académico»). Destacan la exclamación y la anáfora en el monólogo de Max («¡Y ayuno! ¡Y no me humillo…! ¡Y no me parte un rayo!»), la repetición enfática («¡El primero! ¡El primero!») y la gradación, que expresan su exaltación. El diálogo es ágil y el personaje colectivo de los modernistas funciona como un coro paródico, rasgo de la deformación caricaturesca de Valle-Inclán.'
}

{
  id:'bernarda', t:'La casa de Bernarda Alba', a:'Federico García Lorca', g:'Teatro', y:1936, fecha:'1936 (estrenada en Buenos Aires en 1945)',
  mov:'Generación del 27 · drama rural / tragedia', libre:true, c:'#0E7490',
  contexto:`<p>Federico García Lorca (Fuente Vaqueros, 1898 - Víznar, 1936) pertenece a la <b>generación del 27</b>, grupo que reunió tradición y vanguardia. Además de poeta, fue el gran renovador del teatro español junto a Valle-Inclán: dirigió el teatro universitario <b>La Barraca</b>, que llevó los clásicos a los pueblos, y cultivó farsas, «teatro imposible» de raíz surrealista (<i>El público</i>) y tragedias rurales (<i>Bodas de sangre</i>, 1933; <i>Yerma</i>, 1934).</p>
<p><i>La casa de Bernarda Alba</i>, terminada en junio de 1936, poco antes de su asesinato, lleva el subtítulo de «Drama de mujeres en los pueblos de España». El autor advierte que sus tres actos «tienen la intención de un documental fotográfico»: es su obra más realista, aunque está llena de símbolos. Se estrenó en Buenos Aires en 1945.</p>`,
  argumento:'Tras la muerte de su segundo marido, Bernarda impone a sus cinco hijas ocho años de luto encerradas en casa. Angustias, la mayor y la única con fortuna (es hija del primer marido), se compromete con Pepe el Romano, que en realidad busca su dinero y se ve a escondidas con Adela, la menor. Martirio, también enamorada de Pepe, vigila a su hermana. La Poncia advierte a Bernarda, que no quiere ver. Una noche, Martirio descubre a Adela con Pepe; Bernarda dispara contra él y Martirio dice que lo ha matado. Adela, creyéndolo muerto, se ahorca. Bernarda ordena silencio y que se diga que su hija ha muerto virgen.',
  temas:[
    ['Autoridad frente a libertad','Bernarda impone un poder tiránico (el bastón); Adela representa el deseo de libertad.'],
    ['La honra y las apariencias','Lo que importa es el «qué dirán»: «¡Mi hija ha muerto virgen!».'],
    ['La represión de la mujer y del deseo','Encierro, luto y matrimonio como destino; frustración sexual de las hijas.'],
    ['Envidia, odio y rivalidad','Entre las hermanas, sobre todo Martirio y Adela.'],
    ['Las diferencias sociales','Bernarda desprecia a los pobres («Los pobres son como los animales»).'],
    ['La muerte','Abre y cierra la obra: el entierro del padre y el suicidio de Adela.']
  ],
  rasgos:[

    ['Símbolos','Bastón (autoridad), blanco y negro (encierro y luto) frente al verde de Adela (vida, rebeldía), agua y mar (libertad), caballo garañón (deseo), calor, muros.'],

  personajes:[['Bernarda','60 años. Autoritaria, obsesionada con la honra; su bastón es símbolo de poder.'],['Adela','20 años. La menor, rebelde y apasionada; se enfrenta a su madre.'],['Martirio','24 años. Enferma y resentida; ama en secreto a Pepe.'],['Angustias','39 años. Hija del primer marido y heredera; prometida de Pepe.'],['Magdalena y Amelia','30 y 27 años. Resignadas y sumisas.'],['La Poncia','Criada, voz del sentido común y del pueblo.'],['María Josefa','Madre de Bernarda; su locura dice la verdad del deseo de libertad.']],

{id:'bernarda1', ref:'Acto primero', tipo:'teatro', texto:
`BERNARDA.— (Arrojando el abanico al suelo.) ¿Es éste el abanico que se da a una viuda? Dame uno negro y aprende a respetar el luto de tu padre.
MARTIRIO.— Tome usted el mío.
BERNARDA.— ¿Y tú?
MARTIRIO.— Yo no tengo calor.
BERNARDA.— Pues busca otro, que te hará falta. En ocho años que dure el luto no ha de entrar en esta casa el viento de la calle. Haceros cuenta que hemos tapiado con ladrillos puertas y ventanas. Así pasó en casa de mi padre y en casa de mi abuelo. Mientras, podéis empezar a bordaros el ajuar. En el arca tengo veinte piezas de hilo con el que podréis cortar sábanas y embozos. Magdalena puede bordarlas.
MAGDALENA.— Lo mismo me da.
ADELA.— (Agria.) Si no queréis bordarlas irán sin bordados. Así las tuyas lucirán más.
MAGDALENA.— Ni las mías ni las vuestras. Sé que yo no me voy a casar. Prefiero llevar sacos al molino. Todo menos estar sentada días y días dentro de esta sala oscura.
BERNARDA.— Eso tiene ser mujer.
MAGDALENA.— Malditas sean las mujeres.
BERNARDA.— Aquí se hace lo que yo mando. Ya no puedes ir con el cuento a tu padre. Hilo y aguja para las hembras. Látigo y mula para el varón. Eso tiene la gente que nace con posibles.`,
 a:'El fragmento pertenece a <i>La casa de Bernarda Alba</i> (1936), de Federico García Lorca, poeta y dramaturgo de la generación del 27. [Contexto: tradición y vanguardia del 27; Lorca como renovador teatral: La Barraca, farsas, teatro imposible y tragedias rurales.] Es su última obra, «drama de mujeres en los pueblos de España». La escena se sitúa en el acto primero, tras el entierro del segundo marido de Bernarda, cuando esta impone a sus hijas el luto.',
 b:'El tema es la <b>imposición del luto y del encierro</b> por parte de Bernarda, que anuncia el conflicto central de la obra: la <b>autoridad frente a la libertad</b>. Bernarda decreta que «En ocho años que dure el luto no ha de entrar en esta casa el viento de la calle» y lo justifica por la tradición familiar («Así pasó en casa de mi padre y en casa de mi abuelo»). Aparece la <b>represión y el destino de la mujer</b>: las hijas solo pueden bordar su ajuar a la espera de un matrimonio improbable («Sé que yo no me voy a casar»), mientras el hombre goza de libertad («Hilo y aguja para las hembras. Látigo y mula para el varón»). La frustración estalla en Magdalena («Malditas sean las mujeres») y la rivalidad entre las hermanas asoma en la agresividad de Adela. También se ve la importancia de las <b>apariencias</b> (el abanico negro) y de la <b>clase social</b> («la gente que nace con posibles»).',
 c:'El diálogo es ágil, con réplicas breves y frases sentenciosas, casi refranes, propias del habla popular: «Hilo y aguja para las hembras. Látigo y mula para el varón», con estructura paralelística y bimembre. Abundan los imperativos y las oraciones enunciativas rotundas de Bernarda («Aquí se hace lo que yo mando»), que muestran su autoridad, frente a las interrogaciones y quejas de las hijas. Hay hipérboles («hemos tapiado con ladrillos puertas y ventanas») y metáforas («el viento de la calle» = el mundo exterior, la libertad). Los símbolos lorquianos son evidentes: el color negro del luto frente al abanico de flores rojas y verdes de Amelia, el calor, el encierro y la «sala oscura». Las acotaciones (<i>Arrojando el abanico al suelo</i>, <i>Agria</i>) caracterizan a los personajes. Todo ello responde al realismo poético con el que Lorca quiso hacer un «documental fotográfico» sin renunciar a la carga simbólica.'
},
{id:'bernarda3', ref:'Acto tercero (desenlace)', tipo:'teatro', texto:
`ADELA.— (Haciéndole frente.) ¡Aquí se acabaron las voces de presidio! (Adela arrebata un bastón a su madre y lo parte en dos.) Esto hago yo con la vara de la dominadora. No dé usted un paso más. ¡En mí no manda nadie más que Pepe!
(Sale MAGDALENA.)
MAGDALENA.— ¡Adela!
(Salen LA PONCIA y ANGUSTIAS.)
ADELA.— Yo soy su mujer. (A ANGUSTIAS.) Entérate tú y ve al corral a decírselo. Él dominará toda esta casa. Ahí fuera está, respirando como si fuera un león.
ANGUSTIAS.— ¡Dios mío!
BERNARDA.— ¡La escopeta! ¿Dónde está la escopeta? (Sale corriendo.)
(Aparece AMELIA por el fondo, que mira aterrada, con la cabeza sobre la pared. Sale detrás MARTIRIO.)
ADELA.— ¡Nadie podrá conmigo! (Va a salir.)
ANGUSTIAS.— (Sujetándola.) De aquí no sales con tu cuerpo en triunfo, ¡ladrona!, ¡deshonra de nuestra casa!
MAGDALENA.— ¡Déjala que se vaya donde no la veamos nunca más!
(Suena un disparo.)
BERNARDA.— (Entrando.) Atrévete a buscarlo ahora.
MARTIRIO.— (Entrando.) Se acabó Pepe el Romano.
ADELA.— ¡Pepe! ¡Dios mío! ¡Pepe! (Sale corriendo.)`,
 a:'El fragmento pertenece a <i>La casa de Bernarda Alba</i> (1936), de Federico García Lorca. [Contexto del 27 y del teatro de Lorca.] Corresponde al clímax del acto tercero: Martirio ha descubierto a Adela con Pepe el Romano en el corral y ha despertado a su madre; Adela se rebela abiertamente, poco antes de su suicidio, que cerrará la obra.',
 b:'El tema es la <b>rebelión de Adela contra la autoridad de su madre</b>, el enfrentamiento definitivo entre la libertad y la tiranía. Adela rompe el bastón, símbolo del poder de Bernarda («Esto hago yo con la vara de la dominadora»), rechaza la casa como cárcel («¡Aquí se acabaron las voces de presidio!») y proclama su pasión («¡En mí no manda nadie más que Pepe!»). Aparecen también la <b>pasión y el deseo</b> (Pepe «respirando como si fuera un león»), la <b>honra</b> («¡deshonra de nuestra casa!»), el <b>odio y la envidia entre hermanas</b> (Angustias la llama «ladrona»; Martirio miente: «Se acabó Pepe el Romano») y el anuncio de la <b>muerte</b> con el disparo.',
 c:'El ritmo es trepidante: réplicas muy breves, exclamaciones e interrogaciones que reflejan la tensión dramática del clímax. Las acotaciones son abundantes y funcionales: indican movimientos rápidos de entrada y salida, gestos simbólicos (<i>arrebata un bastón a su madre y lo parte en dos</i>) y efectos sonoros (<i>Suena un disparo</i>). El símbolo del bastón y la comparación animal de Pepe con un león (fuerza, deseo, como el caballo garañón) son característicos del realismo poético de Lorca. Hay metáforas («voces de presidio»), insultos y vocativos que expresan la violencia contenida, y el personaje ausente de Pepe domina la escena sin aparecer. La tragedia se precipita: el engaño de Martirio provocará el suicidio de Adela, y Bernarda cerrará con su exigencia de silencio para salvar las apariencias.'
}
  ],

  mov:'Generación del 27 · poesía amorosa de plenitud', libre:false, c:'#0E9C7E',
  contexto:`<p>Pedro Salinas (Madrid, 1891 - Boston, 1951) publicó <i>La voz a ti debida</i> en <b>1933</b>. El título procede de un verso de la <b>Égloga III de Garcilaso de la Vega</b>. El libro es un único poema amoroso de unos <b>2460 versos</b>. El fragmento «¡Qué gran víspera el mundo!» corresponde a los versos 425-493, así que se sitúa en el <b>planteamiento</b> de la historia amorosa.</p>
<p>La obra de Salinas se divide en tres etapas:</p>
<ul><li><b>Etapa inicial.</b> Sigue el magisterio de Juan Ramón Jiménez y cultiva una <b>poesía pura</b>, depurada y con ecos futuristas.</li>
<li><b>Etapa de plenitud.</b> Mantiene ese estilo depurado en la forma y en el contenido, y escribe la <b>trilogía del amor</b>: <i>La voz a ti debida</i> (1933), <i>Razón de amor</i> (1936) y <i>Largo lamento</i>.</li>
<li><b>Etapa final (posguerra y exilio).</b> Abandona el optimismo y el intimismo para tratar la realidad trágica del hombre contemporáneo. Por ejemplo, el poema «Cero» trata la bomba atómica.</li></ul>
<p>Salinas pertenece a la <b>Generación del 27</b>. El grupo se reunió en el Ateneo de Sevilla en 1927 para conmemorar el tercer centenario de la muerte de <b>Góngora</b>. Sus autores representan la <b>Edad de Plata</b> y mezclan <b>tradición y vanguardia</b>:</p>
<ul><li>veneran a los clásicos (Garcilaso, fray Luis de León, san Juan de la Cruz, Góngora);</li>
<li>se interesan por lo popular (cancioneros y romanceros);</li>
<li>reciben el influjo de las vanguardias europeas.</li></ul>
<p>La Guerra Civil disolvió el grupo, y Salinas murió en el exilio estadounidense.</p>`,
  argumento:'Fragmento del planteamiento de La voz a ti debida. El poeta imagina el mundo antes del amor como una «víspera»: todo estaba sin hacer y sin nombre (las minas vacías, las ciudades sin sitio, los verbos indecisos), y todo espera la orden de la amada para empezar a existir. Al final, el propio «yo» también espera, «por nacer», a que ella lo quiera y le diga: «Ya».',

    b:'El tema central es el amor como fuerza creadora: el mundo es una «víspera» vacía, sin nombre, que espera la orden de la amada para existir («su impulso / se lo darías tú»). Ligado a él aparecen varios temas secundarios. El primero es la espera y la esperanza: el presente se vive como anticipación de algo trascendental, y por eso abundan los imperfectos y condicionales de lo que «iba a» suceder. También aparece la percepción subjetiva del tiempo, ya que el pasado «era nuestro» y puede llamarse «estrella, / colibrí, teorema». Otro tema es la belleza latente del mundo, que solo el amor saca a la luz («de cobre, de amapolas»). Por último, está la dependencia del yo respecto del tú: el poeta, «vacante» y «por nacer», espera que ella le diga «Ya». La visión es optimista y une la experiencia amorosa individual con un gozo universal.',
    c:'El fragmento muestra los rasgos de Salinas y del 27:<ul><li><b>Verso libre.</b> Usa versos sin rima de base heptasilábica, cuyo ritmo interno nace de las repeticiones, del contraste entre versos y de los encabalgamientos («esperaban que tú / les dijeses»). Esto da un tono conversacional e introspectivo.</li><li><b>Enumeraciones negativas.</b> Construyen el mundo por lo que aún no es («Ni materia, ni números, / ni astros, ni siglos,… nada»).</li><li><b>Personificación y símil.</b> Los verbos miran a la amada «como los perros fieles».</li><li><b>Exclamaciones e interrogaciones retóricas.</b> Expresan asombro y duda («¿Subir?»).</li><li><b>Símbolos.</b> «Víspera» y «mundo» oscilan entre lo tangible y lo metafísico.</li></ul>El léxico es sencillo, pero el tratamiento es intelectual. Así, Salinas une la renovación vanguardista (verso libre, depuración) con una concepción clásica del amor que enlaza con el amor cortés, Petrarca y Garcilaso.'},

  contexto:`<p>Federico García Lorca pertenece a la <b>generación del 27</b>, grupo que se dio a conocer en 1927 en el Ateneo de Sevilla en el homenaje a Góngora por el tercer centenario de su muerte. Sus miembros, representantes de la <b>Edad de Plata</b>, mezclan tradición y vanguardia: admiran a Góngora, San Juan de la Cruz y Fray Luis, pero también los cancioneros y el romancero popular, y reciben el influjo de las vanguardias. La Guerra Civil dispersó al grupo.</p>
<p>El <i>Romancero gitano</i> (Revista de Occidente, 1928) reúne dieciocho romances que reivindican la tradición y el mundo andaluz a través del pueblo gitano. Pertenece a la primera etapa del 27, la del <b>neopopularismo</b> (recuperación de metros y estrofas tradicionales). «Romance de la luna, luna», dedicado a su hermana Conchita, abre el libro e introduce el símbolo lorquiano por excelencia: la luna.</p>`,
  argumento:'La luna llega a la fragua y danza ante un niño que la mira fascinado. El niño le pide que huya antes de que lleguen los gitanos, pero la luna le anuncia que lo encontrarán muerto sobre el yunque. Un jinete se acerca; los gitanos vienen por el olivar; la luna se lleva al niño de la mano al cielo, y los gitanos lloran dentro de la fragua mientras el aire vela al niño.',

  frags:[
{id:'luna1', ref:'Romancero gitano, poema 1', tipo:'verso', titulo:'Romance de la luna, luna', texto:
`La luna vino a la fragua
con su polisón de nardos.
El niño la mira mira.
El niño la está mirando.
En el aire conmovido
mueve la luna sus brazos
y enseña, lúbrica y pura,
sus senos de duro estaño.
Huye luna, luna, luna.
Si vinieran los gitanos,
harían con tu corazón
collares y anillos blancos.
Niño, déjame que baile.
Cuando vengan los gitanos,
te encontrarán sobre el yunque
con los ojillos cerrados.
Huye luna, luna, luna,
que ya siento sus caballos.
Niño, déjame, no pises
mi blancor almidonado.

El jinete se acercaba
tocando el tambor del llano.
Dentro de la fragua el niño
tiene los ojos cerrados.
Por el olivar venían,
bronce y sueño, los gitanos.
Las cabezas levantadas
y los ojos entornados.

Cómo canta la zumaya,
¡ay cómo canta en el árbol!
Por el cielo va la luna
con un niño de la mano.

Dentro de la fragua lloran,
dando gritos, los gitanos.
El aire la vela, vela.
El aire la está velando.`,
 a:'El autor es Federico García Lorca, poeta y dramaturgo de la generación del 27. [Contexto del 27: homenaje a Góngora en 1927, Edad de Plata, tradición y vanguardia, disolución con la Guerra Civil.] El poema abre el <i>Romancero gitano</i> (1928), dieciocho romances que reivindican el mundo andaluz a través del pueblo gitano, dentro de la etapa neopopularista. Está dedicado a su hermana Conchita e introduce la luna, el símbolo predilecto de Lorca.',
 b:'El tema principal es la <b>muerte de un niño inocente</b>, simbolizada por la luna. El poema narra cómo la luna, personificada como una mujer gitana que baila («mueve la luna sus brazos / y enseña, lúbrica y pura, / sus senos de duro estaño»), seduce al niño, que intenta resistirse («Huye luna, luna, luna»), y le anticipa su final («te encontrarán sobre el yunque / con los ojillos cerrados»). La estructura sigue la historia: en la fragua, la luna y el niño (vv. 1-20); la llegada del jinete y los gitanos (vv. 21-28); la consumación, con la naturaleza como testigo («Por el cielo va la luna / con un niño de la mano», vv. 29-32); y el llanto final de los gitanos (vv. 33-36). Así, los temas son la <b>muerte</b>, la <b>inocencia</b>, el <b>dolor</b> y la <b>naturaleza mitificada</b>.',
 c:'El poema es un <b>romance</b>, composición tradicional por excelencia: 36 versos octosílabos con rima asonante en los pares (nardos, mirando, brazos…). Combina la tirada indeterminada del romancero viejo (los 20 primeros versos) con estrofas más regulares, como las dos cuartetas finales. Como en el romance tradicional, comienza <i>in medias res</i>, mezcla narración y diálogo y deja un final misterioso. Los símbolos son claves: la luna y el jinete representan la muerte; los metales (fragua, yunque, estaño, bronce) se asocian al mundo gitano. Destacan la personificación de la luna y del aire («El aire la vela, vela»), la repetición y el paralelismo («El niño la mira mira. / El niño la está mirando»), la anáfora, el imperativo y el vocativo en el diálogo («Huye», «Niño, déjame»), las metáforas («bronce y sueño, los gitanos», «tocando el tambor del llano») y el eufemismo «con los ojillos cerrados». La síntesis de lo popular y lo culto es la marca del neopopularismo del 27.'
}

  pasajes:['El poema completo.']
},

{
  id:'cernuda', t:'«Donde habite el olvido»', a:'Luis Cernuda', g:'Poesía', y:1934, fecha:'Donde habite el olvido (1934)',
  mov:'Generación del 27 · neorromanticismo y huella surrealista', libre:false, c:'#0E9C7E',
  contexto:`<p>Luis Cernuda (Sevilla, 1902 - México, 1963) pertenece a la <b>generación del 27</b>. Su obra, reunida desde 1936 bajo el título <i>La realidad y el deseo</i>, gira en torno al conflicto entre el deseo de amor, libertad y belleza y una realidad que lo niega. Tras una etapa de poesía pura, asimila el <b>surrealismo</b> (<i>Un río, un amor</i>; <i>Los placeres prohibidos</i>) y después evoluciona hacia una poesía meditativa influida por los románticos ingleses. Vivió en el exilio desde la Guerra Civil.</p>
<p><i>Donde habite el olvido</i> (1934), escrito tras una ruptura amorosa, toma su título de la <b>rima LXVI de Bécquer</b> («donde habite el olvido, / allí estará mi tumba»), y anuncia el giro neorromántico del poeta. El poema homónimo abre el libro.</p>`,
  argumento:'El yo poético expresa, tras el fracaso amoroso, el deseo de desaparecer en un lugar de olvido donde ya no exista el dolor del deseo, donde él mismo quede reducido a memoria de una piedra y el amor deje de ser tormento.',
  temas:[
    ['El desengaño amoroso','El amor vivido como dolor y destrucción.'],
    ['El deseo de olvido y de anulación','Anhelo de desaparecer, cercano a la muerte, como única liberación.'],
    ['Realidad frente a deseo','El tema central de toda la obra de Cernuda.'],
    ['La memoria y el paso del tiempo','Ser solo «memoria» en un lugar remoto.']
  ],
  rasgos:[
    ['Intertextualidad con Bécquer','El título y el verso inicial proceden de la rima LXVI: neorromanticismo.'],
    ['Anáfora','La repetición de «donde» articula el poema como una larga serie de proposiciones de lugar.'],
    ['Verso libre','Combinación de versos de distinta medida (heptasílabos, endecasílabos, alejandrinos) sin rima fija.'],
    ['Imágenes de raíz surrealista','Imágenes visionarias, atenuadas por un tono meditativo.'],
    ['Léxico','Campo semántico de la muerte, la ausencia y el olvido.']
  ],
  flash:[
    ['¿De dónde procede el título «Donde habite el olvido»?','De la rima LXVI de Bécquer.'],
    ['¿Con qué título reúne Cernuda toda su poesía?','La realidad y el deseo.'],
    ['Tema central de la obra de Cernuda','El conflicto entre la realidad y el deseo.'],
    ['¿Qué figura estructura el poema?','La anáfora de «donde».'],
    ['¿Qué movimiento influye en su etapa anterior (Un río, un amor)?','El surrealismo.']
  ],
  frags:[],
  pasajes:['El poema completo (por derechos de autor no se reproduce aquí: pégalo desde tu antología).']
},

{
  id:'nada', t:'Nada', a:'Carmen Laforet', g:'Novela', y:1945, fecha:'1945 (Premio Nadal 1944)',
  mov:'Novela existencial de los años cuarenta', libre:false, c:'#B4371F',
  contexto:`<p>Tras la Guerra Civil, la novela española se rehace en un contexto de censura, hambre y aislamiento. En los años cuarenta conviven la novela triunfalista, el <b>tremendismo</b> (<i>La familia de Pascual Duarte</i>, de Cela, 1942) y la <b>novela existencial</b>, que muestra el malestar, la soledad y la angustia de personajes desarraigados.</p>
<p>Carmen Laforet (Barcelona, 1921 - Madrid, 2004) ganó con <i>Nada</i> la primera edición del <b>Premio Nadal</b> (1944), publicada en 1945. Con solo 23 años renovó la narrativa de posguerra con una protagonista joven que se enfrenta a la miseria física y moral de la Barcelona de 1939-1940.</p>`,
  argumento:'Andrea, una joven huérfana de dieciocho años, llega a Barcelona para estudiar Letras y se instala en el piso de su familia en la calle de Aribau: una casa sucia y decadente donde conviven la abuela, la autoritaria tía Angustias, el tío Juan, pintor fracasado y violento, su mujer Gloria, el inquietante tío Román y la criada Antonia. Frente a ese ambiente opresivo, Andrea encuentra en la universidad la amistad de Ena, de familia burguesa. Tras el suicidio de Román, Andrea se marcha a Madrid con la familia de Ena: se va de la casa sin llevarse, aparentemente, «nada».',
  temas:[
    ['La soledad y la búsqueda de identidad','Andrea madura en un entorno hostil.'],
    ['La miseria física y moral de la posguerra','Hambre, suciedad, violencia doméstica y degradación familiar.'],
    ['La casa como espacio opresivo','El piso de Aribau es un microcosmos de la España vencida.'],
    ['Ilusión frente a realidad','La Barcelona soñada contrasta con la encontrada.'],
    ['La amistad','Ena como refugio y salida.'],
    ['La condición de la mujer','Libertad frente a las normas que impone Angustias.']
  ],
  rasgos:[
    ['Narradora en primera persona','Andrea adulta recuerda retrospectivamente un año de su juventud.'],
    ['Estructura','Tres partes: la casa de Aribau; la amistad con Ena y el mundo universitario; el conflicto con Román y la marcha.'],
    ['Descripciones subjetivas','Sensoriales y a veces expresionistas: la casa y los personajes aparecen deformados.'],
    ['Lirismo','Prosa cuidada con imágenes poéticas que contrastan con la sordidez.'],
    ['Realismo existencial','Angustia, vacío y falta de horizonte en los personajes.']
  ],
  flash:[
    ['¿Qué premio ganó Nada?','La primera edición del Premio Nadal (1944).'],
    ['¿En qué calle vive la familia de Andrea?','En la calle de Aribau, en Barcelona.'],
    ['¿Qué tipo de narrador tiene la novela?','Narradora protagonista en 1.ª persona (Andrea), retrospectiva.'],
    ['¿Quién es Ena?','La amiga universitaria de Andrea, de familia burguesa.'],
    ['¿Cómo termina la novela?','Tras el suicidio de Román, Andrea se va a Madrid con la familia de Ena.'],
    ['¿A qué corriente pertenece Nada?','A la novela existencial de los años cuarenta.']
  ],
  frags:[],
  pasajes:['Comienzo: llegada de Andrea a la estación y al piso de Aribau.','Primera parte: la cena familiar y las peleas de Juan y Gloria.','Segunda parte: Andrea en casa de Ena.','Final: la marcha de Andrea a Madrid.']
},

{
  id:'teresa', t:'Últimas tardes con Teresa', a:'Juan Marsé', g:'Novela', y:1966, fecha:'1966',
  mov:'Del realismo social a la renovación narrativa de los sesenta', libre:false, c:'#B4371F',
  contexto:`<p>Juan Marsé (Barcelona, 1933-2020) es una figura central de la narrativa española de la segunda mitad del siglo XX. Empieza en la estela del <b>realismo social</b> (<i>Encerrados con un solo juguete</i>, 1960; <i>Esta cara de la luna</i>, 1962) y alcanza el éxito con <i>Últimas tardes con Teresa</i> (1966). Más tarde obtiene el Premio Planeta con <i>La muchacha de las bragas de oro</i> (1978) y el Premio Cervantes (2008).</p>
<p><i>Últimas tardes con Teresa</i> marca un punto de inflexión: mantiene la mirada crítica sobre la sociedad, pero supera el realismo social y se acerca a la <b>novela experimental</b> de los setenta. Cobra importancia el <b>discurso</b> (cómo se cuenta) frente a la historia (qué se cuenta), y la prosa recupera su rango artístico, con un estilo complejo e irónico que la sitúa en la tradición europea del desencanto.</p>`,
  argumento:'Manolo Reyes, el Pijoaparte, joven inmigrante andaluz que vive en el barrio del Carmelo y se dedica a robar motos, sueña con escapar de su origen. En una verbena conoce a Maruja, a la que toma por una joven burguesa y que en realidad es criada de los Serrat; así llega a Teresa Serrat, universitaria de familia rica y de ideas progresistas, que lo idealiza como obrero revolucionario. La relación, basada en malentendidos (ella ve en él un militante; él, un ascenso social), fracasa: ni el amor ni la ideología salvan la distancia de clase en la Barcelona franquista.',
  temas:[
    ['La lucha de clases','El choque entre el Carmelo y la burguesía de Sant Gervasi.'],
    ['La hipocresía ideológica','El progresismo burgués que juega a la revolución sin conocer la miseria.'],
    ['El deseo de ascenso social y su fracaso','El sistema es impermeable: Manolo no asciende.'],
    ['El amor como ilusión','Cada uno ama una imagen idealizada del otro.'],
    ['La ciudad como espacio simbólico','Barcelona fragmentada: el monte Carmelo frente a los barrios altos.']
  ],
  rasgos:[
    ['Narrador irónico','Tercera persona que alterna puntos de vista, sin moralizar; incluye monólogo interior y algún pasaje en segunda persona.'],
    ['Lenguaje rico','Voluntad de estilo constante; registros culto (universitarios) y coloquial-marginal (el Carmelo).'],
    ['Ironía y desmitificación','El «Pijoaparte» es un antihéroe ridículo y trágico a la vez.'],
    ['Estructura','La secuencia y el párrafo extenso sustituyen al capítulo tradicional.'],
    ['Espacios simbólicos','El monte Carmelo como espacio mítico.']
  ],
  flash:[
    ['¿Quién es el Pijoaparte?','Manolo Reyes, joven inmigrante del Carmelo que aspira a ascender socialmente.'],
    ['¿Quién es Maruja?','La criada de los Serrat, a quien Manolo toma al principio por una chica rica.'],
    ['¿Qué representa Teresa Serrat?','La burguesía progresista que idealiza al obrero sin conocer su realidad.'],
    ['¿Por qué la obra supera el realismo social?','Da más importancia al discurso que a la historia: estilo elaborado, ironía y técnicas renovadoras.'],
    ['Año de publicación','1966.']
  ],
  frags:[],
  pasajes:['Comienzo: el Pijoaparte en la verbena de San Juan.','Descripción del barrio del Carmelo.','Escenas de las fiestas universitarias.','Final: la detención de Manolo.']
},

{
  id:'figuera', t:'«Libertad»', a:'Ángela Figuera Aymerich', g:'Poesía', y:1955, fecha:'Poesía de posguerra',
  mov:'Poesía social de posguerra', libre:false, c:'#2563EB',
  contexto:`<p>La poesía de posguerra evoluciona desde la <b>poesía arraigada</b> (serena, afín al régimen, en torno a revistas como <i>Garcilaso</i>) y la <b>poesía desarraigada</b> (angustiada y existencial: <i>Hijos de la ira</i>, de Dámaso Alonso, 1944) hacia la <b>poesía social</b> de los años cincuenta, que entiende la poesía como «un instrumento para transformar el mundo» (Gabriel Celaya) y se dirige «a la inmensa mayoría» (Blas de Otero).</p>
<p>Ángela Figuera Aymerich (Bilbao, 1902 - Madrid, 1984) es una de las voces más significativas de esta poesía comprometida, con una mirada propia de mujer y de madre. Entre sus libros destacan <i>Mujer de barro</i>, <i>Vencida por el ángel</i>, <i>El grito inútil</i> y <i>Belleza cruel</i> (publicado en México en 1958 por la censura, con prólogo de León Felipe).</p>`,
  argumento:'Poema de compromiso en el que la libertad aparece como aspiración humana y colectiva, en el marco de la poesía social de posguerra. Lee el poema en tu antología y completa esta ficha con lo que veas.',
  temas:[
    ['La libertad','Como derecho y necesidad humana en un tiempo de opresión.'],
    ['Compromiso y denuncia social','La injusticia, la represión y el sufrimiento colectivo.'],
    ['Solidaridad','El poeta habla por y para «la inmensa mayoría».'],
    ['La mirada femenina','La experiencia de la mujer y la madre como punto de vista.']
  ],
  rasgos:[
    ['Lenguaje claro y directo','Antirretórico, cercano al habla, para llegar a todos.'],
    ['Verso libre','Sin rima fija; ritmo basado en la repetición.'],
    ['Anáforas y enumeraciones','Insistencia expresiva y tono de proclama.'],
    ['Apelación','Imperativos, vocativos, segunda persona y plural colectivo.'],
    ['Tono','Denuncia, rebeldía y esperanza.']
  ],
  flash:[
    ['¿A qué corriente pertenece Ángela Figuera?','A la poesía social de posguerra (años cincuenta).'],
    ['¿Qué libro suyo se publicó en México por la censura?','Belleza cruel (1958), con prólogo de León Felipe.'],
    ['Lema de la poesía social según Celaya','«La poesía es un arma cargada de futuro» / un instrumento para transformar el mundo.'],
    ['¿Qué libro inaugura la poesía desarraigada?','Hijos de la ira, de Dámaso Alonso (1944).']
  ],
  frags:[],
  pasajes:['El poema completo (por derechos de autor no se reproduce aquí: pégalo desde tu antología).']
},
